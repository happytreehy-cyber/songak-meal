<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>송악고등학교 석식 출입관리시스템</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      background: #1e293b;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #facc15;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .badge { background: #2563eb; color: #fff; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 16px; }
    .main-title { font-size: 22px; font-weight: bold; letter-spacing: -0.5px; }
    .time-box { background: #0f172a; padding: 6px 14px; border-radius: 8px; border: 1px solid #38bdf8; color: #38bdf8; font-family: monospace; font-size: 16px; font-weight: bold; }

    .header-right { display: flex; align-items: center; gap: 12px; }
    .stat-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid transparent;
    }
    .stat-total { background: #1e293b; border-color: #eab308; color: #fef08a; }
    .stat-done { background: #064e3b; border-color: #10b981; color: #a7f3d0; }
    .stat-rem { background: #451a03; border-color: #f97316; color: #fed7aa; }

    main {
      flex: 1;
      display: flex;
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }

    .scanner-panel {
      flex: 1.1;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    #reader {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
    .scanner-footer {
      background: #0f172a;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      color: #38bdf8;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .info-panel {
      flex: 0.9;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      transition: all 0.2s ease;
    }
    .photo-box {
      width: 200px;
      height: 240px;
      border: 3px solid #facc15;
      border-radius: 12px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; }
    .photo-placeholder { font-size: 18px; color: #94a3b8; font-weight: bold; }
    .status-msg { font-size: 32px; font-weight: 800; margin-bottom: 8px; color: #f8fafc; }
    .student-id { font-size: 22px; color: #94a3b8; margin-bottom: 20px; font-weight: bold; }
    .action-badge {
      width: 85%;
      padding: 14px;
      background: #334155;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #cbd5e1;
      margin-bottom: 12px;
    }
    .recent-log { font-size: 13px; color: #64748b; }

    /* 통과 / 중복 / 차단 효과 */
    .status-pass { color: #22c55e !important; }
    .status-warn { color: #f59e0b !important; }
    .status-fail { color: #ef4444 !important; }

    .panel-pass { border: 2px solid #22c55e !important; box-shadow: 0 0 25px rgba(34, 197, 94, 0.4); }
    .panel-warn { border: 2px solid #f59e0b !important; box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); }
    .panel-fail { border: 2px solid #ef4444 !important; box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }

    #startOverlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 17, 32, 0.88);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      cursor: pointer;
    }
    #startOverlay button {
      background: #2563eb; color: #fff; font-size: 20px; font-weight: bold;
      padding: 14px 28px; border: none; border-radius: 10px; cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="badge">송악고</div>
      <div class="main-title">석식 출입관리시스템</div>
      <div class="time-box" id="clock">00:00:00</div>
    </div>
    <div class="header-right">
      <div class="stat-card stat-total">📋 총신청 <span id="totalCount">-</span></div>
      <div class="stat-card stat-done">🍱 식사완료 <span id="doneCount">0</span></div>
      <div class="stat-card stat-rem">⏳ 미식사 <span id="remCount">-</span></div>
    </div>
  </header>

  <main>
    <div class="scanner-panel" id="scannerCard">
      <div id="reader">
        <div id="startOverlay">
          <button onclick="initScanner()">📷 카메라 켜기</button>
          <div style="margin-top: 12px; color: #94a3b8; font-size: 14px;">화면을 클릭하면 카메라와 소리가 시작됩니다</div>
        </div>
      </div>
      <div class="scanner-footer" id="scannerFooter">
        ⚡ 로컬 초고속 모드: 스치면 0.05초 만에 즉시 승인
      </div>
    </div>

    <div class="info-panel" id="infoPanel">
      <div class="photo-box" id="photoBox">
        <div class="photo-placeholder" id="photoText">사진 대기</div>
      </div>
      <div class="status-msg" id="statusMsg">대기 중</div>
      <div class="student-id" id="studentSub">명찰 QR을 비춰주세요</div>
      <div class="action-badge" id="actionMsg">스캔 준비 완료</div>
      <div class="recent-log" id="recentLog">최근 기록: 없음</div>
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLF1Qw6ZtwWp3MsKakjIsOxUXRSmjqbxOvUBQ7QzAUw7IPacjHAJuL2FjpCMzj8b7t/exec";

    let html5QrCode = null;
    let isProcessing = false;
    let studentDB = {}; 
    
    // ★ 당일 식사 완료 학생 학번 및 통과 시간 기록 (중복 방지용)
    let completedMap = new Map(); 
    let totalApplicantCount = 0;

    // ==========================================
    // 🔔 맑은 2단 차임벨 '띵~동♪' 사운드
    // ==========================================
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playDingDong() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        playChimeNote(ctx, 784, now, 0.35);        // 높은 솔 (G5)
        playChimeNote(ctx, 659.25, now + 0.16, 0.55); // 미 (E5)
      } catch (e) {}
    }

    function playChimeNote(ctx, freq, startTime, duration) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0.4, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    // 중복 / 거절 경고음: 삐-삐-
    function playFailSound() {
      try {
        const ctx = getAudioContext();
        [0, 0.16].forEach(delay => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(260, ctx.currentTime + delay);
          gain.gain.setValueAtTime(0.35, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.13);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 0.13);
        });
      } catch (e) {}
    }

    // ==========================================
    // 🚀 학생 명단 사전 로딩
    // ==========================================
    async function loadStudentDatabase() {
      try {
        document.getElementById("actionMsg").innerText = "학생 명단 동기화 중...";
        const res = await fetch(`${SCRIPT_URL}?action=getAll`);
        const json = await res.json();
        
        if (json.success) {
          studentDB = json.data;
          totalApplicantCount = Object.values(studentDB).filter(s => s.isApplied).length;
          document.getElementById("totalCount").innerText = totalApplicantCount;
          updateCounts();
          document.getElementById("actionMsg").innerText = "스캔 준비 완료 (고속 모드)";
        }
      } catch (e) {
        document.getElementById("actionMsg").innerText = "명찰 QR을 스캔하세요";
      }
    }

    function updateClock() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      document.getElementById("clock").innerText = 
        `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ==========================================
    // 📷 카메라 초기화
    // ==========================================
    async function initScanner() {
      document.getElementById("startOverlay").style.display = "none";
      getAudioContext();

      try {
        if (html5QrCode) {
          try { await html5QrCode.stop(); } catch(e) {}
        }
        html5QrCode = new Html5Qrcode("reader");

        const config = {
          fps: 25,
          qrbox: (w, h) => {
            const size = Math.min(w, h);
            return { width: Math.floor(size * 0.85), height: Math.floor(size * 0.85) };
          },
          aspectRatio: 1.0,
          videoConstraints: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };

        await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, () => {});
      } catch (err) {
        try {
          const devices = await Html5Qrcode.getCameras();
          if (devices && devices.length > 0) {
            let camId = devices[0].id;
            const backCam = devices.find(d => d.label.toLowerCase().includes("back") || d.label.toLowerCase().includes("environment"));
            if (backCam) camId = backCam.id;
            await html5QrCode.start(camId, { fps: 20 }, onScanSuccess, () => {});
          }
        } catch (e) {
          document.getElementById("startOverlay").style.display = "flex";
        }
      }
    }

    // ==========================================
    // ⚡ QR 감지 및 중복 검증 로직
    // ==========================================
    function onScanSuccess(decodedText) {
      const studentId = String(decodedText).trim();
      if (!studentId || isProcessing) return;

      isProcessing = true;

      // 1. [중복 체크] 이미 오늘 식사 확인을 마친 학생인 경우
      if (completedMap.has(studentId)) {
        playFailSound(); // 경고음 삐-삐-
        const firstTime = completedMap.get(studentId);
        const student = (studentDB && studentDB[studentId]) ? studentDB[studentId] : { id: studentId, name: "" };
        showDuplicateUI(student, firstTime);
        setTimeout(() => { resetUI(); isProcessing = false; }, 1800);
        return;
      }

      // 2. [로컬 캐시 확인] 정상 신청자인 경우 즉시 승인!
      if (studentDB && studentDB[studentId]) {
        const student = studentDB[studentId];
        if (student.isApplied) {
          const nowStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          completedMap.set(studentId, nowStr); // 중복 방지 등록

          playDingDong(); // 🔔 띵~동♪
          showApprovedUI(student);
          updateCounts();

          // 구글 시트 전송
          fetch(`${SCRIPT_URL}?id=${encodeURIComponent(studentId)}`).catch(()=>{});
        } else {
          playFailSound(); // 미신청 차단음
          showRejectedUI("석식 미신청 학생입니다", student);
        }
        
        setTimeout(() => { resetUI(); isProcessing = false; }, 1400);
        return;
      }

      // 3. 캐시에 없는 경우 서버 직접 조회
      fetch(`${SCRIPT_URL}?id=${encodeURIComponent(studentId)}`)
        .then(res => res.json())
        .then(result => {
          if (result.success) {
            const nowStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            completedMap.set(studentId, nowStr);

            playDingDong();
            showApprovedUI(result.student);
            updateCounts();
          } else {
            playFailSound();
            showRejectedUI(result.message, result.student);
          }
        })
        .catch(() => {
          playFailSound();
          showErrorUI("통신 에러가 발생했습니다.");
        })
        .finally(() => {
          setTimeout(() => { resetUI(); isProcessing = false; }, 1400);
        });
    }

    // ==========================================
    // UI 반응 함수
    // ==========================================
    // 1) 정상 승인 UI
    function showApprovedUI(student) {
      const infoPanel = document.getElementById("infoPanel");
      infoPanel.className = "info-panel panel-pass";

      document.getElementById("statusMsg").innerText = "식사 승인 ✅";
      document.getElementById("statusMsg").className = "status-msg status-pass";
      document.getElementById("studentSub").innerText = `${student.id} ${student.name}`;
      document.getElementById("actionMsg").innerText = "맛있게 드세요!";
      document.getElementById("actionMsg").style.background = "#059669";
      document.getElementById("recentLog").innerText = `최근 통과: ${student.id} ${student.name}`;

      if (student.photoUrl) {
        document.getElementById("photoBox").innerHTML = `<img src="${student.photoUrl}" alt="사진">`;
      } else {
        document.getElementById("photoBox").innerHTML = `<div class="photo-placeholder" style="color:#10b981;">승인 완료</div>`;
      }
    }

    // 2) ★ 중복 체크 경고 UI
    function showDuplicateUI(student, time) {
      const infoPanel = document.getElementById("infoPanel");
      infoPanel.className = "info-panel panel-warn";

      document.getElementById("statusMsg").innerText = "중복 체크 ⚠️";
      document.getElementById("statusMsg").className = "status-msg status-warn";
      document.getElementById("studentSub").innerText = `${student.id} ${student.name || ''}`;
      document.getElementById("actionMsg").innerText = `이미 확인된 학생 (${time} 통과)`;
      document.getElementById("actionMsg").style.background = "#d97706";

      document.getElementById("photoBox").innerHTML = `<div class="photo-placeholder" style="color:#f59e0b;">이미 통과함</div>`;
    }

    // 3) 미신청 차단 UI
    function showRejectedUI(msg, student) {
      const infoPanel = document.getElementById("infoPanel");
      infoPanel.className = "info-panel panel-fail";

      document.getElementById("statusMsg").innerText = "출입 차단 ❌";
      document.getElementById("statusMsg").className = "status-msg status-fail";
      document.getElementById("studentSub").innerText = student ? `${student.id} ${student.name}` : "미신청 학생";
      document.getElementById("actionMsg").innerText = msg || "석식 미신청자입니다";
      document.getElementById("actionMsg").style.background = "#dc2626";

      document.getElementById("photoBox").innerHTML = `<div class="photo-placeholder" style="color:#ef4444;">승인 거부</div>`;
    }

    function showErrorUI(msg) {
      document.getElementById("statusMsg").innerText = "오류 발생 ⚠️";
      document.getElementById("statusMsg").className = "status-msg status-fail";
      document.getElementById("actionMsg").innerText = msg;
    }

    function resetUI() {
      const infoPanel = document.getElementById("infoPanel");
      infoPanel.className = "info-panel";
      document.getElementById("statusMsg").innerText = "대기 중";
      document.getElementById("statusMsg").className = "status-msg";
      document.getElementById("studentSub").innerText = "명찰 QR을 비춰주세요";
      document.getElementById("actionMsg").innerText = "명찰 QR을 스캔하세요";
      document.getElementById("actionMsg").style.background = "#334155";
      document.getElementById("photoBox").innerHTML = `<div class="photo-placeholder">사진 대기</div>`;
    }

    function updateCounts() {
      document.getElementById("doneCount").innerText = completedMap.size;
      if (totalApplicantCount > 0) {
        document.getElementById("remCount").innerText = Math.max(0, totalApplicantCount - completedMap.size);
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadStudentDatabase();
      initScanner();
    });

    document.body.addEventListener("click", () => {
      getAudioContext();
      const video = document.querySelector("#reader video");
      if (!video || video.paused) {
        initScanner();
      }
    }, { once: true });
  </script>
</body>
</html>
