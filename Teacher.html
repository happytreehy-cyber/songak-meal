<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>💻 송악고 석식 모니터링 (교사용)</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f1f5f9; font-family: 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header { background-color: #1e293b; color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 15px; flex-wrap: nowrap; }
    .title { font-size: 20pt; font-weight: bold; color: #60a5fa; white-space: nowrap; }
    .clock { font-size: 14pt; font-weight: bold; color: #94a3b8; white-space: nowrap; margin-top: 4px; }
    .header-right { display: flex; gap: 10px; }
    .top-btn { padding: 8px 15px; font-size: 13pt; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: white; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    .btn-refresh { background: #3b82f6; } .btn-refresh:active { transform: scale(0.95); }
    .btn-sound { background: #8b5cf6; } .btn-sound:active { transform: scale(0.95); }
    .main-container { display: flex; flex: 1; padding: 15px; gap: 15px; height: calc(100vh - 80px); box-sizing: border-box; }
    .left-panel { flex: 2; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
    .photo-grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: white; padding: 10px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-y: auto; align-content: start; min-height: 250px; }
    .student-card { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; animation: slideDown 0.3s ease-out; position: relative; }
    .student-card.allergy { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
    .student-card.unauth { border-color: #ef4444; background: #fef2f2; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
    .newest-badge { display: none; position: absolute; top: -5px; background: #ef4444; color: white; padding: 4px 12px; border-radius: 15px; font-weight: 900; font-size: 11pt; box-shadow: 0 4px 10px rgba(239,68,68,0.5); z-index: 20; animation: bounce 1s infinite; letter-spacing: 1px; }
    .student-card:first-child .newest-badge { display: block; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .btn-close-card { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 26px; height: 26px; font-size: 10pt; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 100; transition: 0.2s; }
    .btn-close-card:hover { background: #ef4444; }
    .student-photo { width: 100%; height: 130px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 30pt; color: #94a3b8; object-fit: contain; box-sizing: border-box; border-bottom: 1px solid #cbd5e1; }
    .student-info { margin-top: 5px; text-align: center; width: 100%; padding: 0 5px; box-sizing: border-box; }
    .student-id { font-size: 12pt; font-weight: bold; color: #64748b; }
    .student-name { font-size: 18pt; font-weight: 900; color: #1e293b; margin: 2px 0; }
    .student-note { background: #fee2e2; color: #dc2626; padding: 2px 8px; border-radius: 15px; font-weight: bold; font-size: 10pt; display: inline-block; margin-top: 2px; }
    .manual-badge { position: absolute; top: 5px; right: 5px; background: #10b981; color: white; font-weight: bold; padding: 4px 8px; border-radius: 8px; font-size: 10pt; box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 10; }
    .unauth-badge { position: absolute; top: 5px; right: 5px; background: #ef4444; color: white; font-weight: bold; padding: 4px 8px; border-radius: 8px; font-size: 10pt; box-shadow: 0 2px 6px rgba(239,68,68,0.5); z-index: 10; animation: blinker 1s linear infinite; }
    .unfed-box { height: 260px; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; }
    .unfed-grid { display: flex; flex: 1; overflow: hidden; }
    .unfed-col { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #f1f5f9; }
    .unfed-col:last-child { border-right: none; }
    .grade-title { background: #334155; color: white; padding: 8px; text-align: center; font-size: 14pt; font-weight: bold; }
    .grade-list { flex: 1; overflow-y: auto; padding: 10px; font-size: 12pt; line-height: 1.6; }
    .unfed-item { padding: 5px; border-bottom: 1px dashed #cbd5e1; display: flex; justify-content: space-between; align-items: center; }
    .right-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; position: relative; overflow: hidden; }
    .stats-box { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .stats-badges-container { display: flex; gap: 10px; justify-content: space-between; }
    .stat-badge { flex: 1; padding: 12px 5px; border-radius: 10px; font-size: 13pt; font-weight: bold; text-align: center; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .stat-total { background: #3b82f6; cursor: pointer; transition: 0.2s; } .stat-total:hover { transform: scale(1.02); }
    .stat-done { background: #10b981; } .stat-left { background: #ef4444; }
    .stat-num { font-size: 22pt; display: block; margin-top: 5px; }
    .log-box { flex: 1; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; }
    .log-title { background: #1e293b; color: white; padding: 12px 20px; font-size: 14pt; font-weight: bold; }
    .log-content { flex: 1; overflow-y: auto; padding: 10px; font-size: 13pt; line-height: 1.8; }
    .log-row { padding: 6px 10px; border-bottom: 1px solid #f1f5f9; display: flex; gap: 10px; }
    .log-time { color: #94a3b8; font-family: monospace; }
    .log-error-red { color: white; font-weight: bold; background: #ef4444; padding: 3px 10px; border-radius: 6px; }
    .log-error-orange { color: white; font-weight: bold; background: #f97316; padding: 3px 10px; border-radius: 6px; }
    .log-manual-green { color: white; font-weight: bold; background: #10b981; padding: 3px 10px; border-radius: 6px; }
    #alert-modal { display: none; position: absolute; bottom: 20px; right: 20px; z-index: 999; }
    .alert-content { background: #ef4444; padding: 30px; border-radius: 15px; border: 4px solid #b91c1c; text-align: center; box-shadow: 0 10px 30px rgba(239,68,68,0.7); width: 320px; }
    .alert-content.animating { animation: popAlert 0.3s infinite alternate; }
    .alert-icon { font-size: 40pt; margin-bottom: 5px; }
    .alert-msg { font-size: 16pt; font-weight: 900; color: white; margin-bottom: 15px; line-height: 1.5; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
    .btn-confirm { background: white; color: #ef4444; border: none; padding: 12px 20px; font-size: 14pt; font-weight: 900; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: 100%; }
    #stats-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
    .stats-modal-content { background: white; padding: 30px; border-radius: 15px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .grade-stat-row { display: flex; justify-content: space-between; font-size: 14pt; padding: 12px 0; border-bottom: 1px solid #e2e8f0; font-weight: bold; }
  </style>
</head>
<body>
  
  <div id="teacher-closed-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; flex-direction:column; justify-content:center; align-items:center; color:white;">
    <div style="font-size:80pt; margin-bottom:20px;">🛑</div>
    <h1 style="color:#ef4444; font-size:30pt; font-weight:900;">교사용 모니터가 차단되었습니다</h1>
    <p style="color:#9ca3af; font-size:16pt;">구글 시트 메뉴 [🔒 웹 화면 차단/열기 제어] 에서 열어주세요.</p>
  </div>

  <div id="stats-modal">
    <div class="stats-modal-content">
      <h2 style="margin-top:0; color:#2563eb; text-align:center;">📊 학년별 식사 현황</h2>
      <div id="stats-detail-content">로딩 중...</div>
      <button style="width:100%; padding:15px; margin-top:20px; background:#475569; color:white; font-size:14pt; font-weight:bold; border:none; border-radius:8px; cursor:pointer;" onclick="closeStatsModal()">닫기</button>
    </div>
  </div>

  <div class="header">
    <div class="header-left">
      <div class="title">💻 송악고 석식 모니터링 (교사용)</div>
      <div class="clock" id="live-clock">2026. 00. 00. 00:00:00</div>
    </div>
    <div class="header-right">
      <button class="top-btn btn-sound" id="sound-btn" onclick="toggleSound()">🔊 소리 켜짐</button>
      <!-- 강제 새로고침 적용 -->
      <button class="top-btn btn-refresh" onclick="window.location.href = window.location.href.split('?')[0] + '?t=' + new Date().getTime();">🔄 화면 새로고침</button>
    </div>
  </div>

  <div class="main-container">
    <div class="left-panel">
      <div class="photo-grid" id="photo-grid"></div>
      <div class="unfed-box">
        <div class="unfed-grid">
          <div class="unfed-col"><div class="grade-title">1학년 미식사</div><div class="grade-list" id="unfed-1">로딩 중...</div></div>
          <div class="unfed-col"><div class="grade-title">2학년 미식사</div><div class="grade-list" id="unfed-2">로딩 중...</div></div>
          <div class="unfed-col"><div class="grade-title">3학년 미식사</div><div class="grade-list" id="unfed-3">로딩 중...</div></div>
        </div>
      </div>
    </div>

    <div class="right-panel">
      <div class="stats-box">
        <div class="stats-badges-container">
          <div class="stat-badge stat-total" onclick="openStatsModal()">총 신청 (클릭👆)<span class="stat-num" id="stat-total">0</span></div>
          <div class="stat-badge stat-done">식사 완료<span class="stat-num" id="stat-done">0</span></div>
          <div class="stat-badge stat-left">남은 인원<span class="stat-num" id="stat-left">0</span></div>
        </div>
      </div>
      <div class="log-box">
        <div class="log-title">📹 실시간 블랙박스 기록 (최근 스캔 맨위로)</div>
        <div class="log-content" id="log-content">로딩 중...</div>
      </div>
      <div id="alert-modal">
        <div class="alert-content animating" id="alert-box">
          <div class="alert-icon">🚨</div><div class="alert-msg" id="alert-text">경고!</div>
          <button class="btn-confirm" onclick="closeAlert()">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKZBLj0pzD0dNU_fAvhF6j6x3Xzl7PL5-yYJabG8oZ45qBKonZa2r-9YsJ7-eJkElY/exec";
    let isSoundEnabled = true; let audioCtx = null;
    let localResetTime = "0"; 

    // ★ 2.5초마다 다이렉트로 빠르게 가져오기 (5분 렉 원천 차단)
    window.onload = function() { 
      audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
      refreshData(); 
      setInterval(refreshData, 2500); 
    };
    
    window.onclick = function() { if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); };

    function toggleSound() {
      isSoundEnabled = !isSoundEnabled; let btn = document.getElementById('sound-btn');
      if (isSoundEnabled) { btn.innerText = "🔊 소리 켜짐"; btn.style.background = "#8b5cf6"; if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } 
      else { btn.innerText = "🔇 소리 꺼짐"; btn.style.background = "#64748b"; }
    }

    function playBeep(type) {
      if (!isSoundEnabled || !audioCtx) return; if (audioCtx.state === 'suspended') audioCtx.resume();
      if (type === 'success') { const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1); osc.connect(gainNode); gainNode.connect(audioCtx.destination); gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); } 
      else if (type === 'duplicate') { const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(440, audioCtx.currentTime); osc.connect(gainNode); gainNode.connect(audioCtx.destination); gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime); gainNode.gain.setValueAtTime(0, audioCtx.currentTime + 0.1); gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + 0.15); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); } 
      else if (type === 'error') { const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.connect(gainNode); gainNode.connect(audioCtx.destination); gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.15); const osc2 = audioCtx.createOscillator(), gainNode2 = audioCtx.createGain(); osc2.type = 'sawtooth'; osc2.frequency.setValueAtTime(300, audioCtx.currentTime + 0.2); osc2.connect(gainNode2); gainNode2.connect(audioCtx.destination); gainNode2.gain.setValueAtTime(0.3, audioCtx.currentTime + 0.2); gainNode2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35); osc2.start(audioCtx.currentTime + 0.2); osc2.stop(audioCtx.currentTime + 0.35); }
    }

    let lastProcessedLogTime = ""; let currentStatsDetails = null;

    setInterval(() => { let now = new Date(); document.getElementById('live-clock').innerText = now.getFullYear() + ". " + String(now.getMonth()+1).padStart(2,'0') + ". " + String(now.getDate()).padStart(2,'0') + ". " + now.toLocaleTimeString('ko-KR'); }, 1000);

    let alertTimer = null;
    function triggerAlert(msg) {
      document.getElementById('alert-text').innerHTML = msg; document.getElementById('alert-modal').style.display = 'block'; document.getElementById('alert-box').classList.add('animating');
      if(alertTimer) clearTimeout(alertTimer); alertTimer = setTimeout(() => { closeAlert(); }, 3500);
    }
    function closeAlert() { document.getElementById('alert-box').classList.remove('animating'); setTimeout(() => { document.getElementById('alert-modal').style.display = 'none'; }, 200); }
    function removeCard(btn) { btn.parentElement.remove(); }

    function openStatsModal() {
      if(!currentStatsDetails) return; let html = "";
      [1, 2, 3].forEach(grade => { let st = currentStatsDetails[grade]; if(st) html += `<div class="grade-stat-row"><span style="color:#2563eb;">${grade}학년</span> <span>총: ${st.total}명</span> <span style="color:#10b981;">완료: ${st.done}명</span> <span style="color:#ef4444;">미식사: ${st.left}명</span></div>`; });
      document.getElementById('stats-detail-content').innerHTML = html; document.getElementById('stats-modal').style.display = 'flex';
    }
    function closeStatsModal() { document.getElementById('stats-modal').style.display = 'none'; }

    // ★ 통신 끊김 대비 불도저 엔진 (10초 안에 안 오면 버리고 다음 턴에 다시!)
    function fetchWithTimeout(url, timeout = 10000) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        return fetch(url, { signal: controller.signal }).then(res => { clearTimeout(id); return res; }).catch(err => { clearTimeout(id); throw err; });
    }

    let isRefreshing = false;
    function refreshData() {
      if(isRefreshing) return;
      isRefreshing = true;
      let cacheBuster = "&t=" + new Date().getTime();
      fetchWithTimeout(SCRIPT_URL + "?action=GET_TEACHER_DATA" + cacheBuster, 8000)
        .then(r => r.json())
        .then(res => {
          isRefreshing = false;
          if (res.status === "SUCCESS") {
            if (localResetTime !== "0" && res.reset_time && res.reset_time !== localResetTime) {
                window.location.reload(true);
                return;
            }
            localResetTime = res.reset_time || "0";

            if (res.teacher_sys_status === "CLOSED") document.getElementById('teacher-closed-overlay').style.display = 'flex';
            else document.getElementById('teacher-closed-overlay').style.display = 'none';

            document.getElementById('stat-total').innerText = res.stats.total; document.getElementById('stat-done').innerText = res.stats.done; document.getElementById('stat-left').innerText = res.stats.left;
            
            let h1 = "", h2 = "", h3 = "";
            res.unfed.forEach(s => {
              let grade = s.id.charAt(0), noteHtml = s.note ? `<span style="color:#ef4444; font-weight:bold; font-size:11pt;">[${s.note}]</span>` : "";
              let item = `<div class="unfed-item"><span style="color:#475569; font-weight:bold;">${s.id} ${s.name}</span> ${noteHtml}</div>`;
              if (grade === '1') h1 += item; else if (grade === '2') h2 += item; else if (grade === '3') h3 += item;
            });
            let emptyMsg = "<div style='text-align:center; padding:15px; color:#94a3b8; font-weight:bold;'>완료 🎉</div>";
            document.getElementById('unfed-1').innerHTML = h1 || emptyMsg; document.getElementById('unfed-2').innerHTML = h2 || emptyMsg; document.getElementById('unfed-3').innerHTML = h3 || emptyMsg;
            
            currentStatsDetails = res.details; 
            processLogs(res.blackbox);
          }
        }).catch(err => {
          isRefreshing = false;
          console.log("통신 지연, 다음 주기에 재시도합니다.");
        });
    }

    function processLogs(logs) {
      if (!logs || logs.length === 0) return;
      let logHtml = ""; 
      for (let i = 0; i < logs.length; i++) {
        let log = logs[i], timeStr = new Date(log.time).toLocaleTimeString('ko-KR'); 
        if (!log.id && !log.name) continue; 
        let rowClass = "";
        if (log.status.includes("무단")) rowClass = "log-error-red"; else if (log.status.includes("중복")) rowClass = "log-error-orange"; else if (log.status.includes("수동")) rowClass = "log-manual-green";
        logHtml += `<div class="log-row"><span class="log-time">[${timeStr}]</span> <span class="${rowClass}">${log.id} ${log.name} - ${log.status}</span></div>`;
      }
      document.getElementById('log-content').innerHTML = logHtml;

      let currentLatestId = logs[0].time + "_" + logs[0].id;
      if (lastProcessedLogTime !== "" && currentLatestId === lastProcessedLogTime) return; 

      let newFaces = [];
      if (lastProcessedLogTime !== "") {
        let pendingLogs = [];
        for(let i=0; i<logs.length; i++) { if ((logs[i].time + "_" + logs[i].id) === lastProcessedLogTime) break; pendingLogs.unshift(logs[i]); }
        pendingLogs.forEach(log => {
          let allergyClass = log.status.includes("알레르기") ? "allergy" : "", unauthClass = log.status.includes("무단") ? "unauth" : "", badgeHtml = "";
          
          if (log.status.includes("무단")) { playBeep('error'); triggerAlert(`🚨 무단 접근!<br><span style="color:#fef08a;">${log.id} ${log.name}</span><br>미신청자입니다!`); badgeHtml = `<div class="unauth-badge">🚨 무단접근</div>`; } 
          else if (log.status.includes("중복")) { playBeep('duplicate'); triggerAlert(`⚠️ 중복 식사!<br><span style="color:#fef08a;">${log.id} ${log.name}</span><br>이미 통과한 학생!`); } 
          else if (log.status.includes("수동")) { playBeep('success'); badgeHtml = `<div class="manual-badge">✅ 수동입력</div>`; } 
          else { playBeep('success'); }

          if(!log.status.includes("중복")) {
            // ★ .jpeg / .jpg / .jpeg.jpeg 어떤 확장자도 완벽하게 찾아내는 마법의 코드!
            let photoHtml = `<img src="https://happytreehy-cyber.github.io/songak-meal/${log.id}.jpeg" class="student-photo" 
              onerror="
                if(!this.getAttribute('data-fail1')) {
                  this.setAttribute('data-fail1','1'); 
                  this.src='https://happytreehy-cyber.github.io/songak-meal/${log.id}.jpg';
                } else if(!this.getAttribute('data-fail2')) {
                  this.setAttribute('data-fail2','1'); 
                  this.src='https://happytreehy-cyber.github.io/songak-meal/${log.id}.jpeg.jpeg';
                } else {
                  this.outerHTML='<div class=\\'student-photo\\'>👤</div>';
                }
              ">`;
            let faceCard = `<div class="student-card ${allergyClass} ${unauthClass}"><div class="newest-badge">🔥 방금 스캔</div><button class="btn-close-card" onclick="removeCard(this)">✖</button>${badgeHtml}${photoHtml}<div class="student-info"><div class="student-id">${log.id}</div><div class="student-name">${log.name}</div>${allergyClass ? `<div class="student-note">알레르기 주의</div>` : ""}</div></div>`;
            newFaces.unshift(faceCard); 
          }
        });
      } else {
        let log = logs[0];
        if (!log.status.includes("중복")) {
            let allergyClass = log.status.includes("알레르기") ? "allergy" : "", unauthClass = log.status.includes("무단") ? "unauth" : "";
            let badgeHtml = log.status.includes("수동") ? `<div class="manual-badge">✅ 수동입력</div>` : (log.status.includes("무단") ? `<div class="unauth-badge">🚨 무단접근</div>` : "");
            
            let photoHtml = `<img src="https://happytreehy-cyber.github.io/songak-meal/${log.id}.jpeg" class="student-photo" 
              onerror="
                if(!this.getAttribute('data-fail1')) {
                  this.setAttribute('data-fail1','1'); 
                  this.src='https://happytreehy-cyber.github.io/songak-meal/${log.id}.jpg';
                } else if(!this.getAttribute('data-fail2')) {
                  this.setAttribute('data-fail2','1'); 
                  this.src='https://happytreehy-cyber.github.io/songak-meal/${log.id}.jpeg.jpeg';
                } else {
                  this.outerHTML='<div class=\\'student-photo\\'>👤</div>';
                }
              ">`;
            let faceCard = `<div class="student-card ${allergyClass} ${unauthClass}"><div class="newest-badge">🔥 방금 스캔</div><button class="btn-close-card" onclick="removeCard(this)">✖</button>${badgeHtml}${photoHtml}<div class="student-info"><div class="student-id">${log.id}</div><div class="student-name">${log.name}</div>${allergyClass ? `<div class="student-note">알레르기 주의</div>` : ""}</div></div>`;
            newFaces.push(faceCard);
        }
      }
      
      lastProcessedLogTime = currentLatestId; 
      if (newFaces.length > 0) {
        let grid = document.getElementById('photo-grid');
        grid.insertAdjacentHTML('afterbegin', newFaces.join(""));
        while(grid.children.length > 12) { grid.removeChild(grid.lastChild); } 
      }
    }
  </script>
</body>
</html>
