<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>송악고등학교 저녁밥 출입관리시스템</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* 상단 헤더 */
    header {
      background: #1e293b;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #facc15;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .school-badge { background: #2563eb; color: #fff; font-weight: 900; font-size: 1.15rem; padding: 6px 14px; border-radius: 8px; }
    .header-title { font-size: 1.6rem; font-weight: 900; letter-spacing: -0.5px; }
    .clock-badge { background: #0f172a; border: 2px solid #38bdf8; color: #38bdf8; font-size: 1.2rem; font-weight: 800; padding: 6px 16px; border-radius: 8px; }

    /* 통계 바: 노란색(총신청), 초록색(식사완료), 주황색(미식사) */
    .header-stats { display: flex; gap: 14px; }
    .stat-pill {
      background: #0f172a;
      padding: 8px 18px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.15s, background 0.2s;
    }
    .stat-pill:active { transform: scale(0.95); }
    
    /* 1. 총신청 (노란 테두리) */
    .pill-total { border: 3px solid #facc15; }
    .pill-total .stat-label { color: #facc15; }
    .pill-total .stat-val { color: #ffffff; }

    /* 2. 식사완료 (초록 테두리) */
    .pill-eat { border: 3px solid #22c55e; }
    .pill-eat .stat-label { color: #4ade80; }
    .pill-eat .stat-val { color: #4ade80; }

    /* 3. 미식사 (주황색 테두리 & 주황색 강조) */
    .pill-remain { border: 3px solid #f97316; background: #2a1205; }
    .pill-remain .stat-label { color: #fb923c; font-weight: 900; }
    .pill-remain .stat-val { color: #ffedd5; font-weight: 900; }

    .stat-label { font-size: 1.15rem; font-weight: 800; }
    .stat-val { font-weight: 900; font-size: 1.75rem; }

    /* 화면 분할 */
    .main-container { flex: 1; display: flex; padding: 14px; gap: 16px; height: calc(100vh - 75px); }

    /* 카메라 영역: 화면 왼쪽을 시원하게 꽉 채우도록 flex 및 width 극대화 */
    .scanner-pane {
      flex: 1.3;
      background: #1e293b;
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 3px solid #334155;
      position: relative;
    }
    #reader {
      width: 100% !important;
      height: 90% !important;
      border-radius: 14px;
      overflow: hidden;
      border: none !important;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important; /* 화면 가득 채우기 */
      border-radius: 12px;
    }
    .scanner-tip { margin-top: 10px; color: #38bdf8; font-weight: 900; font-size: 1.2rem; }

    /* 우측 결과 카드 */
    .result-pane {
      flex: 1;
      background: #1e293b;
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 4px solid #475569;
      transition: all 0.2s ease;
      position: relative;
    }

    .result-pane.state-success { background: #064e3b !important; border-color: #22c55e !important; }
    .result-pane.state-warning { background: #7f1d1d !important; border-color: #ef4444 !important; }

    .photo-container {
      width: 220px;
      height: 270px;
      border-radius: 14px;
      border: 4px solid #facc15;
      background: #0f172a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .photo-container img { width: 100%; height: 100%; object-fit: cover; }
    .photo-none { color: #94a3b8; font-size: 1.2rem; font-weight: 700; }

    .student-name { font-size: 3rem; font-weight: 900; margin-bottom: 4px; }
    .student-id { font-size: 1.6rem; color: #cbd5e1; font-weight: 800; margin-bottom: 18px; }

    .status-banner {
      width: 92%;
      padding: 16px 20px;
      border-radius: 50px;
      font-size: 1.7rem;
      font-weight: 900;
      text-align: center;
      background: #334155;
      color: #cbd5e1;
    }
    .status-banner.pass { background: #22c55e; color: #022c22; }
    .status-banner.fail { background: #ef4444; color: #ffffff; }

    .recent-log { position: absolute; bottom: 12px; font-size: 1rem; color: #94a3b8; font-weight: 600; }

    /* 학년별 팝업 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .modal-card {
      background: #1e293b;
      border: 4px solid #facc15;
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 440px;
      text-align: center;
    }
    .modal-title { font-size: 1.8rem; font-weight: 900; color: #facc15; margin-bottom: 24px; }
    .grade-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      margin-bottom: 12px;
      background: #0f172a;
      border-radius: 12px;
      border: 1px solid #334155;
      font-size: 1.3rem;
      font-weight: 800;
    }
    .grade-num { font-size: 1.8rem; font-weight: 900; color: #38bdf8; }
    .btn-close {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      background: #facc15;
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-size: 1.3rem;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <span class="school-badge">송악고</span>
      <span class="header-title">석식 출입관리시스템</span>
      <span class="clock-badge" id="liveClock">2026-09-07 00:00:00</span>
    </div>
    <div class="header-stats">
      <div class="stat-pill pill-total" onclick="openDetail('total')">
        <span class="stat-label">📋 총신청</span>
        <span class="stat-val" id="totalCount">-</span>
      </div>
      <div class="stat-pill pill-eat" onclick="openDetail('eaten')">
        <span class="stat-label">🍚 식사완료</span>
        <span class="stat-val" id="eatenCount">0</span>
      </div>
      <div class="stat-pill pill-remain" onclick="openDetail('remain')">
        <span class="stat-label">⏳ 미식사</span>
        <span class="stat-val" id="remainCount">-</span>
      </div>
    </div>
  </header>

  <div class="main-container">
    <div class="scanner-pane">
      <div id="reader"></div>
      <p class="scanner-tip">⚡ 대형 스캔 모드: 화면 어디든 스쳐도 0.1초 만에 인식합니다</p>
    </div>

    <div class="result-pane" id="resultCard">
      <div class="photo-container">
        <img id="studentPhoto" src="" alt="증명사진" style="display: none;">
        <span id="photoNone" class="photo-none">사진 대기</span>
      </div>
      <div class="student-name" id="studentName">대기 중</div>
      <div class="student-id" id="studentId">학번 대기</div>
      <div class="status-banner" id="statusBanner">명찰 QR을 스캔하세요</div>
      <div class="recent-log" id="recentLog">최근 기록: 없음</div>
    </div>
  </div>

  <div class="modal-overlay" id="detailModal" onclick="closeDetail(event)">
    <div class="modal-card">
      <div class="modal-title" id="modalTitle">상세 인원 현황</div>
      <div class="grade-row"><span>1학년</span><span class="grade-num" id="modalG1">0명</span></div>
      <div class="grade-row"><span>2학년</span><span class="grade-num" id="modalG2">0명</span></div>
      <div class="grade-row"><span>3학년</span><span class="grade-num" id="modalG3">0명</span></div>
      <button class="btn-close" onclick="document.getElementById('detailModal').style.display='none'">닫기</button>
    </div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzLF1Qw6ZtwWp3MsKakjIsOxUXRSmjqbxOvUBQ7QzAUw7IPacjHAJuL2FjpCMzj8b7t/exec";

    let isProcessing = false;
    let audioCtx = null;
    let currentStats = {
      total: { all: 0, g1: 0, g2: 0, g3: 0 },
      eaten: { all: 0, g1: 0, g2: 0, g3: 0 },
      remain: { all: 0, g1: 0, g2: 0, g3: 0 }
    };

    function updateClock() {
      const now = new Date();
      const yr = now.getFullYear();
      const mo = String(now.getMonth() + 1).padStart(2, '0');
      const da = String(now.getDate()).padStart(2, '0');
      const hr = String(now.getHours()).padStart(2, '0');
      const mi = String(now.getMinutes()).padStart(2, '0');
      const se = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('liveClock').innerText = `${yr}-${mo}-${da} ${hr}:${mi}:${se}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function openDetail(type) {
      const modal = document.getElementById("detailModal");
      const title = document.getElementById("modalTitle");
      const g1 = document.getElementById("modalG1");
      const g2 = document.getElementById("modalG2");
      const g3 = document.getElementById("modalG3");

      if (type === 'total') title.innerText = "📋 총 신청자 학년별 인원";
      else if (type === 'eaten') title.innerText = "🍚 식사 완료 학년별 인원";
      else if (type === 'remain') title.innerText = "⏳ 미식사 학년별 인원";

      g1.innerText = `${currentStats[type].g1}명`;
      g2.innerText = `${currentStats[type].g2}명`;
      g3.innerText = `${currentStats[type].g3}명`;

      modal.style.display = "flex";
    }

    function closeDetail(e) {
      if (e.target.id === 'detailModal') {
        document.getElementById('detailModal').style.display = 'none';
      }
    }

    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'SUCCESS') {
          const notes = [523.25, 659.25, 783.99];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(0, now + idx * 0.1);
            gain.gain.linearRampToValueAtTime(0.25, now + idx * 0.1 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.4);
          });
        } else {
          [0, 0.18].forEach((delay) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(311.13, now + delay);
            gain.gain.setValueAtTime(0.35, now + delay);
            gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + delay);
            osc.stop(now + delay + 0.15);
          });
        }
      } catch(e) { console.log(e); }
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const card = document.getElementById("resultCard");
      const banner = document.getElementById("statusBanner");
      banner.className = "status-banner";
      banner.innerText = "조회 중...";

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ studentId: decodedText })
        });
        const res = await response.json();

        document.getElementById("studentId").innerText = res.studentId ? `학번: ${res.studentId}` : `학번: ${decodedText}`;
        document.getElementById("studentName").innerText = res.name || "-";

        const img = document.getElementById("studentPhoto");
        const placeholder = document.getElementById("photoNone");
        if (res.photoUrl) {
          img.src = res.photoUrl;
          img.style.display = "block";
          placeholder.style.display = "none";
        } else {
          img.style.display = "none";
          placeholder.style.display = "block";
        }

        if (res.stats) {
          currentStats = res.stats;
          document.getElementById("totalCount").innerText = `${res.stats.total.all}명`;
          document.getElementById("eatenCount").innerText = `${res.stats.eaten.all}명`;
          document.getElementById("remainCount").innerText = `${res.stats.remain.all}명`;
        }

        if (res.status === "SUCCESS") {
          card.className = "result-pane state-success";
          banner.className = "status-banner pass";
          banner.innerText = "✓ 정상 승인 (맛있게 드세요!)";
          playSound('SUCCESS');
          document.getElementById("recentLog").innerText = `최근 승인: ${res.name} (${new Date().toLocaleTimeString()})`;
        } else if (res.status === "ALREADY_EATEN") {
          card.className = "result-pane state-warning";
          banner.className = "status-banner fail";
          banner.innerText = "⚠️ 이미 식사 완료된 학생입니다!";
          playSound('WARNING');
        } else if (res.status === "NOT_APPLIED") {
          card.className = "result-pane state-warning";
          banner.className = "status-banner fail";
          banner.innerText = "⛔ 석식 미신청자입니다";
          playSound('WARNING');
        } else {
          card.className = "result-pane state-warning";
          banner.className = "status-banner fail";
          banner.innerText = "명단에 없는 학번입니다";
          playSound('WARNING');
        }

      } catch (err) {
        banner.className = "status-banner fail";
        banner.innerText = "통신 연결 오류";
        playSound('WARNING');
      }

      setTimeout(() => {
        card.className = "result-pane";
        banner.className = "status-banner";
        banner.innerText = "명찰 QR을 스캔하세요";
        isProcessing = false;
      }, 2000);
    }

    // 초고속 풀스크린 스캔 엔진
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
      fps: 25, 
      disableFlip: false,
      rememberLastUsedCamera: true
    });
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
