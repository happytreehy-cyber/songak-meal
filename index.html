<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>송악고등학교 저녁밥 확인 시스템</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      background: #1e293b;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #334155;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .school-badge { background: #2563eb; color: #fff; font-weight: 800; font-size: 0.85rem; padding: 4px 10px; border-radius: 6px; }
    .header-title { font-size: 1.35rem; font-weight: 800; }

    .header-stats { display: flex; gap: 12px; }
    .stat-pill {
      background: #0f172a;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      font-size: 0.95rem;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .stat-label { color: #94a3b8; }
    .stat-val { font-weight: 800; color: #38bdf8; font-size: 1.1rem; }
    .stat-val.eat { color: #4ade80; }

    .main-container { flex: 1; display: flex; padding: 16px; gap: 16px; height: calc(100vh - 65px); }

    .scanner-pane {
      flex: 1.1;
      background: #1e293b;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #334155;
    }
    #reader { width: 100%; max-width: 500px; border-radius: 12px; overflow: hidden; }
    .scanner-tip { margin-top: 14px; color: #94a3b8; font-size: 1rem; }

    .result-pane {
      flex: 1;
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 3px solid #334155;
      transition: all 0.25s ease;
      position: relative;
    }

    .result-pane.state-success { background: #064e3b !important; border-color: #22c55e !important; }
    .result-pane.state-warning { background: #7f1d1d !important; border-color: #ef4444 !important; }

    .photo-container {
      width: 200px;
      height: 250px;
      border-radius: 12px;
      border: 3px solid #475569;
      background: #0f172a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .photo-container img { width: 100%; height: 100%; object-fit: cover; }
    .photo-none { color: #64748b; font-size: 1rem; }

    .student-name { font-size: 2.5rem; font-weight: 900; margin-bottom: 4px; }
    .student-id { font-size: 1.3rem; color: #94a3b8; font-weight: 600; margin-bottom: 20px; }

    .status-banner {
      width: 90%;
      padding: 14px 20px;
      border-radius: 50px;
      font-size: 1.5rem;
      font-weight: 800;
      text-align: center;
      background: #334155;
      color: #cbd5e1;
    }
    .status-banner.pass { background: #22c55e; color: #022c22; }
    .status-banner.fail { background: #ef4444; color: #450a0a; }

    .recent-log { position: absolute; bottom: 12px; font-size: 0.85rem; color: #64748b; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <span class="school-badge">송악고</span>
      <span class="header-title">석식 출입 관리 시스템</span>
    </div>
    <div class="header-stats">
      <div class="stat-pill"><span class="stat-label">총 신청:</span><span class="stat-val" id="totalCount">-</span></div>
      <div class="stat-pill"><span class="stat-label">식사 완료:</span><span class="stat-val eat" id="eatenCount">0</span></div>
      <div class="stat-pill"><span class="stat-label">미식사:</span><span class="stat-val" id="remainCount">-</span></div>
    </div>
  </header>

  <div class="main-container">
    <div class="scanner-pane">
      <div id="reader"></div>
      <p class="scanner-tip">명찰 QR 스티커를 카메라에 비춰주세요</p>
    </div>

    <div class="result-pane" id="resultCard">
      <div class="photo-container">
        <img id="studentPhoto" src="" alt="증명사진" style="display: none;">
        <span id="photoNone" class="photo-none">사진 대기</span>
      </div>
      <div class="student-name" id="studentName">대기 중</div>
      <div class="student-id" id="studentId">학번 대기</div>
      <div class="status-banner" id="statusBanner">명찰 QR을 스캔하세요</div>
      <div class="recent-log" id="recentLog">최근 기록: 없음</div>
    </div>
  </div>

  <script>
    // 혜영 선생님의 구글 웹앱 주소가 완벽하게 연결되어 있습니다.
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzLF1Qw6ZtwWp3MsKakjIsOxUXRSmjqbxOvUBQ7QzAUw7IPacjHAJuL2FjpCMzj8b7t/exec";

    let isProcessing = false;
    let audioCtx = null;

    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'SUCCESS') {
          const notes = [523.25, 659.25, 783.99];
          notes.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(0, now + idx * 0.1);
            gain.gain.linearRampToValueAtTime(0.25, now + idx * 0.1 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.4);
          });
        } else {
          [0, 0.18].forEach((delay) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(311.13, now + delay);
            gain.gain.setValueAtTime(0.35, now + delay);
            gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + delay);
            osc.stop(now + delay + 0.15);
          });
        }
      } catch(e) { console.log(e); }
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const card = document.getElementById("resultCard");
      const banner = document.getElementById("statusBanner");
      banner.className = "status-banner";
      banner.innerText = "조회 중...";

      try {
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ studentId: decodedText })
        });
        const res = await response.json();

        document.getElementById("studentId").innerText = res.studentId ? `학번: ${res.studentId}` : `학번: ${decodedText}`;
        document.getElementById("studentName").innerText = res.name || "-";

        const img = document.getElementById("studentPhoto");
        const placeholder = document.getElementById("photoNone");
        if (res.photoUrl) {
          img.src = res.photoUrl;
          img.style.display = "block";
          placeholder.style.display = "none";
        } else {
          img.style.display = "none";
          placeholder.style.display = "block";
        }

        if (res.stats) {
          document.getElementById("totalCount").innerText = res.stats.total;
          document.getElementById("eatenCount").innerText = res.stats.eaten;
          document.getElementById("remainCount").innerText = res.stats.remain;
        }

        if (res.status === "SUCCESS") {
          card.className = "result-pane state-success";
          banner.className = "status-banner pass";
          banner.innerText = "✓ 정상 승인 (맛있게 드세요!)";
          playSound('SUCCESS');
          document.getElementById("recentLog").innerText = `최근 승인: ${res.name} (${new Date().toLocaleTimeString()})`;
        } else if (res.status === "ALREADY_EATEN") {
          card.className = "result-pane state-warning";
          banner.className = "status-banner fail";
          banner.innerText = "⚠️ 이미 식사 완료된 학생입니다!";
          playSound('WARNING');
        } else if (res.status === "NOT_APPLIED") {
          card.className = "result-pane state-warning";
          banner.className = "status-banner fail";
          banner.innerText = "⛔ 석식 미신청자입니다";
          playSound('WARNING');
        } else {
          card.className = "result-pane state-warning";
          banner.className = "status-banner fail";
          banner.innerText = "명단에 없는 학번입니다";
          playSound('WARNING');
        }

      } catch (err) {
        banner.className = "status-banner fail";
        banner.innerText = "통신 연결 오류";
        playSound('WARNING');
      }

      setTimeout(() => {
        card.className = "result-pane";
        banner.className = "status-banner";
        banner.innerText = "명찰 QR을 스캔하세요";
        isProcessing = false;
      }, 2300);
    }

    // 카메라 인식 해상도 및 QR 스캔 박스 확대
    const html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
      fps: 20, 
      qrbox: function(viewfinderWidth, viewfinderHeight) {
        let minEdgePercentage = 0.75;
        let minEdgeSize = Math.min(viewfinderWidth, viewfinderHeight);
        let qrboxSize = Math.floor(minEdgeSize * minEdgePercentage);
        return { width: qrboxSize, height: qrboxSize };
      },
      rememberLastUsedCamera: true
    });
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
