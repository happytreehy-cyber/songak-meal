<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>송악고등학교 석식 출입관리시스템</title>
  <!-- 백업용 QR 라이브러리 -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      background: #1e293b;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #facc15;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .badge { background: #2563eb; color: #fff; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 16px; }
    .main-title { font-size: 22px; font-weight: bold; letter-spacing: -0.5px; }
    .time-box { background: #0f172a; padding: 6px 14px; border-radius: 8px; border: 1px solid #38bdf8; color: #38bdf8; font-family: monospace; font-size: 16px; font-weight: bold; }

    .header-right { display: flex; align-items: center; gap: 12px; }
    .stat-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid transparent;
    }
    .stat-total { background: #1e293b; border-color: #eab308; color: #fef08a; }
    .stat-done { background: #064e3b; border-color: #10b981; color: #a7f3d0; }
    .stat-rem { background: #451a03; border-color: #f97316; color: #fed7aa; }

    main {
      flex: 1;
      display: flex;
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }

    /* 카메라 스캔 영역 */
    .scanner-panel {
      flex: 1.1;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .video-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ★ 확실하게 보이는 초록색 QR 스캔 조준 가이드창 */
    .scan-target-box {
      position: absolute;
      width: 260px;
      height: 260px;
      border: 3px solid #22c55e;
      border-radius: 16px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.4), 0 0 20px #22c55e;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulseBox 2s infinite ease-in-out;
    }
    .scan-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: #4ade80;
      border-style: solid;
      border-width: 0;
    }
    .corner-tl { top: -2px; left: -2px; border-top-width: 5px; border-left-width: 5px; border-top-left-radius: 14px; }
    .corner-tr { top: -2px; right: -2px; border-top-width: 5px; border-right-width: 5px; border-top-right-radius: 14px; }
    .corner-bl { bottom: -2px; left: -2px; border-bottom-width: 5px; border-left-width: 5px; border-bottom-left-radius: 14px; }
    .corner-br { bottom: -2px; right: -2px; border-bottom-width: 5px; border-right-width: 5px; border-bottom-right-radius: 14px; }

    .laser-line {
      width: 90%;
      height: 2px;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      position: absolute;
      animation: laserMove 1.8s infinite alternate ease-in-out;
    }

    @keyframes laserMove {
      0% { transform: translateY(-110px); opacity: 0.3; }
      100% { transform: translateY(110px); opacity: 1; }
    }
    @keyframes pulseBox {
      0%, 100% { border-color: #22c55e; }
      50% { border-color: #4ade80; box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.4), 0 0 28px #4ade80; }
    }

    .scanner-footer {
      background: #0f172a;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      color: #38bdf8;
      font-weight: bold;
    }

    /* 우측 정보 패널 */
    .info-panel {
      flex: 0.9;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      transition: all 0.15s ease;
    }
    .photo-box {
      width: 200px;
      height: 240px;
      border: 3px solid #facc15;
      border-radius: 12px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; }
    .photo-placeholder { font-size: 18px; color: #94a3b8; font-weight: bold; }
    .status-msg { font-size: 32px; font-weight: 800; margin-bottom: 8px; color: #f8fafc; }
    .student-id { font-size: 22px; color: #94a3b8; margin-bottom: 20px; font-weight: bold; }
    .action-badge {
      width: 85%;
      padding: 14px;
      background: #334155;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #cbd5e1;
      margin-bottom: 12px;
    }
    .recent-log { font-size: 13px; color: #64748b; }

    .status-pass { color: #22c55e !important; }
    .status-warn { color: #f59e0b !important; }
    .status-fail { color: #ef4444 !important; }

    .panel-pass { border: 2px solid #22c55e !important; box-shadow: 0 0 25px rgba(34, 197, 94, 0.4); }
    .panel-warn { border: 2px solid #f59e0b !important; box-shadow: 0 0 25px rgba(245, 158, 11, 0.4); }
    .panel-fail { border: 2px solid #ef4444 !important; box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }

    #startOverlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 17, 32, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      cursor: pointer;
    }
    #startOverlay button {
      background: #2563eb; color: #fff; font-size: 20px; font-weight: bold;
      padding: 14px 28px; border: none; border-radius: 10px; cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="badge">송악고</div>
      <div class="main-title">석식 출입관리시스템</div>
      <div class="time-box" id="clock">00:00:00</div>
    </div>
    <div class="header-right">
      <div class="stat-card stat-total">📋 총신청 <span id="totalCount">-</span></div>
      <div class="stat-card stat-done">🍱 식사완료 <span id="doneCount">0</span></div>
      <div class="stat-card stat-rem">⏳ 미식사 <span id="remCount">-</span></div>
    </div>
  </header>

  <main>
    <div class="scanner-panel">
      <div class="video-container" id="videoBox">
        <video id="webcam" playsinline autoplay muted></video>
        
        <!-- 초록색 인식 조준창 가이드 -->
        <div class="scan-target-box" id="targetBox">
          <div class="scan-corner corner-tl"></div>
          <div class="scan-corner corner-tr"></div>
          <div class="scan-corner corner-bl"></div>
          <div class="scan-corner corner-br"></div>
          <div class="laser-line"></div>
        </div>

        <div id="startOverlay">
          <button onclick="startApp()">📷 카메라 시작하기</button>
          <div style="margin-top: 12px; color: #94a3b8; font-size: 14px;">화면을 터치하면 스캐너가 시작됩니다</div>
        </div>
      </div>
      <div class="scanner-footer">
        ⚡ 초고속 하드웨어 가속 모드: 초록창에 QR을 비춰주세요
      </div>
    </div>

    <div class="info-panel" id="infoPanel">
      <div class="photo-box" id="photoBox">
        <div class="photo-placeholder" id="photoText">사진 대기</div>
      </div>
      <div class="status-msg" id="statusMsg">대기 중</div>
      <div class="student-id" id="studentSub">명찰 QR을 비춰주세요</div>
      <div class="action-badge" id="actionMsg">초고속 엔진 가동 완료</div>
      <div class="recent-log" id="recentLog">최근 기록: 없음</div>
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLF1Qw6ZtwWp3MsKakjIsOxUXRSmjqbxOvUBQ7QzAUw7IPacjHAJuL2FjpCMzj8b7t/exec";

    let isProcessing = false;
    let studentDB = {};
    let completedMap = new Map();
    let totalApplicantCount = 0;
    let videoElem = document.getElementById("webcam");
    let detector = null;
    let scanInterval = null;

    // ==========================================
    // 🔔 맑은 2단 차임벨 '띵~동♪' & 경고음
    // ==========================================
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playDingDong() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        playNote(ctx, 784, now, 0.35);        // 높은 솔 (G5)
        playNote(ctx, 659.25, now + 0.16, 0.55); // 미 (E5)
      } catch (e) {}
    }

    function playNote(ctx, freq, start, duration) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(0.4, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + duration);
    }

    function playFailSound() {
      try {
        const ctx = getAudioContext();
        [0, 0.15].forEach(delay => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(260, ctx.currentTime + delay);
          gain.gain.setValueAtTime(0.35, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 0.12);
        });
      } catch (e) {}
    }

    // ==========================================
    // 🚀 학생 명단 사전 동기화
    // ==========================================
    async function loadStudentDatabase() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getAll`);
        const json = await res.json();
        if (json.success) {
          studentDB = json.data;
          totalApplicantCount = Object.values(studentDB).filter(s => s.isApplied).length;
          document.getElementById("totalCount").innerText = totalApplicantCount;
          updateCounts();
        }
      } catch (e) {
        console.warn("명단 사전 로딩 실패, 실시간 쿼리로 진행");
      }
    }

    // ==========================================
    // ⚡ 하드웨어 가속 초고속 스캐너 엔진
    // ==========================================
    async function startCamera() {
      const constraints = {
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        videoElem.srcObject = stream;
        await videoElem.play();
        startDetectionLoop();
      } catch (err) {
        // 대체 시도 (일반 기본 카메라)
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
          videoElem.srcObject = fallbackStream;
          await videoElem.play();
          startDetectionLoop();
        } catch (e) {
          document.getElementById("startOverlay").style.display = "flex";
        }
      }
    }

    function startDetectionLoop() {
      // 최신 브라우저 하드웨어 가속 BarcodeDetector 지원 여부 확인
      if ('BarcodeDetector' in window) {
        detector = new BarcodeDetector({ formats: ['qr_code'] });
        scanInterval = setInterval(async () => {
          if (isProcessing || videoElem.readyState < 2) return;
          try {
            const barcodes = await detector.detect(videoElem);
            if (barcodes.length > 0) {
              handleBarcodeResult(barcodes[0].rawValue);
            }
          } catch (e) {}
        }, 60); // 초당 약 16회 고속 프레임 감지
      } else {
        // BarcodeDetector 미지원 환경 시 html5-qrcode로 대체 구동
        fallbackHtml5QrCode();
      }
    }

    function fallbackHtml5QrCode() {
      const html5Qr = new Html5Qrcode("videoBox");
      html5Qr.start(
        { facingMode: "environment" },
        { fps: 25, qrbox: 260 },
        (text) => handleBarcodeResult(text),
        () => {}
      );
    }

    // ==========================================
    // ⏱️ 0.02초 즉시 반응 검증 및 중복 체크 로직
    // ==========================================
    function handleBarcodeResult(rawValue) {
      const studentId = String(rawValue).trim();
      if (!studentId || isProcessing) return;

      isProcessing = true;

      // 1) 중복 체크 (0.01초 즉시 반응)
      if (completedMap.has(studentId)) {
        playFailSound();
        const time = completedMap.get(studentId);
        const stu = studentDB[studentId] || { id: studentId, name: "" };
        showDuplicateUI(stu, time);
        setTimeout(() => { resetUI(); isProcessing = false; }, 1600);
        return;
      }

      // 2) 사전 등록 데이터베이스 확인 (0.01초 즉시 승인)
      if (studentDB && studentDB[studentId]) {
        const student = studentDB[studentId];
        if (student.isApplied) {
          const timeStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          completedMap.set(studentId, timeStr);

          playDingDong();
          showApprovedUI(student);
          updateCounts();

          // 시트 저장은 백그라운드에서 지연 없이 전송
          fetch(`${SCRIPT_URL}?id=${encodeURIComponent(studentId)}`).catch(()=>{});
        } else {
          playFailSound();
          showRejectedUI("석식 미신청 학생입니다", student);
        }

        setTimeout(() => { resetUI(); isProcessing = false; }, 1300);
        return;
      }

      // 3) 캐시 미존재 시 네트워크 즉시 쿼리
      showProcessingUI(studentId);
      fetch(`${SCRIPT_URL}?id=${encodeURIComponent(studentId)}`)
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            const timeStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            completedMap.set(studentId, timeStr);

            playDingDong();
            showApprovedUI(res.student);
            updateCounts();
          } else {
            playFailSound();
            showRejectedUI(res.message, res.student);
          }
        })
        .catch(() => {
          playFailSound();
          showErrorUI("통신 에러가 발생했습니다.");
        })
        .finally(() => {
          setTimeout(() => { resetUI(); isProcessing = false; }, 1300);
        });
    }

    // ==========================================
    // UI 반응 함수
    // ==========================================
    function showProcessingUI(id) {
      document.getElementById("statusMsg").innerText = "확인 중...";
      document.getElementById("statusMsg").className = "status-msg";
      document.getElementById("studentSub").innerText = "학번: " + id;
      document.getElementById("actionMsg").innerText = "데이터 조회 중";
    }

    function showApprovedUI(student) {
      const infoPanel = document.getElementById("infoPanel");
      infoPanel.className = "info-panel panel-pass";
      document.getElementById("statusMsg").innerText = "식사 승인 ✅";
      document.getElementById("statusMsg").className = "status-msg status-pass";
      document.getElementById("studentSub").innerText = `${student.id} ${student.name}`;
      document.getElementById("actionMsg").innerText = "맛있게 드세요!";
      document.getElementById("actionMsg").style.background = "#059669";
      document.getElementById("recentLog").innerText = `최근 통과: ${student.id} ${student.name}`;

      if (student.photoUrl) {
        document.getElementById("photoBox").innerHTML = `<img src="${student.photoUrl}" alt="사진">`;
      } else {
        document.getElementById("photoBox").innerHTML = `<div class="photo-placeholder" style="color:#10b981;">승인 완료</div>`;
      }
    }

    function showDuplicateUI(student, time) {
      const infoPanel = document.getElementById("infoPanel");
      infoPanel.className = "info-panel panel-warn";
      document.getElementById("statusMsg").innerText = "중복 체크 ⚠️";
      document.getElementById("statusMsg").className = "status-msg status-warn";
      document.getElementById("studentSub").innerText = `${student.id} ${student.name || ''}`;
      document.getElementById("actionMsg").innerText = `이미 확인됨 (${time} 통과)`;
      document.getElementById("actionMsg").style.background = "#d97706";
      document.getElementById("photoBox").innerHTML = `<div class="photo-placeholder" style="color:#f59e0b;">이미 통과함</div>`;
    }

    function showRejectedUI(msg, student) {
      const infoPanel = document.getElementById("infoPanel");
      infoPanel.className = "info-panel panel-fail";
      document.getElementById("statusMsg").innerText = "출입 차단 ❌";
      document.getElementById("statusMsg").className = "status-msg status-fail";
      document.getElementById("studentSub").innerText = student ? `${student.id} ${student.name}` : "미신청 학생";
      document.getElementById("actionMsg").innerText = msg || "석식 미신청자입니다";
      document.getElementById("actionMsg").style.background = "#dc2626";
      document.getElementById("photoBox").innerHTML = `<div class="photo-placeholder" style="color:#ef4444;">승인 거부</div>`;
    }

    function showErrorUI(msg) {
      document.getElementById("statusMsg").innerText = "오류 발생 ⚠️";
      document.getElementById("statusMsg").className = "status-msg status-fail";
      document.getElementById("actionMsg").innerText = msg;
    }

    function resetUI() {
      const infoPanel = document.getElementById("infoPanel");
      infoPanel.className = "info-panel";
      document.getElementById("statusMsg").innerText = "대기 중";
      document.getElementById("statusMsg").className = "status-msg";
      document.getElementById("studentSub").innerText = "명찰 QR을 비춰주세요";
      document.getElementById("actionMsg").innerText = "초고속 엔진 가동 완료";
      document.getElementById("actionMsg").style.background = "#334155";
      document.getElementById("photoBox").innerHTML = `<div class="photo-placeholder">사진 대기</div>`;
    }

    function updateCounts() {
      document.getElementById("doneCount").innerText = completedMap.size;
      if (totalApplicantCount > 0) {
        document.getElementById("remCount").innerText = Math.max(0, totalApplicantCount - completedMap.size);
      }
    }

    function updateClock() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      document.getElementById("clock").innerText = 
        `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function startApp() {
      document.getElementById("startOverlay").style.display = "none";
      getAudioContext();
      startCamera();
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadStudentDatabase();
      startCamera();
    });

    document.body.addEventListener("click", () => {
      getAudioContext();
    }, { once: true });
  </script>
</body>
</html>
