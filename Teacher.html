<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>송악고 석식 모니터링 (교사용)</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f1f5f9; font-family: 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    .header { background-color: #1e293b; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 10; }
    .title { font-size: 24pt; font-weight: bold; color: #60a5fa; }
    .clock { font-size: 16pt; font-weight: bold; color: #94a3b8; }
    
    .main-container { display: flex; flex: 1; padding: 20px; gap: 20px; height: calc(100vh - 110px); }
    
    .left-panel { flex: 2; display: flex; flex-direction: column; gap: 20px; }
    
    .photo-grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-y: auto; align-content: start; }
    
    .student-card { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; animation: slideDown 0.4s ease-out; position: relative; }
    .student-card.allergy { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
    
    .student-photo { width: 100%; height: 250px; background: #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 50pt; color: white; object-fit: cover; }
    .student-info { margin-top: 10px; text-align: center; }
    .student-id { font-size: 16pt; font-weight: bold; color: #64748b; }
    .student-name { font-size: 24pt; font-weight: 900; color: #1e293b; margin: 5px 0; }
    .student-note { background: #fee2e2; color: #dc2626; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14pt; display: inline-block; margin-top: 5px; }
    
    /* ★ 수동입력(✅) 시 사진 위에 뜨는 뱃지 */
    .manual-badge { position: absolute; top: 10px; right: 10px; background: #10b981; color: white; font-weight: bold; padding: 8px 12px; border-radius: 8px; font-size: 13pt; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }

    .log-box { height: 250px; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; }
    .log-title { background: #334155; color: white; padding: 12px 20px; font-size: 14pt; font-weight: bold; }
    .log-content { flex: 1; overflow-y: auto; padding: 10px; font-size: 13pt; line-height: 1.8; }
    .log-row { padding: 5px 10px; border-bottom: 1px solid #f1f5f9; display: flex; gap: 15px; }
    .log-time { color: #94a3b8; font-family: monospace; }
    
    /* ★ 블랙박스 로그 색상 완벽 동기화 */
    .log-error-red { color: #cc0000; font-weight: bold; background: #fce8e8; padding: 2px 8px; border-radius: 6px; }
    .log-error-orange { color: #b35900; font-weight: bold; background: #fef0d9; padding: 2px 8px; border-radius: 6px; }
    .log-manual-green { color: #137333; font-weight: bold; background: #e6f4ea; padding: 2px 8px; border-radius: 6px; }

    .right-panel { flex: 1; display: flex; flex-direction: column; gap: 20px; position: relative; }
    
    .stats-box { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .stats-title { font-size: 16pt; font-weight: bold; color: #1e293b; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    .stat-row { display: flex; justify-content: space-between; font-size: 18pt; margin-bottom: 10px; font-weight: bold; }
    
    .list-box { flex: 1; background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
    .list-content { flex: 1; overflow-y: auto; font-size: 14pt; line-height: 1.6; color: #475569; }
    .unfed-item { padding: 8px; border-bottom: 1px dashed #cbd5e1; display: flex; justify-content: space-between; }

    /* ★ 팝업창 (빨간배경 + 하얀글씨) */
    #alert-modal { display: none; position: absolute; bottom: 20px; right: 20px; z-index: 999; }
    .alert-content { background: #ef4444; padding: 35px; border-radius: 15px; border: 4px solid #b91c1c; text-align: center; box-shadow: 0 10px 30px rgba(239,68,68,0.7); width: 350px; animation: popAlert 0.5s infinite alternate; }
    .alert-icon { font-size: 50pt; margin-bottom: 5px; }
    .alert-msg { font-size: 18pt; font-weight: 900; color: white; margin-bottom: 20px; line-height: 1.5; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
    .btn-confirm { background: white; color: #ef4444; border: none; padding: 15px 30px; font-size: 16pt; font-weight: 900; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.2s; width: 100%; }
    .btn-confirm:hover { background: #f8fafc; transform: scale(1.05); }

    @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popAlert { from { transform: scale(1); } to { transform: scale(1.02); } }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">👩‍🏫 송악고 석식 모니터링 데스크</div>
    <div class="clock" id="live-clock">0000. 00. 00. 00:00:00</div>
  </div>

  <div class="main-container">
    <div class="left-panel">
      <div class="photo-grid" id="photo-grid">
        <div style="grid-column: span 3; text-align: center; color: #94a3b8; font-size: 20pt; margin-top: 50px;">
          학생이 바코드를 스캔하면 여기에 얼굴이 표시됩니다.
        </div>
      </div>
      
      <div class="log-box">
        <div class="log-title">⏱️ 실시간 블랙박스 기록 (최근 스캔)</div>
        <div class="log-content" id="log-content">로딩 중...</div>
      </div>
    </div>

    <div class="right-panel">
      <div class="stats-box">
        <div class="stats-title">📊 오늘의 식사 현황</div>
        <div class="stat-row"><span style="color:#64748b;">총 신청자</span> <span id="stat-total" style="color:#1e293b;">0명</span></div>
        <div class="stat-row"><span style="color:#10b981;">식사 완료</span> <span id="stat-done">0명</span></div>
        <div class="stat-row"><span style="color:#ef4444;">남은 인원</span> <span id="stat-left">0명</span></div>
      </div>

      <div class="list-box">
        <div class="stats-title">🏃 아직 밥 안 먹은 학생 명단</div>
        <div class="list-content" id="unfed-list">로딩 중...</div>
      </div>

      <!-- 우측 하단 강렬한 경고 팝업창 -->
      <div id="alert-modal">
        <div class="alert-content">
          <div class="alert-icon">🚨</div>
          <div class="alert-msg" id="alert-text">경고!</div>
          <button class="btn-confirm" onclick="closeAlert()">확인 (소리 끄기)</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKZBLj0pzD0dNU_fAvhF6j6x3Xzl7PL5-yYJabG8oZ45qBKonZa2r-9YsJ7-eJkElY/exec";
    
    let lastLogTime = ""; 
    let alertAudio = new Audio('https://t1.daumcdn.net/cfile/tistory/998B4B485C9A208D16?original'); 
    alertAudio.loop = true; 

    setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleString('ko-KR'); }, 1000);

    function triggerAlert(msg) {
      document.getElementById('alert-text').innerHTML = msg;
      document.getElementById('alert-modal').style.display = 'block'; 
      alertAudio.play().catch(e => console.log("자동재생 차단됨")); 
    }

    function closeAlert() {
      document.getElementById('alert-modal').style.display = 'none';
      alertAudio.pause();
      alertAudio.currentTime = 0;
    }

    function refreshData() {
      fetch(SCRIPT_URL + "?action=GET_TEACHER_DATA")
        .then(r => r.json())
        .then(res => {
          if (res.status === "SUCCESS") {
            updateStats(res.stats);
            updateUnfedList(res.unfed);
            processLogs(res.blackbox);
          }
        }).catch(err => console.log("데이터 통신 에러"));
    }

    function updateStats(stats) {
      document.getElementById('stat-total').innerText = stats.total + "명";
      document.getElementById('stat-done').innerText = stats.done + "명";
      document.getElementById('stat-left').innerText = stats.left + "명";
    }

    function updateUnfedList(unfed) {
      let html = "";
      if (unfed.length === 0) { html = "<div style='text-align:center; padding:20px; font-weight:bold;'>모두 식사를 완료했습니다! 🎉</div>"; } 
      else {
        unfed.forEach(s => {
          let noteHtml = s.note ? `<span style="color:#ef4444; font-size:11pt; font-weight:bold;">[${s.note}]</span>` : "";
          html += `<div class="unfed-item"><span>${s.id} ${s.name}</span> ${noteHtml}</div>`;
        });
      }
      document.getElementById('unfed-list').innerHTML = html;
    }

    function processLogs(logs) {
      let logHtml = "";
      let newFaces = [];

      for (let i = 0; i < logs.length; i++) {
        let log = logs[i];
        let timeStr = new Date(log.time).toLocaleTimeString('ko-KR');
        let fullId = log.time + "_" + log.id; 
        
        let rowClass = "";
        if (log.status.includes("미신청")) rowClass = "log-error-red";
        else if (log.status.includes("중복")) rowClass = "log-error-orange";
        else if (log.status.includes("수동")) rowClass = "log-manual-green";
        
        logHtml += `<div class="log-row"><span class="log-time">[${timeStr}]</span> <span class="${rowClass}">${log.id} ${log.name} - ${log.status}</span></div>`;

        if (i === 0 && fullId !== lastLogTime) {
          lastLogTime = fullId; 
          
          if (log.status.includes("미신청")) {
            triggerAlert(`🚨 경고!<br><span style="color:#fef08a;">${log.id} ${log.name}</span><br>미신청자 무단 접근!`);
          } else if (log.status.includes("중복")) {
            triggerAlert(`⚠️ 중복 식사!<br><span style="color:#fef08a;">${log.id} ${log.name}</span><br>이미 식사한 학생!`);
          }
          
          if (!log.status.includes("미신청") && !log.status.includes("중복")) {
             let allergyClass = log.status.includes("알레르기") ? "allergy" : "";
             let manualBadge = log.status.includes("수동") ? `<div class="manual-badge">✅ 수동승인</div>` : "";
             
             let faceCard = `
               <div class="student-card ${allergyClass}">
                 ${manualBadge}
                 <div class="student-photo">👤</div>
                 <div class="student-info">
                   <div class="student-id">${log.id}</div>
                   <div class="student-name">${log.name}</div>
                   ${allergyClass ? `<div class="student-note">알레르기 주의</div>` : ""}
                 </div>
               </div>
             `;
             newFaces.push(faceCard);
          }
        }
      }
      
      document.getElementById('log-content').innerHTML = logHtml;
      
      if (newFaces.length > 0) {
        let grid = document.getElementById('photo-grid');
        if(grid.innerHTML.includes("바코드를 스캔하면")) grid.innerHTML = "";
        grid.innerHTML = newFaces.join("") + grid.innerHTML;
        
        if(grid.children.length > 6) {
          for(let i = 6; i < grid.children.length; i++) grid.removeChild(grid.children[i]);
        }
      }
    }

    setInterval(refreshData, 2000);
    refreshData();
  </script>
</body>
</html>
