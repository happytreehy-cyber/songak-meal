<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>송악고 석식 시스템 (학생용)</title>
  <style>
    body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background-color: #111827; color: white; font-family: 'Apple SD Gothic Neo', sans-serif; overflow: hidden; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #1f2937; border-bottom: 2px solid #374151; }
    .header-left { display: flex; align-items: baseline; gap: 15px; }
    
    /* 🍴 심플하고 고급스러운 이모티콘으로 변경 */
    .title { font-size: 22pt; font-weight: 900; color: #60a5fa; letter-spacing: 1px; }
    .clock { font-size: 14pt; color: #9ca3af; font-weight: bold; }
    
    .header-right { display: flex; gap: 12px; align-items: center; cursor: pointer; position: relative; }
    .stat-badge { padding: 8px 15px; border-radius: 8px; font-size: 14pt; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .stat-total { background: #3b82f6; } .stat-done { background: #10b981; } .stat-left { background: #ef4444; }
    
    .cam-btn { padding: 8px 15px; background: #4b5563; color: white; border: none; border-radius: 8px; font-size: 13pt; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-right: 15px; }
    .cam-btn:active { background: #374151; transform: scale(0.95); }

    .main-content { display: flex; flex: 1; height: 100%; }
    .camera-section { flex: 2; display: flex; flex-direction: column; padding: 20px; }
    .info-section { flex: 1; background-color: #1a1e29; border-left: 2px solid #2d3748; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    
    /* 🟦 카메라 창 눈에 확 띄게 파란색 테두리 + 네온 효과 추가! */
    #reader { width: 100%; height: 100%; border-radius: 12px; overflow: hidden; background: #000; border: 4px solid #60a5fa; box-shadow: 0 0 25px rgba(96, 165, 250, 0.4); }
    
    .box-title { font-size: 24pt; font-weight: 900; margin-bottom: 10px; }
    .box-content { font-size: 18pt; margin-bottom: 5px; font-weight: bold; }
    .status-circle { width: 220px; height: 220px; border: 6px solid yellow; border-radius: 30px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; background: #111827; box-shadow: 0 0 20px rgba(255,255,0,0.2); }
    
    /* 주의라는 딱딱한 말 제거 */
    .warning-text { margin-top: 15px; font-size: 12pt; color: #f87171; font-weight: bold; background: rgba(239, 68, 68, 0.1); padding: 12px; border-radius: 8px; line-height: 1.4; }

    #loading-overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
    
    .chef-anim { font-size: 70pt; margin-bottom: 15px; display: inline-block; animation: bounce 0.8s ease-in-out infinite alternate; }
    @keyframes bounce { from { transform: translateY(0px); } to { transform: translateY(-20px); } }
    .error-btn { margin-top:20px; padding: 12px 25px; background: #ef4444; color: white; font-weight: bold; font-size: 16pt; border: none; border-radius: 8px; cursor: pointer; }

    #stats-modal { display: none; position: fixed; top: 75px; right: 20px; background: #1f2937; padding: 20px 25px; border-radius: 12px; z-index: 200; box-shadow: 0 10px 30px rgba(0,0,0,0.7); width: 280px; border: 2px solid #374151; }
    .modal-backdrop { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: transparent; z-index: 150; }
    .grade-stat-row { display: flex; justify-content: space-between; font-size: 13pt; padding: 8px 0; border-bottom: 1px solid #374151; font-weight: bold; }
    .close-btn { width: 100%; padding: 10px; margin-top: 15px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 13pt; font-weight: bold; cursor: pointer; }
  </style>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  
  <div id="loading-overlay">
    <div id="anim-icon" class="chef-anim">👩‍🍳</div>
    <h2 id="loading-msg" style="color: #3b82f6; font-size: 26pt; margin-bottom: 10px;">
      오늘도 송악고 급식실은<br>맛있게 조리 중입니다
    </h2>
    <p id="loading-sub" style="font-size: 15pt; color: #9ca3af;">명단을 빠르게 불러오고 있습니다... 🚀 (<span id="load-time">0</span>초)</p>
  </div>

  <div class="modal-backdrop" id="modal-bg" onclick="closeStats()"></div>
  <div id="stats-modal">
    <h3 style="margin-top:0; color:#60a5fa; text-align:center; font-size:16pt; margin-bottom: 15px;">📊 학년별 식사 현황</h3>
    <div id="stats-detail-content">로딩 중...</div>
    <button class="close-btn" onclick="closeStats()">닫기</button>
  </div>

  <div class="header">
    <div class="header-left">
      <!-- 🍴 깔끔한 이모티콘 -->
      <div class="title">🍴 송악고 석식 시스템</div>
      <div class="clock" id="live-clock">0000. 00. 00. 00:00:00</div>
    </div>
    <div style="display:flex;">
      <button class="cam-btn" onclick="switchCamera()">🔄 카메라 전환</button>
      <div class="header-right" onclick="openStats()">
        <div class="stat-badge stat-total">총신청: <span id="val-total">0</span></div>
        <div class="stat-badge stat-done">완료: <span id="val-done">0</span></div>
        <div class="stat-badge stat-left">미식사: <span id="val-left">0</span></div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="camera-section">
      <div id="reader"></div>
    </div>
    <div class="info-section">
      <div class="status-circle" id="photo-box">
        <!-- 📱 QR 준비 문구 -->
        <span class="box-content" style="font-size: 32pt; font-weight: 900; color: yellow; line-height: 1.2;">📱 QR<br>준비</span>
      </div>
      <!-- ⬅️ 시선을 왼쪽으로 돌리는 문구 -->
      <div class="box-title" id="status-title" style="display: none;"></div>
      <div class="box-content" id="status-message" style="color: #9ca3af; font-size: 20pt; margin-top: 10px;">⬅️ 왼쪽 카메라에<br>학생증을 비춰주세요</div>
      
      <!-- 부드러운 경고 멘트 -->
      <div class="warning-text">
        * 선생님 화면에서는 QR 인식 시<br>해당 학생의 실제 사진이 표시됩니다.
      </div>
    </div>
  </div>

  <script>
    // 선생님의 완벽한 웹앱 주소!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKZBLj0pzD0dNU_fAvhF6j6x3Xzl7PL5-yYJabG8oZ45qBKonZa2r-9YsJ7-eJkElY/exec";
    
    let html5QrCode, cameras = [], currentCameraIndex = 0;
    let studentCache = {}, isScanning = true, currentStatsDetails = null;
    
    setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleString('ko-KR'); }, 1000);

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (type === 'success') { 
        const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1); 
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
      } else if (type === 'duplicate') { 
        const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain();
        osc.type = 'square'; osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime); gainNode.gain.setValueAtTime(0, audioCtx.currentTime + 0.1); gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + 0.15); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'error') { 
        const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.15);
        
        const osc2 = audioCtx.createOscillator(), gainNode2 = audioCtx.createGain();
        osc2.type = 'sawtooth'; osc2.frequency.setValueAtTime(300, audioCtx.currentTime + 0.2);
        osc2.connect(gainNode2); gainNode2.connect(audioCtx.destination);
        gainNode2.gain.setValueAtTime(0.3, audioCtx.currentTime + 0.2); gainNode2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc2.start(audioCtx.currentTime + 0.2); osc2.stop(audioCtx.currentTime + 0.35);
      }
    }

    function refreshStats() {
      fetch(SCRIPT_URL + "?action=GET_DETAILS").then(r => r.json()).then(res => {
        if(res.totalStats) {
          currentStatsDetails = res;
          document.getElementById('val-total').innerText = res.totalStats.total;
          document.getElementById('val-done').innerText = res.totalStats.done;
          document.getElementById('val-left').innerText = res.totalStats.left;
        }
      }).catch(e => console.log("통계 갱신 대기 중"));
    }

    function openStats() {
      if(!currentStatsDetails) { alert("아직 통계를 불러오지 못했습니다."); return; }
      let html = "";
      [1, 2, 3].forEach(grade => {
        let st = currentStatsDetails[grade];
        if(st) { html += `<div class="grade-stat-row"><span>${grade}학년</span> <span style="color:#10b981;">식사: ${st.done}</span> <span style="color:#ef4444;">미식사: ${st.left}</span></div>`; }
      });
      document.getElementById('stats-detail-content').innerHTML = html;
      document.getElementById('stats-modal').style.display = 'block'; document.getElementById('modal-bg').style.display = 'block';
    }
    function closeStats() { document.getElementById('stats-modal').style.display = 'none'; document.getElementById('modal-bg').style.display = 'none'; }

    window.onload = function() {
      refreshStats();
      let sec = 0;
      let timer = setInterval(() => { document.getElementById('load-time').innerText = ++sec; }, 1000);

      fetch(SCRIPT_URL + "?action=GET_ALL_STUDENTS")
        .then(r => r.json())
        .then(res => {
          clearInterval(timer);
          if(res.status === "SUCCESS") {
            studentCache = res.data;
            document.getElementById('loading-overlay').style.display = 'none';
            initCamera(); 
            setInterval(refreshStats, 10000); 
          } else {
            showErrorUI(`구글 시트 에러: ${res.message || '알 수 없는 에러'}`);
          }
        }).catch(err => {
          clearInterval(timer);
          showErrorUI("통신 실패! 구글 스크립트 새 버전을 배포했는지 확인해주세요.");
        });
    };

    function showErrorUI(errorMsg) {
      document.getElementById('anim-icon').innerText = "❌";
      document.getElementById('anim-icon').style.animation = "none";
      document.getElementById('loading-msg').innerHTML = "<span style='color:#ef4444'>데이터를 불러오지 못했습니다!</span>";
      document.getElementById('loading-sub').innerHTML = `${errorMsg}<br><br><button class="error-btn" onclick="location.reload()">새로고침(다시시도)</button>`;
    }

    // ★ 카메라 멱살 잡고 강제로 전환시키는 완벽한 로직!
    function initCamera() {
      html5QrCode = new Html5Qrcode("reader");
      Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length > 0) {
          cameras = devices;
          // 'front'나 '전면'이라는 이름표가 붙은 렌즈를 찾음
          let frontCamIndex = cameras.findIndex(c => c.label.toLowerCase().includes('front') || c.label.toLowerCase().includes('전면'));
          
          // 전면 렌즈가 있으면 그거부터, 없으면 0번 렌즈부터 강제 시작
          currentCameraIndex = (frontCamIndex !== -1) ? frontCamIndex : 0;
          startCamera(cameras[currentCameraIndex].id);
        } else {
          alert("사용 가능한 카메라 렌즈를 찾을 수 없습니다.");
        }
      }).catch(e => alert("카메라 권한을 허용해 주셔야 스캔이 가능합니다!"));
    }

    function startCamera(cameraId) {
      html5QrCode.start(
        cameraId, // 렌즈 고유 번호를 직접 때려 넣음 (전환 오류 100% 방지)
        { fps: 60, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        (ignoreError) => {}
      ).catch(e => console.log("카메라 실행 에러:", e));
    }

    function switchCamera() {
      if (cameras.length > 1) {
        // 기존 카메라를 끄고, 배열에 있는 다음 렌즈로 강제 이동
        html5QrCode.stop().then(() => {
          currentCameraIndex = (currentCameraIndex + 1) % cameras.length;
          startCamera(cameras[currentCameraIndex].id);
        }).catch(e => alert("카메라 전환 중 오류가 발생했습니다."));
      } else {
        alert("전환할 수 있는 다른 카메라 렌즈가 없습니다.");
      }
    }

    function onScanSuccess(decodedText, decodedResult) {
      if(!isScanning) return; 
      isScanning = false;
      
      let studentId = decodedText.trim().replace(/[^0-9]/g, '');
      let student = studentCache[studentId];
      let nowTime = new Date().toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' });

      if (!student) {
        playBeep('error'); updateUI("red", `<span style="font-size: 70pt; color: red;">🔴</span>`, "미신청", "당일 석식 미신청자입니다");
      } else if (student.marked === 1) {
        playBeep('duplicate'); updateUI("orange", `<span style="font-size: 70pt; color: orange;">🟠</span>`, "⚠ 중복 식사 !", `이미 식사한 학생입니다<br><span style="font-size:12pt;color:#9ca3af;">(시간: ${nowTime})</span>`);
        fetch(SCRIPT_URL + "?action=MARK_ATTENDANCE&id=" + studentId);
      } else {
        playBeep('success'); updateUI("#4CAF50", `<span style="font-size: 70pt; color: #4CAF50;">🟢</span>`, "✓ 정상 승인", `<span style="color:#10b981;">(맛있게 드세요!)</span><br><span style="color:white;">${student.name}</span>`);
        student.marked = 1;
        
        let doneEl = document.getElementById('val-done'), leftEl = document.getElementById('val-left');
        doneEl.innerText = parseInt(doneEl.innerText) + 1; leftEl.innerText = Math.max(0, parseInt(leftEl.innerText) - 1);
        fetch(SCRIPT_URL + "?action=MARK_ATTENDANCE&id=" + studentId);
      }

      // 스캔 후 원래의 대기 상태로 복구
      setTimeout(() => {
        updateUI(
          "yellow", 
          `<span style="font-size: 32pt; font-weight: 900; color: yellow; line-height: 1.2;">📱 QR<br>준비</span>`, 
          "", 
          "⬅️ 왼쪽 카메라에<br>학생증을 비춰주세요"
        );
        isScanning = true;
      }, 1500); 
    }

    function updateUI(color, iconHtml, title, message) {
      const box = document.getElementById('photo-box'); box.style.borderColor = color; box.innerHTML = iconHtml;
      
      const titleEl = document.getElementById('status-title');
      if(title) {
        titleEl.style.display = "block";
        titleEl.innerText = title;
        titleEl.style.color = color;
      } else {
        titleEl.style.display = "none";
      }
      
      const msgEl = document.getElementById('status-message');
      msgEl.innerHTML = `<span style="color:${color === 'yellow' ? '#9ca3af' : 'white'}; font-weight:bold;">${message}</span>`;
    }
  </script>
</body>
</html>
