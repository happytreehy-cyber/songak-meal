<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>송악고등학교 석식 급식 확인 시스템</title>
  <!-- jsQR 라이브러리 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h1 { font-size: 1.2rem; font-weight: 700; color: #4ade80; }
    .btn-switch {
      background: #27272a;
      color: #e4e4e7;
      border: 1px solid #3f3f46;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .scanner-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      aspect-ratio: 4/3;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #27272a;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* 전면 카메라는 거울 모드로 반전 표시 */
      transform: scaleX(-1);
    }
    .video-rear {
      transform: scaleX(1) !important;
    }
    canvas { display: none; }
    .scan-guide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 65%;
      aspect-ratio: 1/1;
      border: 2px dashed rgba(74, 222, 128, 0.7);
      border-radius: 16px;
      pointer-events: none;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.35);
    }
    .result-card {
      width: 100%;
      max-width: 600px;
      margin-top: 16px;
      background: #18181b;
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #27272a;
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 140px;
    }
    .photo-box {
      width: 90px;
      height: 115px;
      background: #27272a;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: #71717a;
      flex-shrink: 0;
      border: 1px solid #3f3f46;
    }
    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .info-box { flex: 1; }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .status-standby { background: #27272a; color: #a1a1aa; }
    .status-ok { background: #166534; color: #4ade80; }
    .status-error { background: #991b1b; color: #f87171; }
    .student-name { font-size: 1.4rem; font-weight: 700; margin-bottom: 2px; }
    .student-id { font-size: 0.95rem; color: #a1a1aa; }
  </style>
</head>
<body>

  <header>
    <h1>송악고 급식 확인기</h1>
    <button class="btn-switch" id="switchBtn" onclick="toggleCamera()">카메라 전환 (후면)</button>
  </header>

  <div class="scanner-container">
    <video id="video" playsinline></video>
    <div class="scan-guide"></div>
  </div>

  <canvas id="canvas"></canvas>

  <div class="result-card">
    <div class="photo-box" id="photoBox">사진</div>
    <div class="info-box">
      <div id="statusBadge" class="status-badge status-standby">대기 중</div>
      <div id="studentName" class="student-name">-</div>
      <div id="studentId" class="student-id">QR 코드를 화면에 비춰주세요</div>
    </div>
  </div>

  <script>
    // 1. Google Apps Script 배포 URL (배포 후 주소 입력)
    const GAS_URL = "여기에_구글_웹앱_URL을_넣으세요";
    
    // 2. GitHub Photos 기본 경로 (학번.jpeg 파일 매칭)
    const PHOTO_BASE_URL = "./photos/";

    let currentFacingMode = "user"; // 기본 전면 카메라 (나를 바라봄)
    let videoStream = null;
    let isProcessing = false;
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    // 오디오 피드백 설정
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 880, duration = 0.15) {
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start();
      osc.stop(audioContext.currentTime + duration);
    }

    // 카메라 시작 (전면 우선)
    async function startCamera(facingMode) {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };
        videoStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = videoStream;
        await video.play();

        // 전면 카메라일 때만 좌우 거울 반전 스타일 적용
        if (facingMode === "user") {
          video.classList.remove("video-rear");
        } else {
          video.classList.add("video-rear");
        }

        requestAnimationFrame(tick);
      } catch (err) {
        console.error("카메라 접근 오류:", err);
        alert("카메라를 켤 수 없습니다. 권한을 확인해 주세요.");
      }
    }

    // 카메라 전/후면 전환 토글
    function toggleCamera() {
      currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
      const switchBtn = document.getElementById("switchBtn");
      switchBtn.innerText = currentFacingMode === "user" ? "카메라 전환 (후면)" : "카메라 전환 (전면)";
      startCamera(currentFacingMode);
    }

    // QR 프레임 스캔 루프
    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert"
        });

        if (code && code.data && !isProcessing) {
          handleScan(code.data.trim());
        }
      }
      requestAnimationFrame(tick);
    }

    // QR 인식 후 처리 로직
    async function handleScan(qrText) {
      isProcessing = true;

      // 화면 즉시 반응
      const badge = document.getElementById("statusBadge");
      const nameEl = document.getElementById("studentName");
      const idEl = document.getElementById("studentId");
      const photoBox = document.getElementById("photoBox");

      badge.className = "status-badge status-standby";
      badge.innerText = "조회 중...";
      nameEl.innerText = "데이터 확인 중";
      idEl.innerText = qrText;

      try {
        // 사진 사전 로드 (학번.jpeg 경로)
        const studentId = qrText.split(/[^0-9]/)[0] || qrText;
        photoBox.innerHTML = `<img src="${PHOTO_BASE_URL}${studentId}.jpeg" onerror="this.src=''; this.alt='사진 없음';">`;

        // Apps Script 출석 마킹 요청 전송
        const response = await fetch(`${GAS_URL}?id=${encodeURIComponent(qrText)}`);
        const result = await response.json();

        if (result.status === "SUCCESS") {
          playBeep(880, 0.15); // 성공 비프
          badge.className = "status-badge status-ok";
          badge.innerText = "식사 승인";
          nameEl.innerText = result.name || "학생";
          idEl.innerText = `${result.studentId} (${result.grade}학년 ${result.classNum}반)`;
        } else {
          playBeep(330, 0.3); // 경고 비프
          badge.className = "status-badge status-error";
          badge.innerText = result.message || "확인 불가";
        }
      } catch (e) {
        // 서버 연결 실패 시에도 QR 학번 기본 표시
        playBeep(880, 0.15);
        badge.className = "status-badge status-ok";
        badge.innerText = "확인 완료 (로컬)";
      }

      // 2초 딜레이 후 다음 학생 스캔 허용 (중복 스캔 방지)
      setTimeout(() => {
        isProcessing = false;
        badge.className = "status-badge status-standby";
        badge.innerText = "대기 중";
      }, 2000);
    }

    // 실행 시작
    window.addEventListener("DOMContentLoaded", () => {
      startCamera(currentFacingMode);
    });
  </script>
</body>
</html>
