<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>송악고 석식 시스템 (학생용)</title>
  <style>
    body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background-color: #111827; color: white; font-family: 'Apple SD Gothic Neo', sans-serif; overflow: hidden; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #1f2937; border-bottom: 2px solid #374151; }
    .header-left { display: flex; align-items: baseline; gap: 15px; }
    .title { font-size: 22pt; font-weight: 900; color: #60a5fa; letter-spacing: 1px; }
    .clock { font-size: 14pt; color: #9ca3af; font-weight: bold; }
    
    .header-right { display: flex; gap: 12px; align-items: center; }
    .stat-badge { padding: 8px 15px; border-radius: 8px; font-size: 14pt; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .stat-total { background: #3b82f6; cursor: pointer; } 
    .stat-done { background: #10b981; } 
    .stat-left { background: #ef4444; }
    
    .cam-btn { padding: 8px 15px; background: #4b5563; color: white; border: none; border-radius: 8px; font-size: 13pt; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-right: 15px; }
    .cam-btn:active { background: #374151; transform: scale(0.95); }

    .main-content { display: flex; flex: 1; height: 100%; }
    .camera-section { flex: 2; display: flex; flex-direction: column; padding: 20px; }
    .info-section { flex: 1; background-color: #1a1e29; border-left: 2px solid #2d3748; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    
    /* 🌟 바깥 파란 네온, 안쪽은 쨍한 초록색 타겟 박스 고정 */
    .camera-wrapper { position: relative; width: 100%; height: 100%; border-radius: 12px; overflow: hidden; border: 4px solid #60a5fa; box-shadow: 0 0 25px rgba(96, 165, 250, 0.4); background: #000; }
    #reader { width: 100%; height: 100%; }
    .custom-target { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 250px; height: 250px; border: 6px solid #4ade80; border-radius: 20px; box-shadow: 0 0 0 4000px rgba(0,0,0,0.5); pointer-events: none; z-index: 10; }

    .box-title { font-size: 24pt; font-weight: 900; margin-bottom: 10px; }
    .box-content { font-size: 18pt; margin-bottom: 5px; font-weight: bold; }
    .status-circle { width: 220px; height: 220px; border: 6px solid yellow; border-radius: 30px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; background: #111827; box-shadow: 0 0 20px rgba(255,255,0,0.2); }
    
    .warning-text { margin-top: 15px; font-size: 12pt; color: #f87171; font-weight: bold; background: rgba(239, 68, 68, 0.1); padding: 12px; border-radius: 8px; line-height: 1.4; }

    /* ★ 하단 로켓 진행 바 디자인 */
    #loading-overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
    .progress-container { width: 80%; max-width: 400px; height: 6px; background: #374151; border-radius: 3px; position: relative; margin-top: 40px; }
    .progress-bar { height: 100%; background: #3b82f6; width: 0%; border-radius: 3px; transition: width 0.5s ease; }
    .rocket-icon { font-size: 30pt; position: absolute; top: -35px; left: 0%; transform: translateX(-50%); transition: left 0.5s ease; }

    .error-btn { margin-top:20px; padding: 12px 25px; background: #ef4444; color: white; font-weight: bold; font-size: 16pt; border: none; border-radius: 8px; cursor: pointer; }

    #stats-modal { display: none; position: fixed; top: 75px; right: 20px; background: #1f2937; padding: 20px 25px; border-radius: 12px; z-index: 200; box-shadow: 0 10px 30px rgba(0,0,0,0.7); width: 420px; border: 2px solid #374151; }
    .modal-backdrop { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: transparent; z-index: 150; }
    .grade-stat-row { display: flex; justify-content: space-between; font-size: 13pt; padding: 10px 0; border-bottom: 1px solid #374151; font-weight: bold; }
    .close-btn { width: 100%; padding: 10px; margin-top: 15px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 13pt; font-weight: bold; cursor: pointer; }
  </style>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  
  <div id="loading-overlay">
    <div style="font-size: 70pt; margin-bottom: 10px;">👩‍🍳</div>
    <h2 id="loading-msg" style="color: #3b82f6; font-size: 26pt; margin-bottom: 10px;">오늘도 송악고 급식실은<br>맛있게 조리 중입니다</h2>
    <div style="font-size: 14pt; color: #9ca3af; margin-top:10px;" id="loading-status">명단을 불러오는 중...</div>
    
    <div class="progress-container">
      <div class="rocket-icon" id="rocket-icon">🚀</div>
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-bg" onclick="closeStats()"></div>
  <div id="stats-modal">
    <h3 style="margin-top:0; color:#60a5fa; text-align:center; font-size:16pt; margin-bottom: 15px;">📊 학년별 식사 현황</h3>
    <div id="stats-detail-content">로딩 중...</div>
    <button class="close-btn" onclick="closeStats()">닫기</button>
  </div>

  <div class="header">
    <div class="header-left">
      <div class="title">🍴 송악고 석식 시스템 (학생용)</div>
      <div class="clock" id="live-clock">0000. 00. 00. 00:00:00</div>
    </div>
    <div style="display:flex;">
      <!-- ★ 전환 버튼 다시 예쁘게 복구 완료! -->
      <button class="cam-btn" onclick="switchCamera()">🔄 카메라 전환</button>
      <div class="header-right">
        <div class="stat-badge stat-total" onclick="openStats()">총신청: <span id="val-total">0</span></div>
        <div class="stat-badge stat-done">완료: <span id="val-done">0</span></div>
        <div class="stat-badge stat-left">미식사: <span id="val-left">0</span></div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="camera-section">
      <div class="camera-wrapper">
        <div id="reader"></div>
        <div class="custom-target"></div>
      </div>
    </div>
    <div class="info-section">
      <div class="status-circle" id="photo-box">
        <div class="box-content" style="font-size: 32pt; font-weight: 900; color: yellow; line-height: 1.2; text-align: center;">🪪<br>QR<br>준비</div>
      </div>
      <div class="box-title" id="status-title" style="display: none;"></div>
      <div class="box-content" id="status-message" style="color: #9ca3af; font-size: 20pt; margin-top: 10px;">⬅️ 왼쪽 카메라에<br>QR을 비춰주세요</div>
      <div class="warning-text">
        * 선생님 화면에서는 QR 인식 시<br>해당 학생의 실제 사진이 표시됩니다.
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKZBLj0pzD0dNU_fAvhF6j6x3Xzl7PL5-yYJabG8oZ45qBKonZa2r-9YsJ7-eJkElY/exec";
    
    let html5QrCode;
    let currentCamMode = "user"; // ★ 무조건 앞면(셀카)으로 시작하게 강제 고정!
    let studentCache = {}, isScanning = true, currentStatsDetails = null;
    
    setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleString('ko-KR'); }, 1000);

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (type === 'success') { 
        const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1); osc.connect(gainNode); gainNode.connect(audioCtx.destination); gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
      } else if (type === 'duplicate') { 
        const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(440, audioCtx.currentTime); osc.connect(gainNode); gainNode.connect(audioCtx.destination); gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime); gainNode.gain.setValueAtTime(0, audioCtx.currentTime + 0.1); gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + 0.15); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'error') { 
        const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.connect(gainNode); gainNode.connect(audioCtx.destination); gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.15); const osc2 = audioCtx.createOscillator(), gainNode2 = audioCtx.createGain(); osc2.type = 'sawtooth'; osc2.frequency.setValueAtTime(300, audioCtx.currentTime + 0.2); osc2.connect(gainNode2); gainNode2.connect(audioCtx.destination); gainNode2.gain.setValueAtTime(0.3, audioCtx.currentTime + 0.2); gainNode2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35); osc2.start(audioCtx.currentTime + 0.2); osc2.stop(audioCtx.currentTime + 0.35);
      }
    }

    function refreshStats() {
      fetch(SCRIPT_URL + "?action=GET_DETAILS")
        .then(r => r.json())
        .then(res => {
          if(res.totalStats) {
            currentStatsDetails = res;
            updateStatsUI();
          } else { fallbackToLocalStats(); }
        }).catch(e => { fallbackToLocalStats(); });
    }

    function fallbackToLocalStats() {
      if(Object.keys(studentCache).length === 0) return;
      let stats = { 1: {total:0, done:0, left:0}, 2: {total:0, done:0, left:0}, 3: {total:0, done:0, left:0}, totalStats: {total:0, done:0, left:0} };
      for (let id in studentCache) {
        let s = studentCache[id]; let g = parseInt(id.charAt(0));
        stats.totalStats.total++; if(stats[g]) stats[g].total++;
        if (s.marked === 1) { stats.totalStats.done++; if(stats[g]) stats[g].done++; } 
        else { stats.totalStats.left++; if(stats[g]) stats[g].left++; }
      }
      currentStatsDetails = stats; updateStatsUI();
    }

    function updateStatsUI() {
      if(!currentStatsDetails) return;
      document.getElementById('val-total').innerText = currentStatsDetails.totalStats.total;
      document.getElementById('val-done').innerText = currentStatsDetails.totalStats.done;
      document.getElementById('val-left').innerText = currentStatsDetails.totalStats.left;
    }

    function openStats() {
      if(!currentStatsDetails) { alert("아직 통계를 불러오지 못했습니다."); return; }
      let html = "";
      [1, 2, 3].forEach(grade => {
        let st = currentStatsDetails[grade];
        if(st) { 
          html += `<div class="grade-stat-row"><span style="color:#60a5fa;">${grade}학년</span> <span>총 신청: ${st.total}명</span> <span style="color:#10b981;">식사완료: ${st.done}명</span> <span style="color:#ef4444;">미식사: ${st.left}명</span></div>`; 
        }
      });
      document.getElementById('stats-detail-content').innerHTML = html;
      document.getElementById('stats-modal').style.display = 'block'; document.getElementById('modal-bg').style.display = 'block';
    }
    function closeStats() { document.getElementById('stats-modal').style.display = 'none'; document.getElementById('modal-bg').style.display = 'none'; }

    window.onload = function() {
      refreshStats();
      
      let progress = 0;
      let progressTimer = setInterval(() => {
        progress += 5; 
        if(progress > 90) progress = 90; 
        document.getElementById('rocket-icon').style.left = progress + '%';
        document.getElementById('progress-bar').style.width = progress + '%';
      }, 500);

      let timeout = setTimeout(() => {
        clearInterval(progressTimer);
        showErrorUI("구글 서버 응답이 없습니다.<br>새 버전을 제대로 배포했는지 확인해주세요!");
      }, 15000);

      fetch(SCRIPT_URL + "?action=GET_ALL_STUDENTS")
        .then(r => r.text())
        .then(text => {
          clearTimeout(timeout);
          try {
            let res = JSON.parse(text);
            if(res.status === "SUCCESS") {
              studentCache = res.data;
              
              clearInterval(progressTimer);
              document.getElementById('rocket-icon').style.left = '100%';
              document.getElementById('progress-bar').style.width = '100%';
              document.getElementById('loading-status').innerText = "로딩 완료!";
              
              setTimeout(() => {
                document.getElementById('loading-overlay').style.display = 'none';
                fallbackToLocalStats(); 
                initCamera(); 
                setInterval(refreshStats, 10000); 
              }, 600);
              
            } else {
              clearInterval(progressTimer); showErrorUI(`구글 시트 에러: ${res.message || '알 수 없는 에러'}`);
            }
          } catch(e) {
            clearInterval(progressTimer); showErrorUI("구글 연동 실패!<br>(배포 시 <b>'모든 사용자'</b> 권한인지 꼭 확인하세요)");
          }
        }).catch(err => {
          clearTimeout(timeout); clearInterval(progressTimer);
          showErrorUI("통신 실패! 인터넷 연결이나 웹앱 주소를 다시 확인해주세요.");
        });
    };

    function showErrorUI(errorMsg) {
      document.getElementById('loading-overlay').innerHTML = `<div style="font-size: 70pt; margin-bottom: 10px;">❌</div><h2 style="color: #ef4444; font-size: 26pt; margin-bottom: 10px;">데이터를 불러오지 못했습니다!</h2><div style="font-size: 15pt; color: #9ca3af; margin-top:10px;">${errorMsg}</div><br><br><button class="error-btn" onclick="location.reload()">새로고침(다시시도)</button>`;
    }

    // 🌟 완전 앞면(셀카) 고정 + 전환 기능 복구
    function initCamera() {
      html5QrCode = new Html5Qrcode("reader");
      startCamera();
    }

    function startCamera() {
      html5QrCode.start(
        { facingMode: currentCamMode }, // 처음 시작은 무조건 "user" (앞면)
        { fps: 30, qrbox: { width: 250, height: 250 } }, // 바코드 & QR 동시 인식 지원!
        onScanSuccess,
        (ignoreError) => {} 
      ).catch(e => {
         console.log("카메라 실행 에러:", e);
         alert("카메라 실행 실패! 태블릿 설정에서 웹 브라우저의 카메라 권한을 허용해주세요.");
      });
    }

    // 🌟 카메라 전환 버튼 작동 로직 복구
    function switchCamera() {
      html5QrCode.stop().then(() => {
        // user면 environment로, environment면 user로 쇽! 전환
        currentCamMode = (currentCamMode === "user") ? "environment" : "user";
        startCamera();
      }).catch(e => {
        // 혹시 끄는 데 실패해도 강제로 전환 시도
        currentCamMode = (currentCamMode === "user") ? "environment" : "user";
        startCamera();
      });
    }

    function onScanSuccess(decodedText, decodedResult) {
      if(!isScanning) return; 
      isScanning = false;
      
      let studentId = decodedText.trim().replace(/[^0-9]/g, '');
      let student = studentCache[studentId];
      let nowTime = new Date().toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' });

      if (!student) {
        playBeep('error'); updateUI("#ef4444", `<span style="font-size: 70pt; color: #ef4444;">🔴</span>`, "경고", "당일 석식 미신청자입니다");
      } else if (student.marked === 1) {
        playBeep('duplicate'); updateUI("orange", `<span style="font-size: 70pt; color: orange;">🟠</span>`, "⚠ 중복 식사 !", `이미 식사한 학생입니다<br><span style="font-size:12pt;color:#9ca3af;">(시간: ${nowTime})</span>`);
        fetch(SCRIPT_URL + "?action=MARK_ATTENDANCE&id=" + studentId);
      } else {
        playBeep('success'); updateUI("#4CAF50", `<span style="font-size: 70pt; color: #4CAF50;">🟢</span>`, "✓ 정상 승인", `<span style="color:#10b981;">(맛있게 드세요!)</span><br><span style="color:white;">${student.name}</span>`);
        
        student.marked = 1;
        if(currentStatsDetails) {
          currentStatsDetails.totalStats.done++; currentStatsDetails.totalStats.left--;
          let g = studentId.charAt(0);
          if(currentStatsDetails[g]) { currentStatsDetails[g].done++; currentStatsDetails[g].left--; }
          updateStatsUI(); 
        }
        
        fetch(SCRIPT_URL + "?action=MARK_ATTENDANCE&id=" + studentId);
      }

      setTimeout(() => {
        updateUI(
          "yellow", 
          `<div style="font-size: 32pt; font-weight: 900; color: yellow; line-height: 1.2; text-align: center;">🪪<br>QR<br>준비</div>`, 
          "", 
          "⬅️ 왼쪽 카메라에<br>QR을 비춰주세요"
        );
        isScanning = true;
      }, 1500); 
    }

    function updateUI(color, iconHtml, title, message) {
      const box = document.getElementById('photo-box'); box.style.borderColor = color; box.innerHTML = iconHtml;
      
      const titleEl = document.getElementById('status-title');
      if(title) {
        titleEl.style.display = "block"; titleEl.innerText = title; titleEl.style.color = color;
      } else { titleEl.style.display = "none"; }
      
      const msgEl = document.getElementById('status-message');
      msgEl.innerHTML = `<span style="color:${color === 'yellow' ? '#9ca3af' : 'white'}; font-weight:bold;">${message}</span>`;
    }
  </script>
</body>
</html>
