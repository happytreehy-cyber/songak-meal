<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>송악고등학교 석식 출입관리시스템</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      background: #1e293b;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #facc15;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .badge { background: #2563eb; color: #fff; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 16px; }
    .main-title { font-size: 22px; font-weight: bold; letter-spacing: -0.5px; }
    .time-box { background: #0f172a; padding: 6px 14px; border-radius: 8px; border: 1px solid #38bdf8; color: #38bdf8; font-family: monospace; font-size: 16px; font-weight: bold; }

    .header-right { display: flex; align-items: center; gap: 12px; }
    .stat-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid transparent;
    }
    .stat-total { background: #1e293b; border-color: #eab308; color: #fef08a; }
    .stat-done { background: #064e3b; border-color: #10b981; color: #a7f3d0; }
    .stat-rem { background: #451a03; border-color: #f97316; color: #fed7aa; }

    main {
      flex: 1;
      display: flex;
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }

    /* ★ 넓고 시원한 와이드 전면 카메라 스캐너 */
    .scanner-panel {
      flex: 1.25;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .video-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 가로막는 박스 제거 -> 와이드 감지 테두리 & 스캐닝 레이저 */
    .wide-scanner-border {
      position: absolute;
      inset: 16px;
      border: 2px dashed rgba(34, 197, 94, 0.4);
      border-radius: 12px;
      pointer-events: none;
    }
    .laser-line {
      width: 96%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #22c55e, #4ade80, #22c55e, transparent);
      box-shadow: 0 0 12px #22c55e;
      position: absolute;
      animation: wideLaser 2.2s infinite ease-in-out alternate;
    }
    @keyframes wideLaser {
      0% { top: 10%; opacity: 0.3; }
      100% { top: 90%; opacity: 1; }
    }

    .scanner-footer {
      background: #0f172a;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      color: #38bdf8;
      font-weight: bold;
    }

    /* 우측 정보 패널 */
    .info-panel {
      flex: 0.75;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      transition: all 0.2s ease;
    }
    .photo-box {
      width: 200px;
      height: 240px;
      border: 3px solid #facc15;
      border-radius: 12px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; }
    .photo-placeholder { font-size: 18px; color: #94a3b8; font-weight: bold; }
    .status-msg { font-size: 32px; font-weight: 800; margin-bottom: 8px; color: #f8fafc; }
    .student-id { font-size: 22px; color: #94a3b8; margin-bottom: 20px; font-weight: bold; }
    .action-badge {
      width: 85%;
      padding: 14px;
      background: #334155;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #cbd5e1;
      margin-bottom: 12px;
    }
    .recent-log { font-size: 13px; color: #64748b; }

    .status-pass { color: #22c55e !important; }
    .status-warn { color: #f59e0b !important; }
    .status-fail { color: #ef4444 !important; }

    .panel-pass { border: 2px solid #22c55e !important; box-shadow: 0 0 28px rgba(34, 197, 94, 0.45); }
    .panel-warn { border: 2px solid #f59e0b !important; box-shadow: 0 0 28px rgba(245, 158, 11, 0.45); }
    .panel-fail { border: 2px solid #ef4444 !important; box-shadow: 0 0 28px rgba(239, 68, 68, 0.45); }

    #startOverlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 17, 32, 0.92);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      cursor: pointer;
    }
    #startOverlay button {
      background: #2563eb; color: #fff; font-size: 20px; font-weight: bold;
      padding: 14px 28px; border: none; border-radius: 10px; cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="badge">송악고</div>
      <div class="main-title">석식 출입관리시스템</div>
      <div class="time-box" id="clock">00:00:00</div>
    </div>
    <div class="header-right">
      <div class="stat-card stat-total">📋 총신청 <span id="totalCount">-</span></div>
      <div class="stat-card stat-done">🍱 식사완료 <span id="doneCount">0</span></div>
      <div class="stat-card stat-rem">⏳ 미식사 <span id="remCount">-</span></div>
    </div>
  </header>

  <main>
    <div class="scanner-panel">
      <div class="video-wrapper" id="videoBox">
        <video id="webcam" playsinline autoplay muted></video>

        <!-- 와이드 전면 스캐닝 가이드 -->
        <div class="wide-scanner-border"></div>
        <div class="laser-line"></div>

        <div id="startOverlay">
          <button onclick="startApp()">📷 카메라 시작하기</button>
          <div style="margin-top: 12px; color: #94a3b8; font-size: 14px;">화면을 터치하면 스캐너가 켜집니다</div>
        </div>
      </div>
      <div class="scanner-footer">
        ⚡ 초광폭 전면 감지 모드: 화면 어디든 QR을 대충 스쳐도 즉시 인식됩니다
      </div>
    </div>

    <div class="info-panel" id="infoPanel">
      <div class="photo-box" id="photoBox">
        <div class="photo-placeholder" id="photoText">사진 대기</div>
      </div>
      <div class="status-msg" id="statusMsg">대기 중</div>
      <div class="student-id" id="studentSub">명찰 QR을 비춰주세요</div>
      <div class="action-badge" id="actionMsg">초고속 광폭 엔진 준비 완료</div>
      <div class="recent-log" id="recentLog">최근 기록: 없음</div>
    </div>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLF1Qw6ZtwWp3MsKakjIsOxUXRSmjqbxOvUBQ7QzAUw7IPacjHAJuL2FjpCMzj8b7t/exec";

    let isScanLocked = false; // ★ 연타 방지 하드웨어 잠금
    let lastScannedId = "";
    let lastScanTime = 0;
    let studentDB = {};
    let completedMap = new Map();
    let totalApplicantCount = 0;
    const videoElem = document.getElementById("webcam");

    // ==========================================
    // 🔔 3가지 맞춤 사운드 (Web Audio API)
    // ==========================================
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playDingDong() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        tone(ctx, 784, now, 0.28, "sine", 0.45);        // 높은 솔
        tone(ctx, 1046.5, now + 0.16, 0.45, "sine", 0.45); // 높은 도
      } catch (e) {}
    }

    function playDuplicateSound() {
      try {
        const ctx = getAudioContext();
        tone(ctx, 520, ctx.currentTime, 0.35, "triangle", 0.4);
      } catch (e) {}
    }

    function playRejectSound() {
      try {
        const ctx = getAudioContext();
        [0, 0.15, 0.3].forEach(delay => {
          tone(ctx, 260, ctx.currentTime + delay, 0.1, "sawtooth", 0.35);
        });
      } catch (e) {}
    }

    function tone(ctx, freq, start, dur, type, vol) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, start);
      gain.gain.setValueAtTime(vol, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + dur);
    }

    // ==========================================
    // 🚀 신청자 사전 로딩
    // ==========================================
    async function loadStudentDatabase() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getAll`);
        const json = await res.json();
        if (json.success) {
          studentDB = json.data;
          totalApplicantCount = Object.values(studentDB).filter(s => s.isApplied).length;
          document.getElementById("totalCount").innerText = totalApplicantCount;
          updateCounts();
        }
      } catch (e) {}
    }

    // ==========================================
    // 📷 초광폭 카메라 실행
    // ==========================================
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        videoElem.srcObject = stream;
        await videoElem.play();
        startDetection();
      } catch (err) {
        try {
          const stream2 = await navigator.mediaDevices.getUserMedia({ video: true });
          videoElem.srcObject = stream2;
          await videoElem.play();
          startDetection();
        } catch (e) {
          document.getElementById("startOverlay").style.display = "flex";
        }
      }
    }

    function startDetection() {
      if ('BarcodeDetector' in window) {
        const detector = new BarcodeDetector({ formats: ['qr_code'] });
        setInterval(async () => {
          if (isScanLocked || videoElem.readyState < 2) return;
          try {
            const codes = await detector.detect(videoElem);
            if (codes.length > 0) {
              handleQRScan(codes[0].rawValue);
            }
          } catch (e) {}
        }, 50);
      } else {
        const html5Qr = new Html5Qrcode("videoBox");
        html5Qr.start({ facingMode: "environment" }, { fps: 25 }, (text) => handleQRScan(text), () => {});
      }
    }

    // ==========================================
    // ⚡ 2번 찍힘 원천 차단 + 분기 로직
    // ==========================================
    function handleQRScan(rawValue) {
      const studentId = String(rawValue).replace(/\s+/g, "");
      const now = Date.now();

      // ★ 1. 스캔 즉시 락 & 동일 학번 3초 내 연속 감지 100% 무시
      if (isScanLocked) return;
      if (studentId === lastScannedId && (now - lastScanTime) < 3000) return;

      isScanLocked = true;
      lastScannedId = studentId;
      lastScanTime = now;

      // 1) 당일 이미 통과한 학생이 다시 찍었을 때 (중복)
      if (completedMap.has(studentId)) {
        playDuplicateSound();
        const passTime = completedMap.get(studentId);
        const stu = studentDB[studentId] || { id: studentId, name: "" };
        showDuplicateUI(stu, passTime);

        // ★ 이상감지 기록 시트로 비동기 전송
        fetch(`${SCRIPT_URL}?id=${encodeURIComponent(studentId)}&type=DUPLICATE`).catch(()=>{});

        setTimeout(() => { resetUI(); isScanLocked = false; }, 2000);
        return;
      }

      // 2) 정상 석식 신청자인 경우 (0.01초 즉시 승인)
      if (studentDB && studentDB[studentId]) {
        const stu = studentDB[studentId];
        if (stu.isApplied) {
          const nowStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          completedMap.set(studentId, nowStr);

          playDingDong(); // 🔔 띵~동♪
          showApprovedUI(stu);
          updateCounts();

          // 정상 승인은 블랙박스 + 출석부 O 전송 (단 1회)
          fetch(`${SCRIPT_URL}?id=${encodeURIComponent(studentId)}&type=NORMAL`).catch(()=>{});
        } else {
          // 미신청 학생이 찍었을 때
          playRejectSound();
          showRejectedUI("석식 미신청 학생입니다", stu);

          // ★ 이상감지 기록 시트로 전송
          fetch(`${SCRIPT_URL}?id=${encodeURIComponent(studentId)}&type=UNAPPLIED`).catch(()=>{});
        }

        setTimeout(() => { resetUI(); isScanLocked = false; }, 1800);
        return;
      }

      // 3) 캐시에 없는 미등록 학번인 경우
      showProcessingUI(studentId);
      fetch(`${SCRIPT_URL}?id=${encodeURIComponent(studentId)}&type=NORMAL`)
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            const nowStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            completedMap.set(studentId, nowStr);
            playDingDong();
            showApprovedUI(res.student);
            updateCounts();
          } else {
            playRejectSound();
            showRejectedUI(res.message, res.student);
          }
        })
        .catch(() => {
          playRejectSound();
          showErrorUI("통신 에러가 발생했습니다.");
        })
        .finally(() => {
          setTimeout(() => { resetUI(); isScanLocked = false; }, 1800);
        });
    }

    // UI 반응 함수
    function showProcessingUI(id) {
      document.getElementById("statusMsg").innerText = "확인 중...";
      document.getElementById("statusMsg").className = "status-msg";
      document.getElementById("studentSub").innerText = "학번: " + id;
      document.getElementById("actionMsg").innerText = "데이터 조회 중";
    }

    function showApprovedUI(stu) {
      const p = document.getElementById("infoPanel");
      p.className = "info-panel panel-pass";
      document.getElementById("statusMsg").innerText = "식사 승인 ✅";
      document.getElementById("statusMsg").className = "status-msg status-pass";
      document.getElementById("studentSub").innerText = `${stu.id} ${stu.name}`;
      document.getElementById("actionMsg").innerText = "맛있게 드세요!";
      document.getElementById("actionMsg").style.background = "#059669";
      document.getElementById("recentLog").innerText = `최근 통과: ${stu.id} ${stu.name}`;

      if (stu.photoUrl) {
        document.getElementById("photoBox").innerHTML = `<img src="${stu.photoUrl}" alt="사진">`;
      } else {
        document.getElementById("photoBox").innerHTML = `<div class="photo-placeholder" style="color:#10b981;">승인 완료</div>`;
      }
    }

    function showDuplicateUI(stu, time) {
      const p = document.getElementById("infoPanel");
      p.className = "info-panel panel-warn";
      document.getElementById("statusMsg").innerText = "중복 체크 ⚠️";
      document.getElementById("statusMsg").className = "status-msg status-warn";
      document.getElementById("studentSub").innerText = `${stu.id} ${stu.name || ''}`;
      document.getElementById("actionMsg").innerText = `이미 확인됨 (${time} 통과)`;
      document.getElementById("actionMsg").style.background = "#d97706";
      document.getElementById("photoBox").innerHTML = `<div class="photo-placeholder" style="color:#f59e0b;">이미 식사함</div>`;
    }

    function showRejectedUI(msg, stu) {
      const p = document.getElementById("infoPanel");
      p.className = "info-panel panel-fail";
      document.getElementById("statusMsg").innerText = "출입 차단 ❌";
      document.getElementById("statusMsg").className = "status-msg status-fail";
      document.getElementById("studentSub").innerText = stu ? `${stu.id} ${stu.name}` : "미신청 학생";
      document.getElementById("actionMsg").innerText = msg || "석식 미신청자입니다";
      document.getElementById("actionMsg").style.background = "#dc2626";
      document.getElementById("photoBox").innerHTML = `<div class="photo-placeholder" style="color:#ef4444;">승인 거부</div>`;
    }

    function showErrorUI(msg) {
      document.getElementById("statusMsg").innerText = "오류 ⚠️";
      document.getElementById("statusMsg").className = "status-msg status-fail";
      document.getElementById("actionMsg").innerText = msg;
    }

    function resetUI() {
      const p = document.getElementById("infoPanel");
      p.className = "info-panel";
      document.getElementById("statusMsg").innerText = "대기 중";
      document.getElementById("statusMsg").className = "status-msg";
      document.getElementById("studentSub").innerText = "명찰 QR을 비춰주세요";
      document.getElementById("actionMsg").innerText = "스캔 준비 완료";
      document.getElementById("actionMsg").style.background = "#334155";
      document.getElementById("photoBox").innerHTML = `<div class="photo-placeholder">사진 대기</div>`;
    }

    function updateCounts() {
      document.getElementById("doneCount").innerText = completedMap.size;
      if (totalApplicantCount > 0) {
        document.getElementById("remCount").innerText = Math.max(0, totalApplicantCount - completedMap.size);
      }
    }

    function updateClock() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      document.getElementById("clock").innerText =
        `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function startApp() {
      document.getElementById("startOverlay").style.display = "none";
      getAudioContext();
      startCamera();
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadStudentDatabase();
      startCamera();
    });

    document.body.addEventListener("click", () => {
      getAudioContext();
    }, { once: true });
  </script>
</body>
</html>
