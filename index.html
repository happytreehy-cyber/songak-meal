<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>송악고 석식 출입관리시스템</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 10px 16px;
      overflow: hidden;
    }

    /* 상단 탑바 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-school {
      background: #2563eb;
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .title-text {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .clock-tag {
      background: #1e293b;
      color: #38bdf8;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #334155;
    }
    .stats-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .stat-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .stat-total { background: #382715; color: #fbbf24; border: 1px solid #78350f; }
    .stat-done  { background: #133924; color: #4ade80; border: 1px solid #166534; }
    .stat-left  { background: #3a1919; color: #f87171; border: 1px solid #991b1b; }
    
    .btn-cam {
      background: #1f2937;
      color: #94a3b8;
      border: 1px solid #374151;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* 메인 좌우 2분할 레이아웃 */
    .main-content {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 16px;
      flex: 1;
      margin-top: 10px;
      min-height: 0;
    }

    /* 좌측 스캐너 패널 */
    .scanner-card {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* 전면 카메라 거울 반전 */
    }
    .video-rear {
      transform: scaleX(1) !important;
    }
    canvas { display: none; }
    
    .scan-target {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      aspect-ratio: 1/1;
      border: 3px solid #22c55e;
      border-radius: 20px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }
    .scanner-tip {
      position: absolute;
      bottom: 12px;
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: #eab308;
      font-weight: 500;
      pointer-events: none;
    }

    /* 우측 정보 패널 */
    .info-card {
      background: #111827;
      border-radius: 12px;
      border: 1px solid #1f2937;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .photo-box {
      width: 140px;
      height: 180px;
      border: 2px solid #eab308; /* 노란색 테두리 */
      border-radius: 14px;
      background: #1a2234;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 24px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .status-main {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .status-standby { color: #f8fafc; }
    .status-ok { color: #4ade80; }
    .status-dup { color: #fbbf24; }
    .status-err { color: #f87171; }
    
    .status-sub {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .engine-tag {
      background: #1e293b;
      color: #64748b;
      font-size: 0.8rem;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-group">
      <span class="badge-school">송악고</span>
      <span class="title-text">석식 출입관리시스템</span>
      <span class="clock-tag" id="liveClock">2026-09-09 00:00:00</span>
    </div>
    <div class="stats-group">
      <div class="stat-badge stat-total">📊 총신청 <span id="cntTotal">4</span></div>
      <div class="stat-badge stat-done">🍱 식사완료 <span id="cntDone">0</span></div>
      <div class="stat-badge stat-left">⏳ 미식사 <span id="cntLeft">4</span></div>
      <button class="btn-cam" onclick="toggleCamera()">카메라 전환</button>
    </div>
  </header>

  <main class="main-content">
    <!-- 좌측: 카메라 뷰 -->
    <div class="scanner-card">
      <video id="video" playsinline></video>
      <div class="scan-target"></div>
      <div class="scanner-tip">⚡ 고속 하드웨어 가속: 초록창에 QR을 가볍게 비춰주세요</div>
    </div>

    <!-- 우측: 결과 카드 -->
    <div class="info-card">
      <div class="photo-box" id="photoBox">사진 대기</div>
      <div class="status-main status-standby" id="statusTitle">대기 중</div>
      <div class="status-sub" id="statusSub">명찰 QR을 비춰주세요</div>
      <div class="engine-tag" id="engineTag">초고속 엔진 가동 완료</div>
    </div>
  </main>

  <canvas id="canvas"></canvas>

  <script>
    // 1. Google Apps Script Web App URL
    const GAS_URL = "여기에_구글_웹앱_URL을_넣으세요";
    const PHOTO_BASE_URL = "./photos/";

    let currentFacingMode = "user"; // 첫 세팅: 나를 바라보는 전면 카메라
    let videoStream = null;
    let isProcessing = false;

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    // 실시간 시계 업데이트
    function updateClock() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById("liveClock").innerText = 
        `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 0.1초 고속 비프음 생성기
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq = 880, duration = 0.12) {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    // 전면 카메라 우선 시작
    async function startCamera(facingMode) {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: { ideal: facingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };
        videoStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = videoStream;
        await video.play();

        if (facingMode === "user") {
          video.classList.remove("video-rear");
        } else {
          video.classList.add("video-rear");
        }

        requestAnimationFrame(fastScanLoop);
      } catch (err) {
        console.error("카메라 오류:", err);
      }
    }

    function toggleCamera() {
      currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
      startCamera(currentFacingMode);
    }

    // 신용카드 결제기급 0.1초 광폭 고속 프레임 스캔
    function fastScanLoop() {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // 연산 속도 극대화를 위한 다운샘플링 캔버스
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height, {
          inversionAttempts: "dontInvert"
        });

        if (code && code.data && !isProcessing) {
          handleFastMatch(code.data.trim());
        }
      }
      requestAnimationFrame(fastScanLoop);
    }

    // 초고속 승인 처리
    async function handleFastMatch(rawCode) {
      isProcessing = true;

      const titleEl = document.getElementById("statusTitle");
      const subEl = document.getElementById("statusSub");
      const photoEl = document.getElementById("photoBox");

      titleEl.className = "status-main status-standby";
      titleEl.innerText = "조회 중...";
      subEl.innerText = rawCode;

      // 사진 즉각 매칭 시도
      const studentId = rawCode.split(/[^0-9]/)[0] || rawCode;
      photoEl.innerHTML = `<img src="${PHOTO_BASE_URL}${studentId}.jpeg" onerror="this.src=''; this.parentElement.innerText='사진 대기';">`;

      try {
        const res = await fetch(`${GAS_URL}?id=${encodeURIComponent(rawCode)}`);
        const data = await res.json();

        if (data.status === "SUCCESS") {
          beep(880, 0.15); // 성공 삑!
          titleEl.className = "status-main status-ok";
          titleEl.innerText = "식사 승인";
          subEl.innerText = `${data.name || ''} (${data.studentId})`;

          if (data.stats) {
            document.getElementById("cntTotal").innerText = data.stats.total;
            document.getElementById("cntDone").innerText = data.stats.done;
            document.getElementById("cntLeft").innerText = data.stats.left;
          }
        } else if (data.status === "DUPLICATE") {
          beep(440, 0.25); // 중복 삑-
          titleEl.className = "status-main status-dup";
          titleEl.innerText = "중복 식사";
          subEl.innerText = data.message || "이미 식사 확인되었습니다";
        } else {
          beep(300, 0.3); // 경고 삑-
          titleEl.className = "status-main status-err";
          titleEl.innerText = "미신청 학생";
          subEl.innerText = data.message || "석식 신청 명단에 없습니다";
        }
      } catch (err) {
        beep(880, 0.12);
        titleEl.className = "status-main status-ok";
        titleEl.innerText = "승인 (로컬)";
      }

      // 1.5초 딜레이 후 대기 복귀
      setTimeout(() => {
        isProcessing = false;
        titleEl.className = "status-main status-standby";
        titleEl.innerText = "대기 중";
        subEl.innerText = "명찰 QR을 비춰주세요";
        photoEl.innerText = "사진 대기";
      }, 1500);
    }

    window.addEventListener("DOMContentLoaded", () => {
      startCamera(currentFacingMode);
    });
  </script>
</body>
</html>
