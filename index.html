<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>송악고등학교 석식 출입관리시스템</title>
  <!-- html5-qrcode 최신 안정화 라이브러리 -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      background: #1e293b;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #facc15;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .badge { background: #2563eb; color: #fff; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 16px; }
    .main-title { font-size: 22px; font-weight: bold; letter-spacing: -0.5px; }
    .time-box { background: #0f172a; padding: 6px 14px; border-radius: 8px; border: 1px solid #38bdf8; color: #38bdf8; font-family: monospace; font-size: 16px; font-weight: bold; }

    .header-right { display: flex; align-items: center; gap: 12px; }
    .stat-card {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      border: 2px solid transparent;
    }
    .stat-total { background: #1e293b; border-color: #eab308; color: #fef08a; }
    .stat-done { background: #064e3b; border-color: #10b981; color: #a7f3d0; }
    .stat-rem { background: #451a03; border-color: #f97316; color: #fed7aa; }

    main {
      flex: 1;
      display: flex;
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }

    /* 왼쪽 카메라 영역 */
    .scanner-panel {
      flex: 1.1;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    #reader {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }
    .scanner-footer {
      background: #0f172a;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      color: #38bdf8;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    /* 오른쪽 학생 정보 표시 패널 */
    .info-panel {
      flex: 0.9;
      background: #1e293b;
      border-radius: 12px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      transition: all 0.25s ease;
    }
    .photo-box {
      width: 200px;
      height: 240px;
      border: 3px solid #facc15;
      border-radius: 12px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .photo-placeholder {
      font-size: 18px;
      color: #94a3b8;
      font-weight: bold;
    }
    .status-msg {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    .student-id {
      font-size: 22px;
      color: #94a3b8;
      margin-bottom: 24px;
      font-weight: bold;
    }
    .action-badge {
      width: 85%;
      padding: 14px;
      background: #334155;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #cbd5e1;
      margin-bottom: 12px;
    }
    .recent-log {
      font-size: 13px;
      color: #64748b;
    }

    /* 통과 / 차단 시각 효과 */
    .status-pass { color: #22c55e !important; }
    .status-fail { color: #ef4444 !important; }
    .panel-pass { border: 2px solid #22c55e !important; box-shadow: 0 0 25px rgba(34, 197, 94, 0.35); }
    .panel-fail { border: 2px solid #ef4444 !important; box-shadow: 0 0 25px rgba(239, 68, 68, 0.35); }

    /* 클릭 시작 안내 레이어 */
    #startOverlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 17, 32, 0.88);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      cursor: pointer;
    }
    #startOverlay button {
      background: #2563eb;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      padding: 14px 28px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="badge">송악고</div>
      <div class="main-title">석식 출입관리시스템</div>
      <div class="time-box" id="clock">00:00:00</div>
    </div>
    <div class="header-right">
      <div class="stat-card stat-total">📋 총신청 <span id="totalCount">-</span></div>
      <div class="stat-card stat-done">🍱 식사완료 <span id="doneCount">0</span></div>
      <div class="stat-card stat-rem">⏳ 미식사 <span id="remCount">-</span></div>
    </div>
  </header>

  <main>
    <!-- 카메라 스캐너 패널 -->
    <div class="scanner-panel" id="scannerCard">
      <div id="reader">
        <div id="startOverlay">
          <button onclick="initScanner()">📷 카메라 켜기</button>
          <div style="margin-top: 12px; color: #94a3b8; font-size: 14px;">화면을 터치하면 카메라가 시작됩니다</div>
        </div>
      </div>
      <div class="scanner-footer">
        ⚡ 대형 스캔 모드: 화면 어디든 스쳐도 바로 인식됩니다
      </div>
    </div>

    <!-- 검증 결과 패널 -->
    <div class="info-panel" id="infoPanel">
      <div class="photo-box" id="photoBox">
        <div class="photo-placeholder" id="photoText">사진 대기</div>
      </div>
      <div class="status-msg" id="statusMsg">대기 중</div>
      <div class="student-id" id="studentSub">명찰 QR을 비춰주세요</div>
      <div class="action-badge" id="actionMsg">스캔 준비 완료</div>
      <div class="recent-log" id="recentLog">최근 기록: 없음</div>
    </div>
  </main>

  <script>
    // 1. Google Apps Script Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLF1Qw6ZtwWp3MsKakjIsOxUXRSmjqbxOvUBQ7QzAUw7IPacjHAJuL2FjpCMzj8b7t/exec";

    let html5QrCode = null;
    let isProcessing = false;
    let completedStudents = new Set();

    // 2. 브라우저 내장 Web Audio API 효과음 생성기 (외부 파일 다운로드 불필요)
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // 통과 알림음: 경쾌한 '삑!' (고음 988Hz)
    function playSuccessSound() {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(987.77, ctx.currentTime);

        gain.gain.setValueAtTime(0.35, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.16);
      } catch (e) {
        console.warn("오디오 재생 실패:", e);
      }
    }

    // 경고 알림음: 낮은 톤의 '삐-삐-' 경고 (300Hz 2회 반복)
    function playFailSound() {
      try {
        const ctx = getAudioContext();
        [0, 0.18].forEach(delay => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = "square";
          osc.frequency.setValueAtTime(320, ctx.currentTime + delay);

          gain.gain.setValueAtTime(0.25, ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.12);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(ctx.currentTime + delay);
          osc.stop(ctx.currentTime + delay + 0.12);
        });
      } catch (e) {
        console.warn("오디오 재생 실패:", e);
      }
    }

    // 3. 상단 시계 갱신
    function updateClock() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const timeStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      document.getElementById("clock").innerText = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 4. 카메라 스캐너 초기화 (PC/태블릿/모바일 자동 대응)
    async function initScanner() {
      document.getElementById("startOverlay").style.display = "none";
      getAudioContext(); // 사용자 클릭 시점에 오디오 엔진 활성화
      
      try {
        if (html5QrCode) {
          try { await html5QrCode.stop(); } catch(e) {}
        }

        html5QrCode = new Html5Qrcode("reader");

        const config = {
          fps: 25,
          qrbox: (w, h) => {
            const size = Math.min(w, h);
            return { width: Math.floor(size * 0.85), height: Math.floor(size * 0.85) };
          },
          aspectRatio: 1.0,
          videoConstraints: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        };

        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          onScanSuccess,
          onScanError
        );
      } catch (err) {
        console.warn("기본 카메라 실패, 연결 가능한 첫 번째 카메라 시도:", err);
        try {
          const devices = await Html5Qrcode.getCameras();
          if (devices && devices.length > 0) {
            let camId = devices[0].id;
            const backCam = devices.find(d => d.label.toLowerCase().includes("back") || d.label.toLowerCase().includes("environment"));
            if (backCam) camId = backCam.id;

            await html5QrCode.start(camId, { fps: 20 }, onScanSuccess, onScanError);
          } else {
            throw new Error("카메라 장치를 찾을 수 없음");
          }
        } catch (fallbackErr) {
          document.getElementById("startOverlay").style.display = "flex";
        }
      }
    }

    // 5. QR 감지 시 백엔드 검증 처리
    async function onScanSuccess(decodedText) {
      const studentId = String(decodedText).trim();
      if (!studentId || isProcessing) return;

      isProcessing = true;
      showProcessingUI(studentId);

      try {
        const response = await fetch(`${SCRIPT_URL}?id=${encodeURIComponent(studentId)}`);
        const result = await response.json();

        if (result.success) {
          playSuccessSound(); // 식사 승인 삑 소리
          showApprovedUI(result.student);
          completedStudents.add(studentId);
          updateCounts();
        } else {
          playFailSound(); // 식사 거절 삐-삐- 경고음
          showRejectedUI(result.message, result.student);
        }
      } catch (err) {
        playFailSound();
        showErrorUI("시트 통신 에러가 발생했습니다.");
      }

      // 1.5초 표시 후 다음 스캔 대기 상태로 초기화
      setTimeout(() => {
        resetUI();
        isProcessing = false;
      }, 1500);
    }

    function onScanError(errorMessage) {
      // 프레임 탐색 중 발생하는 경미한 오류 무시
    }

    // UI 반응 함수
    function showProcessingUI(id) {
      document.getElementById("statusMsg").innerText = "확인 중...";
      document.getElementById("statusMsg").className = "status-msg";
      document.getElementById("studentSub").innerText = "학번: " + id;
      document.getElementById("actionMsg").innerText = "데이터 조회 중";
    }

    function showApprovedUI(student) {
      const infoPanel = document.getElementById("infoPanel");
      infoPanel.className = "info-panel panel-pass";

      document.getElementById("statusMsg").innerText = "식사 승인 ✅";
      document.getElementById("statusMsg").className = "status-msg status-pass";
      document.getElementById("studentSub").innerText = `${student.id} ${student.name}`;
      document.getElementById("actionMsg").innerText = "맛있게 드세요!";
      document.getElementById("actionMsg").style.background = "#059669";
      document.getElementById("recentLog").innerText = `최근 통과: ${student.id} ${student.name}`;

      if (student.photoUrl) {
        document.getElementById("photoBox").innerHTML = `<img src="${student.photoUrl}" alt="사진">`;
      } else {
        document.getElementById("photoBox").innerHTML = `<div class="photo-placeholder" style="color:#10b981;">승인 완료</div>`;
      }
    }

    function showRejectedUI(msg, student) {
      const infoPanel = document.getElementById("infoPanel");
      infoPanel.className = "info-panel panel-fail";

      document.getElementById("statusMsg").innerText = "출입 차단 ❌";
      document.getElementById("statusMsg").className = "status-msg status-fail";
      document.getElementById("studentSub").innerText = student ? `${student.id} ${student.name}` : "미신청 학생";
      document.getElementById("actionMsg").innerText = msg || "석식 미신청자입니다";
      document.getElementById("actionMsg").style.background = "#dc2626";

      document.getElementById("photoBox").innerHTML = `<div class="photo-placeholder" style="color:#ef4444;">승인 거부</div>`;
    }

    function showErrorUI(msg) {
      document.getElementById("statusMsg").innerText = "오류 발생 ⚠️";
      document.getElementById("statusMsg").className = "status-msg status-fail";
      document.getElementById("actionMsg").innerText = msg;
    }

    function resetUI() {
      const infoPanel = document.getElementById("infoPanel");
      infoPanel.className = "info-panel";
      document.getElementById("statusMsg").innerText = "대기 중";
      document.getElementById("statusMsg").className = "status-msg";
      document.getElementById("studentSub").innerText = "명찰 QR을 비춰주세요";
      document.getElementById("actionMsg").innerText = "명찰 QR을 스캔하세요";
      document.getElementById("actionMsg").style.background = "#334155";
      document.getElementById("photoBox").innerHTML = `<div class="photo-placeholder">사진 대기</div>`;
    }

    function updateCounts() {
      document.getElementById("doneCount").innerText = completedStudents.size;
    }

    // 6. 실행 리스너 (브라우저 자동실행 정책 충족)
    window.addEventListener("DOMContentLoaded", () => {
      initScanner();
    });

    document.body.addEventListener("click", () => {
      getAudioContext();
      const video = document.querySelector("#reader video");
      if (!video || video.paused) {
        initScanner();
      }
    }, { once: true });
  </script>
</body>
</html>
