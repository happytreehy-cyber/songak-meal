<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>송악고 석식 시스템 (학생용)</title>
  <style>
    body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background-color: #111827; color: white; font-family: 'Apple SD Gothic Neo', sans-serif; overflow: hidden; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: #1f2937; border-bottom: 2px solid #374151; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 10; }
    .header-left { display: flex; align-items: baseline; gap: 15px; }
    .title { font-size: 24pt; font-weight: 900; color: #60a5fa; letter-spacing: 1px; }
    .clock { font-size: 14pt; color: #9ca3af; font-weight: bold; }
    
    .header-right { display: flex; gap: 15px; align-items: center; }
    .stat-badge { padding: 10px 18px; border-radius: 10px; font-size: 15pt; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .stat-total { background: #3b82f6; cursor: pointer; } 
    .stat-done { background: #10b981; } 
    .stat-left { background: #ef4444; }

    /* 예쁜 그라데이션 카메라 버튼 */
    .cam-btn { padding: 10px 20px; background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); color: white; border: none; border-radius: 10px; font-size: 14pt; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); margin-right: 15px; }
    .cam-btn:active { transform: scale(0.95); box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4); }
    
    .main-content { display: flex; flex: 1; height: 100%; position: relative; }
    
    /* 카메라 화면 */
    .camera-section { flex: 2; display: flex; flex-direction: column; padding: 25px; box-sizing: border-box; }
    .camera-wrapper { position: relative; width: 100%; flex: 1; border-radius: 16px; overflow: hidden; border: 4px solid #60a5fa; box-shadow: 0 0 30px rgba(96, 165, 250, 0.3); background: #000; }
    #reader { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; position: absolute !important; top: 0 !important; left: 0 !important; }
    
    /* 초록색 타겟 박스 */
    .custom-target { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; height: 280px; border: 6px solid #4ade80; border-radius: 20px; box-shadow: 0 0 0 4000px rgba(0,0,0,0.6); pointer-events: none; z-index: 10; }
    
    /* ★ 해결 1 & 2: 안내 멘트를 초록 박스 바로 아래로 이동 & 노란 화살표 아이콘 적용! */
    .cam-overlay-text { position: absolute; top: calc(50% + 160px); left: 50%; transform: translateX(-50%); text-align: center; font-size: 22pt; font-weight: 900; color: white; background: rgba(31, 41, 55, 0.85); padding: 15px 30px; border-radius: 50px; z-index: 20; border: 2px solid #374151; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 15px; width: max-content; }
    .arrow-icon { background: #facc15; color: #111827; padding: 5px 12px; border-radius: 12px; font-size: 24pt; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(250, 204, 21, 0.4); }

    .info-section { flex: 1; background-color: #1a1e29; border-left: 2px solid #2d3748; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
    
    /* 대기중 원형 박스 디자인 개선 */
    .status-circle { width: 240px; height: 240px; border: 8px solid #374151; border-radius: 40px; display: flex; align-items: center; justify-content: center; margin-bottom: 25px; background: linear-gradient(145deg, #1f2937, #111827); box-shadow: 0 15px 35px rgba(0,0,0,0.4); transition: 0.3s; }
    
    .box-title { font-size: 24pt; font-weight: 900; margin-bottom: 10px; }
    .box-content { font-size: 18pt; margin-bottom: 5px; font-weight: bold; line-height: 1.4; }
    
    .warning-text { margin-top: 20px; font-size: 13pt; color: #fca5a5; font-weight: bold; background: rgba(239, 68, 68, 0.15); padding: 15px; border-radius: 12px; line-height: 1.5; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* ★ 해결 3 & 4: 예쁜 그라데이션 버튼 & 두 줄 강제 분리! */
    .manual-btn { margin-top: 40px; width: 90%; max-width: 320px; background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border: none; padding: 18px 20px; border-radius: 16px; font-size: 18pt; font-weight: 900; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); line-height: 1.4; }
    .manual-btn:hover { background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%); transform: translateY(-3px); box-shadow: 0 15px 30px rgba(37, 99, 235, 0.5); }
    .manual-btn:active { transform: translateY(2px); box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4); }

    #manual-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 300; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
    .modal-content { background: #1f2937; padding: 50px; border-radius: 20px; border: 3px solid #60a5fa; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
    .modal-content input { width: 280px; padding: 18px; font-size: 28pt; text-align: center; border-radius: 12px; border: 2px solid #9ca3af; margin: 25px 0; font-weight: bold; background: #374151; color: white; }
    .modal-btns button { padding: 15px 35px; font-size: 18pt; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; margin: 0 10px; transition: 0.2s; }
    .btn-submit { background: #3b82f6; color: white; }
    .btn-cancel { background: #ef4444; color: white; }
    .modal-btns button:active { transform: scale(0.95); }

    #loading-overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(17, 24, 39, 0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; }
    .progress-container { width: 80%; max-width: 400px; height: 8px; background: #374151; border-radius: 4px; position: relative; margin-top: 40px; }
    .progress-bar { height: 100%; background: #60a5fa; width: 0%; border-radius: 4px; transition: width 0.5s ease; box-shadow: 0 0 15px rgba(96, 165, 250, 0.6); }
    .rocket-icon { font-size: 35pt; position: absolute; top: -45px; left: 0%; transform: translateX(-50%); transition: left 0.5s ease; }

    #stats-modal { display: none; position: fixed; top: 85px; right: 25px; background: #1f2937; padding: 25px; border-radius: 16px; z-index: 200; box-shadow: 0 15px 40px rgba(0,0,0,0.8); width: 420px; border: 2px solid #4b5563; }
    .modal-backdrop { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: transparent; z-index: 150; }
    .grade-stat-row { display: flex; justify-content: space-between; font-size: 14pt; padding: 12px 0; border-bottom: 1px solid #374151; font-weight: bold; }
    .close-btn { width: 100%; padding: 12px; margin-top: 20px; background: #4b5563; color: white; border: none; border-radius: 10px; font-size: 14pt; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .close-btn:hover { background: #6b7280; }
  </style>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
  
  <div id="manual-modal">
    <div class="modal-content">
      <h2 style="color: #60a5fa; margin-top: 0; font-size: 28pt; font-weight: 900;">✍️ 수동 승인</h2>
      <div style="color: #cbd5e1; font-size: 16pt;">본인의 학번 4자리를 입력하세요.</div>
      <input type="number" id="manual-input-val" placeholder="예: 1101" onkeypress="if(event.keyCode==13) submitManual();">
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeManual()">취소</button>
        <button class="btn-submit" onclick="submitManual()">입장하기</button>
      </div>
    </div>
  </div>

  <div id="loading-overlay">
    <div style="font-size: 80pt; margin-bottom: 15px;">👩‍🍳</div>
    <h2 id="loading-msg" style="color: #60a5fa; font-size: 30pt; margin-bottom: 15px; line-height: 1.4; font-weight: 900;">오늘도 송악고 급식실은<br>맛있게 조리 중입니다</h2>
    <div class="progress-container">
      <div class="rocket-icon" id="rocket-icon">🚀</div>
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-bg" onclick="closeStats()"></div>
  <div id="stats-modal">
    <h3 style="margin-top:0; color:#60a5fa; text-align:center; font-size:18pt; font-weight: 900; margin-bottom: 20px;">📊 학년별 식사 현황</h3>
    <div id="stats-detail-content">로딩 중...</div>
    <button class="close-btn" onclick="closeStats()">닫기</button>
  </div>

  <div class="header">
    <div class="header-left">
      <div class="title">🍴 송악고 석식 시스템 (학생용)</div>
      <div class="clock" id="live-clock">0000. 00. 00. 00:00:00</div>
    </div>
    <div style="display:flex;">
      <button class="cam-btn" onclick="switchCamera()">🔄 카메라 전환</button>
      <div class="header-right">
        <div class="stat-badge stat-total" onclick="openStats()">총신청: <span id="val-total">0</span></div>
        <div class="stat-badge stat-done">완료: <span id="val-done">0</span></div>
        <div class="stat-badge stat-left">미식사: <span id="val-left">0</span></div>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div class="camera-section">
      <div class="camera-wrapper">
        <div id="reader"></div>
        <div class="custom-target"></div>
        <!-- ★ 해결 1: 초록박스 바로 밑으로 멘트 이동 & 캡슐형 둥근 디자인 -->
        <div class="cam-overlay-text">
          <div class="arrow-icon">⬆️</div>
          위 네모칸에 <span style="color:#60a5fa; margin: 0 5px;">QR코드</span>를 비춰주세요
        </div>
      </div>
    </div>
    <div class="info-section">
      <!-- ★ 해결 2: "대기중"을 큼직하게 "QR 대기"로 변경하고 잡다한 멘트 삭제 -->
      <div class="status-circle" id="photo-box">
        <div style="font-size: 45pt; font-weight: 900; color: #fbbf24; text-align: center;">QR 대기</div>
      </div>
      <div class="box-title" id="status-title" style="display: none;"></div>
      <div class="box-content" id="status-message" style="color: #9ca3af; font-size: 20pt; margin-top: 10px;"></div>
      
      <div class="warning-text">
        * 교사용 모니터에 본인의 실제 사진이<br>표시되며, 대리 식사는 즉시 적발됩니다.
      </div>
      
      <!-- ★ 해결 3 & 4: 예쁜 파란색 그라데이션 적용 & 강제 2줄 바꿈 -->
      <button class="manual-btn" onclick="openManual()">
        👉 QR이 없나요?<br>
        <span style="font-size: 14pt; color: #bfdbfe; font-weight: normal;">(수동입력 하기)</span>
      </button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKZBLj0pzD0dNU_fAvhF6j6x3Xzl7PL5-yYJabG8oZ45qBKonZa2r-9YsJ7-eJkElY/exec";
    
    let html5QrCode;
    let currentCamMode = "user"; 
    let studentCache = {}, isScanning = true, currentStatsDetails = null;
    
    setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleString('ko-KR'); }, 1000);

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (type === 'success') { 
        const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1); osc.connect(gainNode); gainNode.connect(audioCtx.destination); gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5);
      } else if (type === 'duplicate') { 
        const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(440, audioCtx.currentTime); osc.connect(gainNode); gainNode.connect(audioCtx.destination); gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime); gainNode.gain.setValueAtTime(0, audioCtx.currentTime + 0.1); gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + 0.15); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'error') { 
        const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.connect(gainNode); gainNode.connect(audioCtx.destination); gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.15); const osc2 = audioCtx.createOscillator(), gainNode2 = audioCtx.createGain(); osc2.type = 'sawtooth'; osc2.frequency.setValueAtTime(300, audioCtx.currentTime + 0.2); osc2.connect(gainNode2); gainNode2.connect(audioCtx.destination); gainNode2.gain.setValueAtTime(0.3, audioCtx.currentTime + 0.2); gainNode2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35); osc2.start(audioCtx.currentTime + 0.2); osc2.stop(audioCtx.currentTime + 0.35);
      }
    }

    function maskName(name) {
      if(!name) return "";
      if(name.length === 2) return name[0] + "O";
      if(name.length >= 3) return name[0] + "O" + name.substring(2);
      return name;
    }

    function refreshStats() {
      fetch(SCRIPT_URL + "?action=GET_DETAILS")
        .then(r => r.json())
        .then(res => {
          if(res.totalStats) {
            currentStatsDetails = res;
            updateStatsUI();
          } else { fallbackToLocalStats(); }
        }).catch(e => { fallbackToLocalStats(); });
    }

    function fallbackToLocalStats() {
      if(Object.keys(studentCache).length === 0) return;
      let stats = { 1: {total:0, done:0, left:0}, 2: {total:0, done:0, left:0}, 3: {total:0, done:0, left:0}, totalStats: {total:0, done:0, left:0} };
      for (let id in studentCache) {
        let s = studentCache[id]; let g = parseInt(id.charAt(0));
        stats.totalStats.total++; if(stats[g]) stats[g].total++;
        if (s.marked === 1) { stats.totalStats.done++; if(stats[g]) stats[g].done++; } 
        else { stats.totalStats.left++; if(stats[g]) stats[g].left++; }
      }
      currentStatsDetails = stats; updateStatsUI();
    }

    function updateStatsUI() {
      if(!currentStatsDetails) return;
      document.getElementById('val-total').innerText = currentStatsDetails.totalStats.total;
      document.getElementById('val-done').innerText = currentStatsDetails.totalStats.done;
      document.getElementById('val-left').innerText = currentStatsDetails.totalStats.left;
    }

    function openStats() {
      if(!currentStatsDetails) { alert("아직 통계를 불러오지 못했습니다."); return; }
      let html = "";
      [1, 2, 3].forEach(grade => {
        let st = currentStatsDetails[grade];
        if(st) { 
          html += `<div class="grade-stat-row"><span style="color:#60a5fa;">${grade}학년</span> <span>총 신청: ${st.total}명</span> <span style="color:#10b981;">식사완료: ${st.done}명</span> <span style="color:#ef4444;">미식사: ${st.left}명</span></div>`; 
        }
      });
      document.getElementById('stats-detail-content').innerHTML = html;
      document.getElementById('stats-modal').style.display = 'block'; document.getElementById('modal-bg').style.display = 'block';
    }
    function closeStats() { document.getElementById('stats-modal').style.display = 'none'; document.getElementById('modal-bg').style.display = 'none'; }

    function openManual() {
      document.getElementById('manual-modal').style.display = 'flex';
      document.getElementById('manual-input-val').focus();
      isScanning = false;
    }
    function closeManual() {
      document.getElementById('manual-modal').style.display = 'none';
      document.getElementById('manual-input-val').value = "";
      setTimeout(() => { isScanning = true; }, 1000);
    }
    function submitManual() {
      let val = document.getElementById('manual-input-val').value.trim();
      if(val.length < 4) { alert("학번을 정확히 입력하세요."); return; }
      closeManual();
      processStudentScan(val, true); 
    }

    window.onload = function() {
      refreshStats();
      let progress = 0;
      let progressTimer = setInterval(() => {
        progress += 5; 
        if(progress > 90) progress = 90; 
        document.getElementById('rocket-icon').style.left = progress + '%';
        document.getElementById('progress-bar').style.width = progress + '%';
      }, 500);

      fetch(SCRIPT_URL + "?action=GET_ALL_STUDENTS")
        .then(r => r.text())
        .then(text => {
          try {
            let res = JSON.parse(text);
            if(res.status === "SUCCESS") {
              studentCache = res.data;
              clearInterval(progressTimer);
              document.getElementById('rocket-icon').style.left = '100%';
              document.getElementById('progress-bar').style.width = '100%';
              
              setTimeout(() => {
                document.getElementById('loading-overlay').style.display = 'none';
                fallbackToLocalStats(); 
                initCamera(); 
                setInterval(refreshStats, 10000); 
              }, 600);
            }
          } catch(e) {}
        }).catch(err => {});
    };

    function initCamera() {
      html5QrCode = new Html5Qrcode("reader");
      startCurrentCamera();
    }

    function startCurrentCamera() {
      html5QrCode.start(
        { facingMode: currentCamMode },
        { fps: 30, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          if(!isScanning) return; 
          isScanning = false;
          let studentId = decodedText.trim().replace(/[^0-9]/g, '');
          processStudentScan(studentId, false);
        },
        (ignoreError) => {}
      ).catch(err => {
        console.log("카메라 실행 에러:", err);
        if (currentCamMode === "user") {
          currentCamMode = "environment";
          startCurrentCamera();
        }
      });
    }

    function switchCamera() {
      html5QrCode.stop().then(() => {
        currentCamMode = (currentCamMode === "user") ? "environment" : "user";
        startCurrentCamera();
      }).catch(e => {
        currentCamMode = (currentCamMode === "user") ? "environment" : "user";
        startCurrentCamera();
      });
    }

    function processStudentScan(studentId, isManual) {
      let student = studentCache[studentId];
      let nowTime = new Date().toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' });
      
      let actionStr = isManual ? "MARK_MANUAL" : "MARK_ATTENDANCE";
      let delayMs = 1500; 

      if (!student) {
        playBeep('error'); 
        updateUI("#ef4444", `<span style="font-size: 80pt; color: #ef4444;">🔴</span>`, "경고", "당일 석식 미신청자입니다");
        delayMs = 3000; 
        fetch(SCRIPT_URL + "?action=" + actionStr + "&id=" + studentId); 
      } else if (student.marked === 1) {
        playBeep('duplicate'); 
        updateUI("orange", `<span style="font-size: 80pt; color: orange;">🟠</span>`, "⚠ 중복 식사 !", `이미 식사한 학생입니다<br><span style="font-size:14pt;color:#9ca3af;">(시간: ${nowTime})</span>`);
        delayMs = 3000;
        fetch(SCRIPT_URL + "?action=MARK_ATTENDANCE&id=" + studentId);
      } else {
        playBeep('success'); 
        let safeName = maskName(student.name); 
        
        if(isManual) {
          updateUI("#10b981", `<span style="font-size: 80pt; color: #10b981;">✍️</span>`, "수동 승인", `<span style="color:white; font-size:26pt; font-weight:900;">${safeName}</span><br><br><span style="color:#fca5a5; font-size:16pt;">😈 다음부터는 QR 인식을 이용해<br>빠른 입장 부탁합니다.</span>`);
          delayMs = 3000;
        } else {
          updateUI("#4CAF50", `<span style="font-size: 80pt; color: #4CAF50;">🟢</span>`, "✓ 정상 승인", `<span style="color:#10b981;">(맛있게 드세요!)</span><br><span style="color:white; font-size:26pt; font-weight:900;">${safeName}</span>`);
        }
        
        student.marked = 1;
        if(currentStatsDetails) {
          currentStatsDetails.totalStats.done++; currentStatsDetails.totalStats.left--;
          let g = studentId.charAt(0);
          if(currentStatsDetails[g]) { currentStatsDetails[g].done++; currentStatsDetails[g].left--; }
          updateStatsUI(); 
        }
        
        fetch(SCRIPT_URL + "?action=" + actionStr + "&id=" + studentId);
      }

      setTimeout(() => {
        // ★ 처리 후 "QR 대기"로 돌아감!
        updateUI(
          "#374151", 
          `<div style="font-size: 45pt; font-weight: 900; color: #fbbf24; text-align: center;">QR 대기</div>`, 
          "", 
          ""
        );
        isScanning = true;
      }, delayMs); 
    }

    function updateUI(color, iconHtml, title, message) {
      const box = document.getElementById('photo-box'); box.style.borderColor = color; box.innerHTML = iconHtml;
      
      const titleEl = document.getElementById('status-title');
      if(title) {
        titleEl.style.display = "block"; titleEl.innerText = title; titleEl.style.color = color;
      } else { titleEl.style.display = "none"; }
      
      const msgEl = document.getElementById('status-message');
      msgEl.innerHTML = `<span style="color:${color === '#374151' ? '#9ca3af' : 'white'}; font-weight:bold;">${message}</span>`;
    }
  </script>
</body>
</html>
