<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>💻 송악고 석식 모니터링 (교사용)</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f1f5f9; font-family: 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .header { background-color: #1e293b; color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 10; }
    .header-left { display: flex; align-items: center; gap: 15px; flex-wrap: nowrap; }
    .title { font-size: 20pt; font-weight: bold; color: #60a5fa; white-space: nowrap; }
    .clock { font-size: 14pt; font-weight: bold; color: #94a3b8; white-space: nowrap; margin-top: 4px; }
    .header-right { display: flex; gap: 10px; }
    .top-btn { padding: 8px 15px; font-size: 13pt; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: white; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    .btn-refresh { background: #3b82f6; } .btn-refresh:active { transform: scale(0.95); }
    .btn-sound { background: #8b5cf6; } .btn-sound:active { transform: scale(0.95); }
    
    .main-container { display: flex; flex: 1; padding: 15px; gap: 15px; height: calc(100vh - 80px); box-sizing: border-box; }
    
    .left-panel { flex: 2; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
    .photo-grid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; background: white; padding: 25px 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-y: auto; align-content: start; }
    
    .student-card { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; overflow: visible; display: flex; flex-direction: column; align-items: center; padding-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; animation: slideDown 0.3s ease-out; position: relative; margin-top: 15px; }
    .student-card.allergy { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
    .student-card.unauth { border-color: #ef4444; background: #fef2f2; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
    
    .newest-badge { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); color: white; padding: 4px 18px; border-radius: 20px; font-weight: 900; font-size: 12pt; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 20; white-space: nowrap; display: none; }
    @keyframes bounce { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -5px); } }
    
    .btn-close-card { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 11pt; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 100; transition: 0.2s; }
    .btn-close-card:hover { background: #ef4444; }
    
    .student-photo { width: 100%; height: 170px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 40pt; color: #94a3b8; object-fit: contain; box-sizing: border-box; border-bottom: 1px solid #cbd5e1; border-top-left-radius: 10px; border-top-right-radius: 10px; }
    .student-info { margin-top: 8px; text-align: center; width: 100%; padding: 0 5px; box-sizing: border-box; }
    .student-id { font-size: 14pt; font-weight: bold; color: #64748b; }
    .student-name { font-size: 22pt; font-weight: 900; color: #1e293b; margin: 3px 0; }
    .student-note { background: #fee2e2; color: #dc2626; padding: 2px 8px; border-radius: 15px; font-weight: bold; font-size: 11pt; display: inline-block; margin-top: 2px; }
    
    .manual-badge { position: absolute; top: 5px; right: 5px; background: #10b981; color: white; font-weight: bold; padding: 4px 8px; border-radius: 8px; font-size: 11pt; box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 10; }
    .unauth-badge { position: absolute; top: 5px; right: 5px; background: #ef4444; color: white; font-weight: bold; padding: 4px 8px; border-radius: 8px; font-size: 11pt; box-shadow: 0 2px 6px rgba(239,68,68,0.5); z-index: 10; animation: blinker 1s linear infinite; }

    .right-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; position: relative; overflow: hidden; }
    .stats-box { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .stats-badges-container { display: flex; gap: 10px; justify-content: space-between; }
    
    .stat-badge { flex: 1; padding: 15px 5px; border-radius: 10px; text-align: center; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .stat-badge:hover { transform: scale(1.02); }
    .stat-total { background: #3b82f6; } 
    .stat-done { background: #10b981; } 
    .stat-left { background: #ef4444; }
    
    .stat-title { font-size: 13pt; font-weight: bold; margin-bottom: 5px; }
    .stat-num { font-size: 28pt; font-weight: 900; }
    
    /* ★ 2줄로 깨지지 않도록 표 형식으로 분리한 완벽 디자인! */
    .stat-sub-box { display: flex; width: 90%; margin-top: 10px; background: rgba(0,0,0,0.25); border-radius: 8px; padding: 6px 0; }
    .sub-col { flex: 1; display: flex; flex-direction: column; align-items: center; border-right: 1px solid rgba(255,255,255,0.2); line-height: 1.3; }
    .sub-col:last-child { border-right: none; }
    .sub-col span { font-size: 9pt; color: rgba(255,255,255,0.8); font-weight: bold; }
    .sub-col strong { font-size: 12pt; color: white; font-weight: 900; }

    .log-box { flex: 1; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; }
    .log-title { background: #1e293b; color: white; padding: 12px 20px; font-size: 14pt; font-weight: bold; }
    .log-content { flex: 1; overflow-y: auto; padding: 10px; font-size: 13pt; line-height: 1.8; }
    .log-row { padding: 6px 10px; border-bottom: 1px solid #f1f5f9; display: flex; gap: 10px; }
    .log-time { color: #94a3b8; font-family: monospace; }
    .log-error-red { color: white; font-weight: bold; background: #ef4444; padding: 3px 10px; border-radius: 6px; }
    .log-error-orange { color: white; font-weight: bold; background: #f97316; padding: 3px 10px; border-radius: 6px; }
    .log-manual-green { color: white; font-weight: bold; background: #10b981; padding: 3px 10px; border-radius: 6px; }
    
    #alert-modal { display: none; position: absolute; bottom: 20px; right: 20px; z-index: 999; }
    .alert-content { background: #ef4444; padding: 30px; border-radius: 15px; border: 4px solid #b91c1c; text-align: center; box-shadow: 0 10px 30px rgba(239,68,68,0.7); width: 320px; }
    .alert-content.animating { animation: popAlert 0.3s infinite alternate; }
    .alert-icon { font-size: 40pt; margin-bottom: 5px; }
    .alert-msg { font-size: 16pt; font-weight: 900; color: white; margin-bottom: 15px; line-height: 1.5; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
    .btn-confirm { background: white; color: #ef4444; border: none; padding: 12px 20px; font-size: 14pt; font-weight: 900; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: 100%; }
    
    #list-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
    .list-modal-content { background: white; width: 85%; max-width: 1000px; height: 85%; border-radius: 15px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .list-modal-title { background: #1e293b; color: white; padding: 15px; font-size: 18pt; font-weight: bold; text-align: center; }
    .list-cols { display: flex; flex: 1; overflow: hidden; }
    .list-col { flex: 1; border-right: 1px solid #cbd5e1; display: flex; flex-direction: column; }
    .list-col:last-child { border-right: none; }
    .list-grade-title { background: #334155; color: white; text-align: center; padding: 8px; font-size: 15pt; font-weight: bold; }
    .list-items { flex: 1; overflow-y: auto; padding: 10px; font-size: 14pt; }
    .list-item-row { padding: 8px; border-bottom: 1px dashed #cbd5e1; display: flex; gap: 10px; font-weight: bold; color: #334155; }
    .list-close-btn { padding: 15px; font-size: 16pt; font-weight: bold; background: #ef4444; color: white; border: none; cursor: pointer; transition: 0.2s; }
    .list-close-btn:hover { background: #dc2626; }
  </style>
</head>
<body>
  
  <div id="teacher-closed-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; flex-direction:column; justify-content:center; align-items:center; color:white;">
    <div style="font-size:80pt; margin-bottom:20px;">🛑</div>
    <h1 style="color:#ef4444; font-size:30pt; font-weight:900;">교사용 모니터가 차단되었습니다</h1>
    <p style="color:#9ca3af; font-size:16pt;">구글 시트 메뉴 [🔒 웹 화면 차단/열기 제어] 에서 열어주세요.</p>
  </div>

  <div id="list-modal">
    <div class="list-modal-content">
      <div class="list-modal-title" id="list-modal-title">상세 명단</div>
      <div class="list-cols">
        <div class="list-col">
          <div class="list-grade-title">1학년</div>
          <div class="list-items" id="list-1">로딩 중...</div>
        </div>
        <div class="list-col">
          <div class="list-grade-title">2학년</div>
          <div class="list-items" id="list-2">로딩 중...</div>
        </div>
        <div class="list-col">
          <div class="list-grade-title">3학년</div>
          <div class="list-items" id="list-3">로딩 중...</div>
        </div>
      </div>
      <button class="list-close-btn" onclick="document.getElementById('list-modal').style.display='none'">닫기</button>
    </div>
  </div>

  <div class="header">
    <div class="header-left">
      <div class="title">💻 송악고 석식 모니터링 (교사용)</div>
      <div class="clock" id="live-clock">2026. 00. 00. 00:00:00</div>
    </div>
    <div class="header-right">
      <button class="top-btn btn-sound" id="sound-btn" onclick="toggleSound()">🔊 소리 켜짐</button>
      <button class="top-btn btn-refresh" onclick="window.location.href = window.location.href.split('?')[0] + '?t=' + new Date().getTime();">🔄 화면 새로고침</button>
    </div>
  </div>

  <div class="main-container">
    <div class="left-panel">
      <div class="photo-grid" id="photo-grid"></div>
    </div>

    <div class="right-panel">
      <div class="stats-box">
        <div class="stats-badges-container">
          <!-- ★ 버튼 디자인 완벽 개편! 2줄로 깨지는 현상 종결 -->
          <div class="stat-badge stat-total" onclick="openDetailModal('TOTAL')">
            <div class="stat-title">총 신청 (클릭👆)</div>
            <span class="stat-num" id="stat-total">0</span>
            <div class="stat-sub-box">
              <div class="sub-col"><span>1학년</span><strong id="t-1">0명</strong></div>
              <div class="sub-col"><span>2학년</span><strong id="t-2">0명</strong></div>
              <div class="sub-col"><span>3학년</span><strong id="t-3">0명</strong></div>
            </div>
          </div>
          <div class="stat-badge stat-done" onclick="openDetailModal('DONE')">
            <div class="stat-title">식사 완료 (클릭👆)</div>
            <span class="stat-num" id="stat-done">0</span>
            <div class="stat-sub-box">
              <div class="sub-col"><span>1학년</span><strong id="d-1">0명</strong></div>
              <div class="sub-col"><span>2학년</span><strong id="d-2">0명</strong></div>
              <div class="sub-col"><span>3학년</span><strong id="d-3">0명</strong></div>
            </div>
          </div>
          <div class="stat-badge stat-left" onclick="openDetailModal('UNFED')">
            <div class="stat-title">미식사 (클릭👆)</div>
            <span class="stat-num" id="stat-left">0</span>
            <div class="stat-sub-box">
              <div class="sub-col"><span>1학년</span><strong id="l-1">0명</strong></div>
              <div class="sub-col"><span>2학년</span><strong id="l-2">0명</strong></div>
              <div class="sub-col"><span>3학년</span><strong id="l-3">0명</strong></div>
            </div>
          </div>
        </div>
      </div>
      <div class="log-box">
        <div class="log-title">📹 실시간 블랙박스 기록 (최근 스캔 맨위로)</div>
        <div class="log-content" id="log-content">로딩 중...</div>
      </div>
      <div id="alert-modal">
        <div class="alert-content animating" id="alert-box">
          <div class="alert-icon">🚨</div><div class="alert-msg" id="alert-text">경고!</div>
          <button class="btn-confirm" onclick="closeAlert()">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKZBLj0pzD0dNU_fAvhF6j6x3Xzl7PL5-yYJabG8oZ45qBKonZa2r-9YsJ7-eJkElY/exec";
    let isSoundEnabled = true; let audioCtx = null;
    let localResetTime = "0"; 
    let lastUpdatePing = "0"; 

    let globalUnfed = [], globalDone = [];

    // ★ 시작 설정
    window.onload = function() { 
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
      refreshData("INITIAL"); 
      startPing(); 
    };
    
    window.onclick = function() { if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); };

    function toggleSound() {
      isSoundEnabled = !isSoundEnabled; let btn = document.getElementById('sound-btn');
      if (isSoundEnabled) { btn.innerText = "🔊 소리 켜짐"; btn.style.background = "#8b5cf6"; if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } 
      else { btn.innerText = "🔇 소리 꺼짐"; btn.style.background = "#64748b"; }
    }

    function playBeep(type) {
      if (!isSoundEnabled || !audioCtx) return; if (audioCtx.state === 'suspended') audioCtx.resume();
      if (type === 'success') { const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime); osc.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.1); osc.connect(gainNode); gainNode.connect(audioCtx.destination); gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); } 
      else if (type === 'duplicate') { const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(440, audioCtx.currentTime); osc.connect(gainNode); gainNode.connect(audioCtx.destination); gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime); gainNode.gain.setValueAtTime(0, audioCtx.currentTime + 0.1); gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime + 0.15); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); } 
      else if (type === 'error') { const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.connect(gainNode); gainNode.connect(audioCtx.destination); gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15); osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.15); const osc2 = audioCtx.createOscillator(), gainNode2 = audioCtx.createGain(); osc2.type = 'sawtooth'; osc2.frequency.setValueAtTime(300, audioCtx.currentTime + 0.2); osc2.connect(gainNode2); gainNode2.connect(audioCtx.destination); gainNode2.gain.setValueAtTime(0.3, audioCtx.currentTime + 0.2); gainNode2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35); osc2.start(audioCtx.currentTime + 0.2); osc2.stop(audioCtx.currentTime + 0.35); }
    }

    let lastProcessedLogTime = "";

    setInterval(() => { let now = new Date(); document.getElementById('live-clock').innerText = now.getFullYear() + ". " + String(now.getMonth()+1).padStart(2,'0') + ". " + String(now.getDate()).padStart(2,'0') + ". " + now.toLocaleTimeString('ko-KR'); }, 1000);

    let alertTimer = null;
    function triggerAlert(msg) {
      document.getElementById('alert-text').innerHTML = msg; document.getElementById('alert-modal').style.display = 'block'; document.getElementById('alert-box').classList.add('animating');
      if(alertTimer) clearTimeout(alertTimer); alertTimer = setTimeout(() => { closeAlert(); }, 3500);
    }
    function closeAlert() { document.getElementById('alert-box').classList.remove('animating'); setTimeout(() => { document.getElementById('alert-modal').style.display = 'none'; }, 200); }
    
    function removeCard(btn) { 
      btn.parentElement.remove(); 
      updateCardNumbers();
    }

    function renderList(targetId, arr, grade) {
       let filtered = arr.filter(a => a.id.startsWith(grade));
       let html = "";
       filtered.forEach(a => { 
           let noteHtml = a.note ? `<span style="color:#ef4444; font-size:11pt;">[${a.note}]</span>` : "";
           html += `<div class="list-item-row"><span>${a.id}</span> <span>${a.name}</span> ${noteHtml}</div>`; 
       });
       document.getElementById(targetId).innerHTML = html || "<div style='color:#94a3b8; text-align:center; margin-top:20px;'>해당 없음</div>";
    }

    function openDetailModal(type) {
       let title = "", arr = [];
       if (type === 'TOTAL') { title = "📋 총 신청 명단"; arr = globalDone.concat(globalUnfed); }
       else if (type === 'DONE') { title = "🟢 식사 완료 명단"; arr = globalDone; }
       else if (type === 'UNFED') { title = "🔴 미식사 명단"; arr = globalUnfed; }
       
       arr.sort((a,b) => parseInt(a.id) - parseInt(b.id)); 
       document.getElementById('list-modal-title').innerText = title;
       renderList('list-1', arr, '1');
       renderList('list-2', arr, '2');
       renderList('list-3', arr, '3');
       document.getElementById('list-modal').style.display = 'flex';
    }

    // ★ 0.8초 컷! 초정밀 레이더망 (속도 한계 돌파!)
    let isPinging = false;
    function startPing() {
      setInterval(() => {
        if(isPinging) return;
        isPinging = true;
        fetch(SCRIPT_URL + "?action=PING&t=" + new Date().getTime())
        .then(r => r.json())
        .then(res => {
          isPinging = false;
          if (localResetTime !== "0" && res.reset_time && res.reset_time !== localResetTime) {
             window.location.href = window.location.href.split('?')[0] + '?t=' + new Date().getTime(); return;
          }
          localResetTime = res.reset_time || "0";
          if(res.teacher_sys_status === "CLOSED") document.getElementById('teacher-closed-overlay').style.display = 'flex';
          else document.getElementById('teacher-closed-overlay').style.display = 'none';

          if (res.last_update !== lastUpdatePing) {
             refreshData(res.last_update); 
          }
        }).catch(e => { isPinging = false; });
      }, 800); // 0.8초마다 확인!! (체감속도 1초)
    }

    let isRefreshing = false;
    function refreshData(newUpdateVal) {
      if(isRefreshing) return;
      isRefreshing = true;
      let cacheBuster = "&t=" + new Date().getTime();
      fetch(SCRIPT_URL + "?action=GET_TEACHER_DATA" + cacheBuster)
        .then(r => r.json())
        .then(res => {
          isRefreshing = false;
          if (res.status === "SUCCESS") {
            if (newUpdateVal && newUpdateVal !== "INITIAL") lastUpdatePing = newUpdateVal;

            if (localResetTime !== "0" && res.reset_time && res.reset_time !== localResetTime) {
                window.location.reload(true); return;
            }
            localResetTime = res.reset_time || "0";

            globalUnfed = res.unfed || [];
            globalDone = res.done || [];

            document.getElementById('stat-total').innerText = res.stats.total; 
            document.getElementById('stat-done').innerText = res.stats.done; 
            document.getElementById('stat-left').innerText = res.stats.left;
            
            // ★ 학년별 요약 숫자 (표 형식으로 업데이트)
            document.getElementById('t-1').innerText = res.details[1].total + "명";
            document.getElementById('t-2').innerText = res.details[2].total + "명";
            document.getElementById('t-3').innerText = res.details[3].total + "명";

            document.getElementById('d-1').innerText = res.details[1].done + "명";
            document.getElementById('d-2').innerText = res.details[2].done + "명";
            document.getElementById('d-3').innerText = res.details[3].done + "명";

            document.getElementById('l-1').innerText = res.details[1].left + "명";
            document.getElementById('l-2').innerText = res.details[2].left + "명";
            document.getElementById('l-3').innerText = res.details[3].left + "명";

            processLogs(res.blackbox);
          }
        }).catch(err => { isRefreshing = false; });
    }

    function handleImgErr(img, id) {
      if (!img.dataset.f1) { 
        img.dataset.f1 = '1'; img.src = `https://happytreehy-cyber.github.io/songak-meal/${id}.jpg`; 
      } else if (!img.dataset.f2) { 
        img.dataset.f2 = '1'; img.src = `https://happytreehy-cyber.github.io/songak-meal/${id}.jpeg.jpeg`; 
      } else { 
        img.outerHTML = '<div class="student-photo">👤</div>'; 
      }
    }

    function updateCardNumbers() {
       let cards = document.querySelectorAll('.student-card');
       cards.forEach((card, index) => {
           let badge = card.querySelector('.newest-badge');
           if(badge) {
               badge.style.display = 'block';
               if(index === 0) {
                   badge.innerHTML = '🔥 1번 (최근)';
                   badge.style.background = '#ef4444'; 
                   badge.style.animation = 'bounce 1s infinite';
               } else {
                   badge.innerHTML = `${index + 1}번`;
                   badge.style.background = '#64748b'; 
                   badge.style.animation = 'none';
               }
           }
       });
    }

    let processedLogIds = new Set();

    function processLogs(logs) {
      if (!logs || logs.length === 0) {
        document.getElementById('log-content').innerHTML = `<div style='text-align:center; padding:20px; color:#94a3b8; font-weight:bold;'>기록이 없습니다.</div>`; return;
      }
      
      let logHtml = ""; 
      for (let i = 0; i < logs.length; i++) {
        let log = logs[i], timeStr = new Date(log.time).toLocaleTimeString('ko-KR'); 
        if (!log.id && !log.name) continue; 
        
        // ★ 무단접근 (시간) 괄호를 칼같이 잘라버리는 무적의 강제 삭제 코드!
        let cleanStatus = log.status.replace(/\s*\([^)]*\)/g, '').trim(); 
        
        let rowClass = "";
        if (cleanStatus.includes("무단")) rowClass = "log-error-red"; 
        else if (cleanStatus.includes("중복")) rowClass = "log-error-orange"; 
        else if (cleanStatus.includes("수동")) rowClass = "log-manual-green";
        
        logHtml += `<div class="log-row"><span class="log-time">[${timeStr}]</span> <span class="${rowClass}">${log.id} ${log.name} - ${cleanStatus}</span></div>`;
      }
      document.getElementById('log-content').innerHTML = logHtml;

      let currentLatestId = logs[0].time + "_" + logs[0].id;
      if (lastProcessedLogTime !== "" && currentLatestId === lastProcessedLogTime) return; 

      let newFaces = [];
      
      if (lastProcessedLogTime !== "") {
        let pendingLogs = [];
        for(let i=0; i<logs.length; i++) { if ((logs[i].time + "_" + logs[i].id) === lastProcessedLogTime) break; pendingLogs.unshift(logs[i]); }
        pendingLogs.forEach(log => {
          let uniqueId = log.time + "_" + log.id;
          if (!processedLogIds.has(uniqueId)) {
            processedLogIds.add(uniqueId);
            
            // 여기서도 괄호 시간 강제 삭제
            let cleanStatus = log.status.replace(/\s*\([^)]*\)/g, '').trim(); 
            
            let allergyClass = cleanStatus.includes("알레르기") ? "allergy" : "", unauthClass = cleanStatus.includes("무단") ? "unauth" : "", badgeHtml = "";
            
            if (cleanStatus.includes("무단")) { playBeep('error'); triggerAlert(`🚨 무단 접근!<br><span style="color:#fef08a;">${log.id} ${log.name}</span><br>미신청자입니다!`); badgeHtml = `<div class="unauth-badge">🚨 무단접근</div>`; } 
            else if (cleanStatus.includes("중복")) { playBeep('duplicate'); triggerAlert(`⚠️ 중복 식사!<br><span style="color:#fef08a;">${log.id} ${log.name}</span><br>이미 통과한 학생!`); } 
            else if (cleanStatus.includes("수동")) { playBeep('success'); badgeHtml = `<div class="manual-badge">✅ 수동입력</div>`; } 
            else { playBeep('success'); }

            if(!cleanStatus.includes("중복")) {
              let photoHtml = `<img src="https://happytreehy-cyber.github.io/songak-meal/${log.id}.jpeg" class="student-photo" onerror="handleImgErr(this, '${log.id}')">`;
              let faceCard = `<div class="student-card ${allergyClass} ${unauthClass}"><div class="newest-badge"></div><button class="btn-close-card" onclick="removeCard(this)">✖</button>${badgeHtml}${photoHtml}<div class="student-info"><div class="student-id">${log.id}</div><div class="student-name">${log.name}</div>${allergyClass ? `<div class="student-note">알레르기 주의</div>` : ""}</div></div>`;
              newFaces.unshift(faceCard); 
            }
          }
        });
      } else {
        let count = 0;
        for(let i=0; i<logs.length; i++) {
            let log = logs[i];
            let uniqueId = log.time + "_" + log.id;
            let cleanStatus = log.status.replace(/\s*\([^)]*\)/g, '').trim(); 
            
            if (!processedLogIds.has(uniqueId) && !cleanStatus.includes("중복")) {
                processedLogIds.add(uniqueId);
                let allergyClass = cleanStatus.includes("알레르기") ? "allergy" : "", unauthClass = cleanStatus.includes("무단") ? "unauth" : "";
                let badgeHtml = cleanStatus.includes("수동") ? `<div class="manual-badge">✅ 수동입력</div>` : (cleanStatus.includes("무단") ? `<div class="unauth-badge">🚨 무단접근</div>` : "");
                let photoHtml = `<img src="https://happytreehy-cyber.github.io/songak-meal/${log.id}.jpeg" class="student-photo" onerror="handleImgErr(this, '${log.id}')">`;
                let faceCard = `<div class="student-card ${allergyClass} ${unauthClass}"><div class="newest-badge"></div><button class="btn-close-card" onclick="removeCard(this)">✖</button>${badgeHtml}${photoHtml}<div class="student-info"><div class="student-id">${log.id}</div><div class="student-name">${log.name}</div>${allergyClass ? `<div class="student-note">알레르기 주의</div>` : ""}</div></div>`;
                newFaces.push(faceCard); 
                count++;
                if(count >= 8) break; 
            }
        }
      }
      
      lastProcessedLogTime = currentLatestId; 
      if (newFaces.length > 0) {
        let grid = document.getElementById('photo-grid');
        grid.insertAdjacentHTML('afterbegin', newFaces.join(""));
        while(grid.children.length > 8) { grid.removeChild(grid.lastChild); } 
        updateCardNumbers(); 
      }
    }
  </script>
</body>
</html>
