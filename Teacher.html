<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>💻 송악고 석식 모니터링 (교사용)</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f1f5f9; font-family: 'Apple SD Gothic Neo', sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    .header { background-color: #1e293b; color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); z-index: 10; }
    .header-left { display: flex; align-items: baseline; gap: 15px; }
    .title { font-size: 20pt; font-weight: bold; color: #60a5fa; }
    .clock { font-size: 14pt; font-weight: bold; color: #94a3b8; }
    
    .header-right { display: flex; gap: 10px; }
    .top-btn { padding: 8px 15px; font-size: 13pt; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: white; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    .btn-refresh { background: #3b82f6; } .btn-refresh:active { transform: scale(0.95); }
    .btn-close-sys { background: #ef4444; } .btn-close-sys:active { transform: scale(0.95); }

    .main-container { display: flex; flex: 1; padding: 15px; gap: 15px; height: calc(100vh - 80px); box-sizing: border-box; }
    
    /* 왼쪽 패널 (사진 + 학년별 미식사) */
    .left-panel { flex: 2; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
    
    .photo-grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow-y: auto; align-content: start; min-height: 250px; }
    
    .student-card { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding-bottom: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; animation: slideDown 0.3s ease-out; position: relative; }
    .student-card.allergy { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
    .student-card.unauth { border-color: #ef4444; background: #fef2f2; box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }

    .btn-close-card { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 12pt; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 100; transition: 0.2s; }
    .btn-close-card:hover { background: #ef4444; }

    .student-photo { width: 100%; height: 180px; background: #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 40pt; color: white; object-fit: cover; }
    .student-info { margin-top: 8px; text-align: center; }
    .student-id { font-size: 14pt; font-weight: bold; color: #64748b; }
    .student-name { font-size: 22pt; font-weight: 900; color: #1e293b; margin: 3px 0; }
    .student-note { background: #fee2e2; color: #dc2626; padding: 4px 12px; border-radius: 15px; font-weight: bold; font-size: 12pt; display: inline-block; margin-top: 3px; }
    
    .manual-badge { position: absolute; top: 8px; right: 8px; background: #10b981; color: white; font-weight: bold; padding: 6px 10px; border-radius: 8px; font-size: 11pt; box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 10; }
    .unauth-badge { position: absolute; top: 8px; right: 8px; background: #ef4444; color: white; font-weight: bold; padding: 6px 10px; border-radius: 8px; font-size: 11pt; box-shadow: 0 2px 6px rgba(239,68,68,0.5); z-index: 10; animation: blinker 1s linear infinite; }

    /* 학년별 미식사 명단 (왼쪽 아래) */
    .unfed-box { height: 260px; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; }
    .unfed-grid { display: flex; flex: 1; overflow: hidden; }
    .unfed-col { flex: 1; display: flex; flex-direction: column; border-right: 2px solid #f1f5f9; }
    .unfed-col:last-child { border-right: none; }
    .grade-title { background: #334155; color: white; padding: 8px; text-align: center; font-size: 14pt; font-weight: bold; }
    .grade-list { flex: 1; overflow-y: auto; padding: 10px; font-size: 12pt; line-height: 1.6; }
    .unfed-item { padding: 5px; border-bottom: 1px dashed #cbd5e1; display: flex; justify-content: space-between; align-items: center; }

    /* 오른쪽 패널 (통계 뱃지 + 블랙박스) */
    .right-panel { flex: 1; display: flex; flex-direction: column; gap: 15px; position: relative; overflow: hidden; }
    
    /* 학생용과 동일한 식사 현황 뱃지 */
    .stats-box { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .stats-badges-container { display: flex; gap: 10px; justify-content: space-between; }
    .stat-badge { flex: 1; padding: 12px 5px; border-radius: 10px; font-size: 13pt; font-weight: bold; text-align: center; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .stat-total { background: #3b82f6; cursor: pointer; transition: 0.2s; } .stat-total:hover { transform: scale(1.02); }
    .stat-done { background: #10b981; } 
    .stat-left { background: #ef4444; }
    .stat-num { font-size: 22pt; display: block; margin-top: 5px; }

    /* 블랙박스 영역 (오른쪽 아래 꽉 채움) */
    .log-box { flex: 1; background: white; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; }
    .log-title { background: #1e293b; color: white; padding: 12px 20px; font-size: 14pt; font-weight: bold; }
    .log-content { flex: 1; overflow-y: auto; padding: 10px; font-size: 12pt; line-height: 1.8; }
    .log-row { padding: 6px 10px; border-bottom: 1px solid #f1f5f9; display: flex; gap: 10px; }
    .log-time { color: #94a3b8; font-family: monospace; }
    
    .log-error-red { color: #cc0000; font-weight: bold; background: #fce8e8; padding: 2px 8px; border-radius: 6px; }
    .log-error-orange { color: #b35900; font-weight: bold; background: #fef0d9; padding: 2px 8px; border-radius: 6px; }
    .log-manual-green { color: #137333; font-weight: bold; background: #e6f4ea; padding: 2px 8px; border-radius: 6px; }

    /* 경고 팝업 */
    #alert-modal { display: none; position: absolute; bottom: 20px; right: 20px; z-index: 999; }
    .alert-content { background: #ef4444; padding: 30px; border-radius: 15px; border: 4px solid #b91c1c; text-align: center; box-shadow: 0 10px 30px rgba(239,68,68,0.7); width: 320px; }
    .alert-content.animating { animation: popAlert 0.3s infinite alternate; }
    .alert-icon { font-size: 40pt; margin-bottom: 5px; }
    .alert-msg { font-size: 16pt; font-weight: 900; color: white; margin-bottom: 15px; line-height: 1.5; text-shadow: 1px 1px 3px rgba(0,0,0,0.3); }
    .btn-confirm { background: white; color: #ef4444; border: none; padding: 12px 20px; font-size: 14pt; font-weight: 900; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); width: 100%; }

    /* 통계 모달 */
    #stats-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
    .stats-modal-content { background: white; padding: 30px; border-radius: 15px; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .grade-stat-row { display: flex; justify-content: space-between; font-size: 14pt; padding: 12px 0; border-bottom: 1px solid #e2e8f0; font-weight: bold; }

    @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popAlert { from { transform: scale(1); } to { transform: scale(1.05); } }
    @keyframes blinker { 50% { opacity: 0.3; } }
  </style>
</head>
<body>

  <div id="stats-modal">
    <div class="stats-modal-content">
      <h2 style="margin-top:0; color:#2563eb; text-align:center;">📊 학년별 식사 현황</h2>
      <div id="stats-detail-content">로딩 중...</div>
      <button style="width:100%; padding:15px; margin-top:20px; background:#475569; color:white; font-size:14pt; font-weight:bold; border:none; border-radius:8px; cursor:pointer;" onclick="closeStatsModal()">닫기</button>
    </div>
  </div>

  <div class="header">
    <div class="header-left">
      <div class="title">💻 송악고 석식 모니터링 (교사용)</div>
      <div class="clock" id="live-clock">2026. 00. 00. 00:00:00</div>
    </div>
    <div class="header-right">
      <button class="top-btn btn-refresh" onclick="window.location.reload()">🔄 화면 새로고침</button>
      <button class="top-btn btn-close-sys" id="sys-btn" onclick="toggleSystem()">🛑 시스템 마감(차단)</button>
    </div>
  </div>

  <div class="main-container">
    
    <!-- 왼쪽 패널 -->
    <div class="left-panel">
      <!-- 사진 뜨는 곳 -->
      <div class="photo-grid" id="photo-grid"></div>
      
      <!-- 학년별 미식사 명단 (3분할) -->
      <div class="unfed-box">
        <div class="unfed-grid">
          <div class="unfed-col">
            <div class="grade-title">1학년 미식사</div>
            <div class="grade-list" id="unfed-1">로딩 중...</div>
          </div>
          <div class="unfed-col">
            <div class="grade-title">2학년 미식사</div>
            <div class="grade-list" id="unfed-2">로딩 중...</div>
          </div>
          <div class="unfed-col">
            <div class="grade-title">3학년 미식사</div>
            <div class="grade-list" id="unfed-3">로딩 중...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 오른쪽 패널 -->
    <div class="right-panel">
      <!-- 학생용과 동일한 뱃지 식사 현황 -->
      <div class="stats-box">
        <div class="stats-badges-container">
          <div class="stat-badge stat-total" onclick="openStatsModal()">
            총 신청 (클릭👆)<span class="stat-num" id="stat-total">0</span>
          </div>
          <div class="stat-badge stat-done">
            식사 완료<span class="stat-num" id="stat-done">0</span>
          </div>
          <div class="stat-badge stat-left">
            남은 인원<span class="stat-num" id="stat-left">0</span>
          </div>
        </div>
      </div>

      <!-- 실시간 블랙박스 기록 (길게 배치) -->
      <div class="log-box">
        <div class="log-title">⏱️ 실시간 블랙박스 기록 (최근 스캔)</div>
        <div class="log-content" id="log-content">로딩 중...</div>
      </div>

      <!-- 팝업 알림 -->
      <div id="alert-modal">
        <div class="alert-content animating" id="alert-box">
          <div class="alert-icon">🚨</div>
          <div class="alert-msg" id="alert-text">경고!</div>
          <button class="btn-confirm" onclick="closeAlert()">확인 (소리 끄기)</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ★ 선생님의 최신 구글 서버 주소 세팅 완료!
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKZBLj0pzD0dNU_fAvhF6j6x3Xzl7PL5-yYJabG8oZ45qBKonZa2r-9YsJ7-eJkElY/exec";
    
    let lastLogTime = ""; 
    let alertAudio = new Audio('https://t1.daumcdn.net/cfile/tistory/998B4B485C9A208D16?original'); 
    alertAudio.loop = false; 
    let currentStatsDetails = null;

    setInterval(() => { 
      let now = new Date();
      let dateStr = now.getFullYear() + ". " + String(now.getMonth()+1).padStart(2,'0') + ". " + String(now.getDate()).padStart(2,'0') + ".";
      document.getElementById('live-clock').innerText = dateStr + " " + now.toLocaleTimeString('ko-KR'); 
    }, 1000);

    function triggerAlert(msg) {
      document.getElementById('alert-text').innerHTML = msg;
      document.getElementById('alert-modal').style.display = 'block'; 
      document.getElementById('alert-box').classList.add('animating');
      alertAudio.play().catch(e => console.log("자동재생 차단됨")); 
    }

    function closeAlert() {
      document.getElementById('alert-box').classList.remove('animating');
      setTimeout(() => { document.getElementById('alert-modal').style.display = 'none'; }, 200);
    }

    function removeCard(btn) { btn.parentElement.remove(); }

    function toggleSystem() {
      if(!confirm("학생용 태블릿 화면을 마감/차단 하시겠습니까?")) return;
      fetch(SCRIPT_URL + "?action=TOGGLE_SYSTEM")
      .then(r => r.json())
      .then(res => {
         let isClosed = (res.sys_status === "CLOSED");
         updateSysBtn(isClosed);
         alert(isClosed ? "시스템이 마감되었습니다. 학생들이 접속할 수 없습니다." : "시스템이 다시 열렸습니다!");
      });
    }

    function updateSysBtn(isClosed) {
      let btn = document.getElementById('sys-btn');
      if (isClosed) { btn.innerText = "🟢 시스템 열기"; btn.style.background = "#10b981"; } 
      else { btn.innerText = "🛑 시스템 마감(차단)"; btn.style.background = "#ef4444"; }
    }

    function openStatsModal() {
      if(!currentStatsDetails) return;
      let html = "";
      [1, 2, 3].forEach(grade => {
        let st = currentStatsDetails[grade];
        if(st) html += `<div class="grade-stat-row"><span style="color:#2563eb;">${grade}학년</span> <span>총: ${st.total}명</span> <span style="color:#10b981;">완료: ${st.done}명</span> <span style="color:#ef4444;">미식사: ${st.left}명</span></div>`; 
      });
      document.getElementById('stats-detail-content').innerHTML = html;
      document.getElementById('stats-modal').style.display = 'flex';
    }
    function closeStatsModal() { document.getElementById('stats-modal').style.display = 'none'; }

    function refreshData() {
      fetch(SCRIPT_URL + "?action=GET_TEACHER_DATA")
        .then(r => r.json())
        .then(res => {
          if (res.status === "SUCCESS") {
            updateSysBtn(res.sys_status === "CLOSED");
            
            document.getElementById('stat-total').innerText = res.stats.total;
            document.getElementById('stat-done').innerText = res.stats.done;
            document.getElementById('stat-left').innerText = res.stats.left;
            
            // 3학년 분할 리스트 업데이트
            let h1 = "", h2 = "", h3 = "";
            res.unfed.forEach(s => {
              let grade = s.id.charAt(0);
              let noteHtml = s.note ? `<span style="color:#ef4444; font-weight:bold; font-size:11pt;">[${s.note}]</span>` : "";
              let item = `<div class="unfed-item"><span style="color:#475569; font-weight:bold;">${s.id} ${s.name}</span> ${noteHtml}</div>`;
              if (grade === '1') h1 += item;
              else if (grade === '2') h2 += item;
              else if (grade === '3') h3 += item;
            });
            
            let emptyMsg = "<div style='text-align:center; padding:15px; color:#94a3b8; font-weight:bold;'>완료 🎉</div>";
            document.getElementById('unfed-1').innerHTML = h1 || emptyMsg;
            document.getElementById('unfed-2').innerHTML = h2 || emptyMsg;
            document.getElementById('unfed-3').innerHTML = h3 || emptyMsg;
            
            processLogs(res.blackbox);
          }
        }).catch(err => console.log("데이터 통신 에러"));
        
      fetch(SCRIPT_URL + "?action=GET_DETAILS")
        .then(r=>r.json()).then(res => { currentStatsDetails = res; });
    }

    function processLogs(logs) {
      let logHtml = ""; let newFaces = [];
      for (let i = 0; i < logs.length; i++) {
        let log = logs[i], timeStr = new Date(log.time).toLocaleTimeString('ko-KR'), fullId = log.time + "_" + log.id; 
        
        let rowClass = "";
        if (log.status.includes("무단")) rowClass = "log-error-red";
        else if (log.status.includes("중복")) rowClass = "log-error-orange";
        else if (log.status.includes("수동")) rowClass = "log-manual-green";
        
        logHtml += `<div class="log-row"><span class="log-time">[${timeStr}]</span> <span class="${rowClass}">${log.id} ${log.name} - ${log.status}</span></div>`;

        if (i === 0 && fullId !== lastLogTime) {
          lastLogTime = fullId; 
          
          let allergyClass = log.status.includes("알레르기") ? "allergy" : "";
          let unauthClass = log.status.includes("무단") ? "unauth" : "";
          let badgeHtml = "";
          
          if (log.status.includes("무단")) {
            triggerAlert(`🚨 무단 접근!<br><span style="color:#fef08a;">${log.id} ${log.name}</span><br>미신청자입니다!`);
            badgeHtml = `<div class="unauth-badge">🚨 무단접근</div>`;
          } else if (log.status.includes("중복")) {
            triggerAlert(`⚠️ 중복 식사!<br><span style="color:#fef08a;">${log.id} ${log.name}</span><br>이미 통과한 학생!`);
          } else if (log.status.includes("수동")) {
            badgeHtml = `<div class="manual-badge">✅ 수동입력</div>`;
          }

          if(!log.status.includes("중복")) {
            let faceCard = `
              <div class="student-card ${allergyClass} ${unauthClass}">
                <button class="btn-close-card" onclick="removeCard(this)">✖</button>
                ${badgeHtml}
                <div class="student-photo">👤</div>
                <div class="student-info">
                  <div class="student-id">${log.id}</div>
                  <div class="student-name">${log.name}</div>
                  ${allergyClass ? `<div class="student-note">알레르기 주의</div>` : ""}
                </div>
              </div>
            `;
            newFaces.push(faceCard);
          }
        }
      }
      
      document.getElementById('log-content').innerHTML = logHtml;
      
      if (newFaces.length > 0) {
        let grid = document.getElementById('photo-grid');
        grid.insertAdjacentHTML('afterbegin', newFaces.join(""));
        while(grid.children.length > 6) { grid.removeChild(grid.lastChild); }
      }
    }

    setInterval(refreshData, 2000); refreshData();
  </script>
</body>
</html>
