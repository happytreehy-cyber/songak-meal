<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>기본 급식 키오스크</title>
  <style>
    body { font-family: sans-serif; text-align: center; background-color: #f4f4f4; padding-top: 50px; }
    .box { background: white; padding: 40px; border-radius: 10px; width: 300px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input { font-size: 24pt; width: 80%; padding: 10px; text-align: center; margin-bottom: 20px; border: 2px solid #cbd5e1; border-radius: 8px; outline: none; }
    input:focus { border-color: #2563eb; }
    button { font-size: 18pt; padding: 10px 30px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; font-weight: bold; }
    button:active { transform: scale(0.95); }
    #msg { margin-top: 20px; font-size: 16pt; font-weight: bold; color: #10b981; min-height: 25px; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🍽️ 급식 학번 입력</h2>
    <input type="number" id="student-id" placeholder="예: 1101" onkeypress="if(event.keyCode==13) sendData();">
    <br>
    <button onclick="sendData()">입장 확인</button>
    <div id="msg"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0FZdeOEpVNezS7ZpNMuRZgbitx32A-QlVDVFL2OnMDYrXqJRZOBVq2M-NRSjuIVAp/exec";

    function sendData() {
      let id = document.getElementById('student-id').value.trim();
      if(id.length < 4) { alert("학번을 정확히 입력하세요."); return; }
      
      document.getElementById('msg').style.color = "#2563eb";
      document.getElementById('msg').innerText = "기록 중...";
      
      fetch(SCRIPT_URL + "?action=RECORD&id=" + id)
      .then(r => r.text())
      .then(res => {
        if(res === "SUCCESS") {
          document.getElementById('msg').style.color = "#10b981";
          document.getElementById('msg').innerText = id + "번 확인되었습니다!";
          document.getElementById('student-id').value = "";
          document.getElementById('student-id').focus(); 
          setTimeout(() => { document.getElementById('msg').innerText = ""; }, 3000);
        } else {
          document.getElementById('msg').style.color = "#ef4444";
          document.getElementById('msg').innerText = "서버 오류!";
        }
      }).catch(err => {
          document.getElementById('msg').style.color = "#ef4444";
          document.getElementById('msg').innerText = "통신 실패!";
      });
    }
  </script>
</body>
</html>
