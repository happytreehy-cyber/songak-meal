<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>송악고 석식 출입관리시스템</title>
  <!-- 💡 전 세계에서 가장 검증된 순수 초고속 jsQR 엔진 -->
  <script src="https://cdn.jsdelivr.net/npm/jsQR@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background-color: #0b0f19; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex; flex-direction: column; padding: 10px 16px;
      border: 6px solid transparent; transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    body.flash-ok { background-color: #064e3b !important; border-color: #10b981 !important; }
    body.flash-dup, body.flash-err { background-color: #7f1d1d !important; border-color: #ef4444 !important; }

    header {
      position: relative; display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); flex-shrink: 0; z-index: 100;
    }
    .brand-group { display: flex; align-items: center; gap: 10px; }
    .badge-school { background: #2563eb; color: #fff; font-weight: 700; font-size: 0.85rem; padding: 4px 8px; border-radius: 6px; }
    .title-text { font-size: 1.15rem; font-weight: 700; }
    .clock-tag { background: #1e293b; color: #38bdf8; font-size: 0.85rem; font-weight: 600; padding: 4px 12px; border-radius: 20px; border: 1px solid #334155; }
    
    .stats-group { display: flex; gap: 8px; align-items: center; }
    .stat-badge {
      display: flex; align-items: center; gap: 5px; font-size: 0.8rem; font-weight: 700;
      padding: 5px 10px; border-radius: 6px; cursor: pointer; user-select: none;
    }
    .stat-total { background: #382715; color: #fbbf24; border: 1px solid #78350f; }
    .stat-done  { background: #133924; color: #4ade80; border: 1px solid #166534; }
    .stat-left  { background: #3a1919; color: #f87171; border: 1px solid #991b1b; }
    .btn-cam { background: #1f2937; color: #cbd5e1; border: 1px solid #475569; padding: 5px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }

    .main-content { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 16px; flex: 1; margin-top: 10px; min-height: 0; }
    .scanner-card { position: relative; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #1f2937; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    canvas { display: none; }

    .scan-target {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 55%; aspect-ratio: 1/1; border: 3.5px solid #22c55e; border-radius: 20px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.45); pointer-events: none;
    }
    .scanner-tip { position: absolute; bottom: 12px; width: 100%; text-align: center; font-size: 0.85rem; color: #eab308; font-weight: 600; pointer-events: none; }

    .info-card {
      background: #111827; border-radius: 12px; border: 1px solid #1f2937;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center;
    }
    .photo-box {
      width: 150px; height: 195px; border: 2.5px solid #eab308; border-radius: 14px;
      background: #1a2234; display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: #94a3b8; margin-bottom: 16px; overflow: hidden; flex-shrink: 0;
    }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; }

    .status-alert-banner {
      width: 100%; padding: 10px 8px; border-radius: 8px;
      font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; line-height: 1.3;
    }
    .banner-standby { background: transparent; color: #f8fafc; }
    .banner-ok { background: #15803d; color: #ffffff; border: 2px solid #4ade80; }
    .banner-dup, .banner-err { background: #b91c1c; color: #ffffff; border: 2px solid #f87171; }

    .student-info-text { font-size: 1.3rem; font-weight: 700; color: #ffffff; margin-bottom: 4px; }
    .status-sub { font-size: 1.05rem; color: #cbd5e1; margin-bottom: 16px; min-height: 1.4rem; }
    .engine-tag { background: #1e293b; color: #38bdf8; font-size: 0.8rem; padding: 6px 16px; border-radius: 20px; border: 1px solid #0284c7; }

    .right-top-modal {
      position: absolute; top: 50px; right: 16px; width: 340px; background: #182234;
      border: 1px solid #38bdf8; border-radius: 12px; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.7); display: none; z-index: 1000;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-title { font-size: 1rem; font-weight: 700; color: #38bdf8; }
    .modal-close { background: none; border: none; color: #94a3b8; font-size: 1.3rem; cursor: pointer; }
    .grade-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #0f172a; border-radius: 6px; margin-bottom: 6px; font-size: 0.9rem; font-weight: 600; }
  </style>
</head>
<body onclick="initAudioContext()">

  <header>
    <div class="brand-group">
      <span class="badge-school">송악고</span>
      <span class="title-text">석식 시스템</span>
      <span class="clock-tag" id="liveClock">2026-09-10 00:00:00</span>
    </div>
    
    <div class="stats-group">
      <div class="stat-badge stat-total" onclick="toggleGradeModal()">📊 총신청 <span id="cntTotal">0</span></div>
      <div class="stat-badge stat-done" onclick="toggleGradeModal()">🍱 식사완료 <span id="cntDone">0</span></div>
      <div class="stat-badge stat-left" onclick="toggleGradeModal()">⏳ 미식사 <span id="cntLeft">0</span></div>
      <button class="btn-cam" onclick="toggleCamera()">카메라 전환</button>
    </div>

    <div class="right-top-modal" id="gradeModal">
      <div class="modal-header">
        <div class="modal-title">학년별 실시간 현황</div>
        <button class="modal-close" onclick="closeGradeModal()">&times;</button>
      </div>
      <div id="modalList">
        <div class="grade-row"><span>1학년</span><span id="g1-stat">조회 중...</span></div>
        <div class="grade-row"><span>2학년</span><span id="g2-stat">조회 중...</span></div>
        <div class="grade-row"><span>3학년</span><span id="g3-stat">조회 중...</span></div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="scanner-card">
      <video id="video" autoplay playsinline muted></video>
      <div class="scan-target" id="scanTarget"></div>
      <div class="scanner-tip">⚡ 카메라와 명찰 거리를 약 20~30cm 유지해 주세요</div>
    </div>

    <div class="info-card">
      <div class="photo-box" id="photoBox">사진 대기</div>
      <div class="status-alert-banner banner-standby" id="statusBanner">대기 중</div>
      <div class="student-info-text" id="studentInfo">-</div>
      <div class="status-sub" id="statusSub">명찰 QR을 비춰주세요</div>
      <div class="engine-tag" id="engineTag">초경량 480p 고속 스캔 가동 중</div>
    </div>
  </main>

  <canvas id="canvas"></canvas>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxKZBLj0pzD0dNU_fAvhF6j6x3Xzl7PL5-yYJabG8oZ45qBKonZa2r-9YsJ7-eJkElY/exec";
    const PHOTO_BASE_URL = "./photos/";

    let currentFacingMode = "user"; 
    let videoStream = null;
    let isProcessing = false;
    let lastScanTick = 0;

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    function updateClock() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById("liveClock").innerText = 
        `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    let audioCtx = null;
    function initAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playDingDong() {
      initAudioContext();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator(); const gain1 = audioCtx.createGain();
      osc1.frequency.setValueAtTime(659.25, now); gain1.gain.setValueAtTime(0.3, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc1.connect(gain1); gain1.connect(audioCtx.destination); osc1.start(now); osc1.stop(now + 0.35);

      const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
      osc2.frequency.setValueAtTime(523.25, now + 0.15); gain2.gain.setValueAtTime(0.3, now + 0.15);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc2.connect(gain2); gain2.connect(audioCtx.destination); osc2.start(now + 0.15); osc2.stop(now + 0.6);
    }

    function playWarningBeep() {
      initAudioContext();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      [0, 0.18].forEach(delay => {
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.type = "square"; osc.frequency.setValueAtTime(400, now + delay);
        gain.gain.setValueAtTime(0.25, now + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.12);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + delay); osc.stop(now + delay + 0.12);
      });
    }

    async function startCamera(facingMode) {
      if (videoStream) videoStream.getTracks().forEach(track => track.stop());
      try {
        const constraints = { 
          video: { 
            facingMode: { ideal: facingMode }, 
            width: { ideal: 640 }, 
            height: { ideal: 480 } 
          } 
        };
        videoStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = videoStream;
        video.setAttribute("playsinline", "true");
        await video.play();

        if (facingMode === "user") video.style.transform = "scaleX(-1)";
        else video.style.transform = "scaleX(1)";
        
        requestAnimationFrame(scanLoop);
      } catch (err) { 
        console.error("카메라 에러:", err); 
        document.getElementById("statusSub").innerText = "카메라 권한을 확인해주세요.";
      }
    }

    function toggleCamera() {
      currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
      startCamera(currentFacingMode);
    }

    async function fetchStats() {
      try {
        const res = await fetch(`${GAS_URL}?action=GET_DETAILS`);
        const d = await res.json();
        if (d && d.totalStats) {
          document.getElementById("cntTotal").innerText = d.totalStats.total || 0;
          document.getElementById("cntDone").innerText = d.totalStats.done || 0;
          document.getElementById("cntLeft").innerText = d.totalStats.left || 0;
        }
      } catch (e) {}
    }
    setInterval(fetchStats, 5000);

    // 💡 [핵심] 절대 죽지 않는 불사신 초경량 스캔 루프
    function scanLoop() {
      // 프레임 예약은 최상단에서 실행 (에러가 나도 스캐너 루프가 절대 죽지 않음)
      requestAnimationFrame(scanLoop);

      if (isProcessing) return;
      if (!video || video.readyState < 2 || video.videoWidth <= 0 || video.videoHeight <= 0) return;

      const now = Date.now();
      // 💡 초당 10회만 가볍게 스캔 (태블릿 CPU 부하 5% 미만, 카메라 자동초점 100% 보장)
      if (now - lastScanTick < 100) return;
      lastScanTick = now;

      try {
        // 💡 480px 초경량 크기로 즉시 디코딩 (모듈이 뚜렷하게 살아남아 번개처럼 인식)
        const scanW = 480;
        const scanH = Math.round(scanW * (video.videoHeight / video.videoWidth)) || 360;

        if (canvas.width !== scanW || canvas.height !== scanH) {
          canvas.width = scanW;
          canvas.height = scanH;
        }

        ctx.drawImage(video, 0, 0, scanW, scanH);
        const imageData = ctx.getImageData(0, 0, scanW, scanH);
        const code = jsQR(imageData.data, scanW, scanH, { inversionAttempts: "dontInvert" });

        if (code && code.data && code.data.trim() !== "") {
          sendToServer(code.data.trim());
        }
      } catch (e) {
        console.warn("스캔 일시 오류 건너뜀:", e);
      }
    }

    function applyFeedback(statusType, studentName, studentId, customMsg) {
      const banner = document.getElementById("statusBanner");
      const infoEl = document.getElementById("studentInfo");
      const subEl = document.getElementById("statusSub");
      const target = document.getElementById("scanTarget");

      document.body.className = "";
      banner.className = "status-alert-banner";

      if (statusType === "SUCCESS") {
        document.body.classList.add("flash-ok");
        banner.classList.add("banner-ok");
        banner.innerText = "✔ 정상 승인 (맛있게 드세요!)";
        infoEl.innerText = `${studentId} ${studentName}`;
        subEl.innerText = "식사 승인 완료 (출석부 & 블랙박스 기록됨)";
        target.style.borderColor = "#22c55e";
        playDingDong();
      } else if (statusType === "DUPLICATE") {
        document.body.classList.add("flash-dup");
        banner.classList.add("banner-dup");
        banner.innerText = "⚠ 중복 식사 감지!";
        infoEl.innerText = `${studentId} ${studentName || ''}`;
        subEl.innerText = "이미 식사한 학생입니다";
        target.style.borderColor = "#ef4444";
        playWarningBeep();
      } else {
        document.body.classList.add("flash-err");
        banner.classList.add("banner-err");
        banner.innerText = customMsg || "당일 석식 미신청자입니다";
        infoEl.innerText = `${studentId}`;
        subEl.innerText = customMsg || "승인 거부 (명단 없음)";
        target.style.borderColor = "#ef4444";
        playWarningBeep();
      }
    }

    async function sendToServer(rawCode) {
      isProcessing = true; // 스캔 중복 입력 방지
      initAudioContext();

      const photoEl = document.getElementById("photoBox");
      const studentId = rawCode.split(/[^0-9]/)[0] || rawCode;
      photoEl.innerHTML = `<img src="${PHOTO_BASE_URL}${studentId}.jpeg" onerror="this.src=''; this.parentElement.innerText='사진 대기';">`;
      document.getElementById("statusSub").innerText = "확인 중...";

      try {
        const res = await fetch(`${GAS_URL}?id=${encodeURIComponent(rawCode)}`);
        const data = await res.json();

        if (data.status === "SUCCESS") {
          applyFeedback("SUCCESS", data.name, data.studentId);
          if (data.stats) updateStatsDisplay(data.stats);
        } else if (data.status === "DUPLICATE") {
          applyFeedback("DUPLICATE", data.name, data.studentId);
          if (data.stats) updateStatsDisplay(data.stats);
        } else if (data.status === "NOT_FOUND") {
          applyFeedback("NOT_FOUND", "", studentId);
          if (data.stats) updateStatsDisplay(data.stats);
        } else {
          applyFeedback("ERROR", "", studentId, data.message);
        }
      } catch (err) {
        applyFeedback("ERROR", "", studentId, "서버 연결 오류");
      }

      // 1.5초 후 즉시 다음 스캔 대기로 복귀
      setTimeout(() => {
        document.body.className = "";
        const banner = document.getElementById("statusBanner");
        banner.className = "status-alert-banner banner-standby";
        banner.innerText = "대기 중";
        document.getElementById("studentInfo").innerText = "-";
        document.getElementById("statusSub").innerText = "명찰 QR을 비춰주세요";
        document.getElementById("scanTarget").style.borderColor = "#22c55e";
        photoEl.innerText = "사진 대기";
        isProcessing = false;
      }, 1500);
    }

    function updateStatsDisplay(s) {
      document.getElementById("cntTotal").innerText = s.total;
      document.getElementById("cntDone").innerText = s.done;
      document.getElementById("cntLeft").innerText = s.left;
    }

    async function toggleGradeModal() {
      const m = document.getElementById("gradeModal");
      if (m.style.display === "block") { m.style.display = "none"; return; }
      m.style.display = "block";
      try {
        const res = await fetch(`${GAS_URL}?action=GET_DETAILS`);
        const d = await res.json();
        if (d) {
          if (d[1]) document.getElementById("g1-stat").innerText = `완료: ${d[1].done}명 / 미식사: ${d[1].left}명 (총 ${d[1].total}명)`;
          if (d[2]) document.getElementById("g2-stat").innerText = `완료: ${d[2].done}명 / 미식사: ${d[2].left}명 (총 ${d[2].total}명)`;
          if (d[3]) document.getElementById("g3-stat").innerText = `완료: ${d[3].done}명 / 미식사: ${d[3].left}명 (총 ${d[3].total}명)`;
        }
      } catch (e) {}
    }

    function closeGradeModal() { document.getElementById("gradeModal").style.display = "none"; }

    window.addEventListener("DOMContentLoaded", () => { 
      startCamera(currentFacingMode); 
      fetchStats(); 
    });
  </script>
</body>
</html>
